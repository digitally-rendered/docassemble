{{- if and (not .Values.redis.external) .Values.redis.internal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docassemble.fullname" . }}-redis
  labels:
    {{- include "docassemble.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "docassemble.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "docassemble.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.internal.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          command:
            - redis-server
            - --appendonly
            - "yes"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            {{- if .Values.redis.internal.persistence.enabled }}
            - name: redis-data
              mountPath: /data
            {{- end }}
      volumes:
        {{- if .Values.redis.internal.persistence.enabled }}
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "docassemble.fullname" . }}-redis-pvc
        {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docassemble.fullname" . }}-redis
  labels:
    {{- include "docassemble.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "docassemble.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis

{{- if .Values.redis.internal.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "docassemble.fullname" . }}-redis-pvc
  labels:
    {{- include "docassemble.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.internal.persistence.size }}
{{- end }}
{{- end }}
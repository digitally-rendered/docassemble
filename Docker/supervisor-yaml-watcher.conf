[program:yamlwatcher]
command=/usr/share/docassemble/scripts/watch-yaml-changes.sh
directory=/usr/share/docassemble
priority=900  ; Higher number = lower priority, starts after other services
startsecs=10  ; Give it more time to start
startretries=5  ; Retry multiple times if it fails
autostart=false  ; Don't auto-start, let initialize.sh start it
autorestart=unexpected  ; Only restart on unexpected exits
exitcodes=0  ; Expected exit code
stopasgroup=true
killasgroup=true
stdout_logfile=/usr/share/docassemble/log/yaml-watcher.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
stderr_logfile=/usr/share/docassemble/log/yaml-watcher-error.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2
user=www-data
environment=YAML_STARTUP_DELAY="45",YAML_CHECK_INTERVAL="3",YAML_DEBOUNCE_DELAY="2"
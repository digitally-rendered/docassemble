[program:yamlwatcher]
command=/usr/share/docassemble/scripts/watch-yaml-changes.sh
directory=/usr/share/docassemble
priority=600
startsecs=5
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=www-data
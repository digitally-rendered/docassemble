---
metadata:
  title: Ontario Family Law Form 8 - Application (General) - Comprehensive
  short title: Form 8 - Comprehensive Application
  description: Complete Ontario Family Court Form 8 with all required fields for court filing
---
objects:
  - applicant: Individual
  - respondent: Individual
  - claims_selection: DADict
  - court_info: DAObject
---
# Main interview flow
mandatory: True
code: |
  # Introduction and case type
  intro_screen
  case_type_determination
  
  # Court information
  court_info.location
  if case_type_determination == 'existing':
    court_info.file_number
  
  # Applicant information (full details)
  applicant.name.first
  applicant.name.last
  applicant.address.address
  applicant.phone_number
  applicant.email
  applicant.birthdate
  
  # Respondent information (full details)  
  respondent.name.first
  respondent.name.last
  respondent.address.address
  respondent.phone_number
  
  # Claims selection
  claims_selection
  
  # Final summary
  final_screen
---
question: |
  Ontario Family Law Form 8 - Application (General)
subquestion: |
  This comprehensive form collects all information required for filing Form 8 with the Ontario courts.
  
  **Important Legal Disclaimer:** This system provides legal information, not legal advice. 
  You should consult with a lawyer or contact Legal Aid Ontario for legal advice.
  
  **What this form collects:**
  - Complete applicant and respondent information
  - Court and case details
  - Claims for relief
field: intro_screen
---
question: |
  Case Type Determination
subquestion: |
  Is this a new family law case or are you adding to an existing case?
field: case_type_determination
choices:
  - This is a new case: new
  - This is an existing case (I have a court file number): existing
help: |
  Choose "new case" if this is the first time you're going to court about this family matter.
  Choose "existing case" if you already have a court file number.
---
question: |
  Court Location
subquestion: |
  Where will you file your application?
fields:
  - Court Location: court_info.location
    choices:
      - Toronto Superior Court: toronto
      - Ottawa Superior Court: ottawa
      - Hamilton Superior Court: hamilton
      - London Superior Court: london
      - Windsor Superior Court: windsor
      - Thunder Bay Superior Court: thunder_bay
      - Sudbury Superior Court: sudbury
      - Kingston Superior Court: kingston
      - Other: other
---
question: |
  Court File Number
subquestion: |
  Enter the court file number for the existing case.
field: court_info.file_number
help: |
  Format: FC-12-345678 or similar
show if:
  variable: case_type_determination
  is: existing
validation code: |
  import re
  if not re.match(r'^[A-Z]{1,3}-\d{2}-\d{6}(-\d{2})?$', court_info.file_number.upper()):
    validation_error("Please enter a valid court file number format (e.g., FC-12-345678)")
---
question: |
  Your Complete Information
subquestion: |
  Please provide your complete legal information as the applicant.
fields:
  - First Name: applicant.name.first
    required: True
  - Last Name: applicant.name.last
    required: True
  - Date of Birth: applicant.birthdate
    datatype: date
    required: True
  - Street Address: applicant.address.address
    required: True
  - City: applicant.address.city
    required: True
  - Province: applicant.address.state
    default: Ontario
    choices:
      - Ontario
  - Postal Code: applicant.address.zip
    required: True
    help: Format: A1A 1A1
  - Phone Number: applicant.phone_number
    required: True
    help: Include area code
  - Email Address: applicant.email
    datatype: email
    required: True
validation code: |
  import re
  # Validate postal code
  postal_code = applicant.address.zip.upper().replace(" ", "")
  if not re.match(r'^[A-Z]\d[A-Z]\d[A-Z]\d$', postal_code):
    validation_error("Please enter a valid Canadian postal code")
  applicant.address.zip = postal_code[:3] + " " + postal_code[3:]
  
  # Validate phone number
  phone = re.sub(r'[^\d]', '', applicant.phone_number)
  if len(phone) != 10:
    validation_error("Please enter a valid 10-digit phone number")
  applicant.phone_number = f"({phone[:3]}) {phone[3:6]}-{phone[6:]}"
---
question: |
  Other Party's Information
subquestion: |
  Please provide complete information about the respondent (the other party).
fields:
  - First Name: respondent.name.first
    required: True
  - Last Name: respondent.name.last
    required: True
  - Street Address: respondent.address.address
    required: True
  - City: respondent.address.city
    required: True
  - Province: respondent.address.state
    default: Ontario
    choices:
      - Ontario
  - Postal Code: respondent.address.zip
    required: True
    help: Format: A1A 1A1
  - Phone Number (if known): respondent.phone_number
    required: False
    help: Include area code
validation code: |
  import re
  postal_code = respondent.address.zip.upper().replace(" ", "")
  if not re.match(r'^[A-Z]\d[A-Z]\d[A-Z]\d$', postal_code):
    validation_error("Please enter a valid Canadian postal code")
  respondent.address.zip = postal_code[:3] + " " + postal_code[3:]
  
  if respondent.phone_number:
    phone = re.sub(r'[^\d]', '', respondent.phone_number)
    if len(phone) != 10:
      validation_error("Please enter a valid 10-digit phone number")
    respondent.phone_number = f"({phone[:3]}) {phone[3:6]}-{phone[6:]}"
---
question: |
  Claims for Relief
subquestion: |
  What are you asking the court to order? Select all that apply.
field: claims_selection
datatype: checkboxes
choices:
  - Divorce: divorce
  - Custody of children: custody
  - Access/parenting time with children: access
  - Child support: child_support
  - Spousal support: spousal_support
  - Division of property: property_division
  - Exclusive possession of matrimonial home: exclusive_possession
  - Restraining order: restraining_order
  - Other relief: other_relief
validation code: |
  selected_claims = [k for k, v in claims_selection.items() if v]
  if not selected_claims:
    validation_error("You must select at least one claim.")
help: |
  **Definitions:**
  - **Divorce:** Legal end to marriage
  - **Custody:** Legal responsibility for major decisions about children
  - **Access:** Time spent with children (parenting time)
  - **Child Support:** Financial support for children's needs
  - **Spousal Support:** Financial support between spouses/partners
  - **Property Division:** Sharing of assets and debts from the relationship
---
mandatory: True
question: |
  Your Complete Application Summary
subquestion: |
  Please review all information before submitting:
  
  **Case Type:** ${ case_type_determination.title() } case
  **Court:** ${ court_info.location.title().replace('_', ' ') }
  % if case_type_determination == 'existing':
  **File Number:** ${ court_info.file_number }
  % endif
  
  **Applicant:** ${ applicant.name.first } ${ applicant.name.last }
  **Address:** ${ applicant.address.address }, ${ applicant.address.city }, ${ applicant.address.state } ${ applicant.address.zip }
  **Phone:** ${ applicant.phone_number } | **Email:** ${ applicant.email }
  **Date of Birth:** ${ applicant.birthdate }
  
  **Respondent:** ${ respondent.name.first } ${ respondent.name.last }
  **Address:** ${ respondent.address.address }, ${ respondent.address.city }, ${ respondent.address.state } ${ respondent.address.zip }
  % if respondent.phone_number:
  **Phone:** ${ respondent.phone_number }
  % endif
  
  **Claims:**
  % for claim in claims_selection:
  % if claims_selection[claim]:
  - ${ claim.title().replace('_', ' ') }
  % endif
  % endfor
  
  **Next Steps:**
  1. Print and sign the completed Form 8
  2. File at the court with required filing fees
  3. Serve the respondent within required timeframes
  4. Complete additional required forms (Financial Statement if claiming support)
  
  **Filing Fees (2024):** $202.00 (fee waiver may be available for financial hardship)
  
  **Legal Reminder:** Consider consulting with a lawyer for complex matters. Contact Legal Aid Ontario at 1-800-668-8258 for assistance.

buttons:
  - Restart: restart
  - Exit: exit
field: final_screen
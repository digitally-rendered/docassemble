# ========================================
# INTRODUCTION AND CRITICAL WARNINGS
# ========================================
mandatory: True
question: |
  Form 36 - Affidavit for Divorce
  
  ## CRITICAL LEGAL WARNING - PERJURY IMPLICATIONS
  
  **This is a sworn affidavit that will be made under oath before a Commissioner of Oaths. Making false statements in an affidavit is perjury, which is a criminal offence punishable by up to 14 years in prison.**
  
subquestion: |
  ### What is Form 36?
  
  Form 36 is a sworn affidavit required for:
  - **Uncontested divorce applications** (when respondent doesn't file an Answer)
  - **Certificate divorces** (simplified divorce process)
  - **Confirming facts** stated in your original divorce application
  
  ### When is Form 36 Required?
  
  You must file Form 36 when:
  - Your divorce application is uncontested (no Answer filed)
  - You're applying for a certificate of divorce
  - The court requires confirmation of facts under oath
  - Sufficient time has passed since service on the respondent
  
  ### Legal Significance
  
  This affidavit confirms under oath that:
  - All facts in your divorce application are true
  - Proper service was completed (if required)
  - Waiting periods have been satisfied
  - Children's arrangements are in their best interests
  - Financial arrangements are fair and adequate
  - No reconciliation has occurred since filing
  
  ### Professional Legal Advice
  
  **Strongly Recommended:** Consult with a qualified Ontario family lawyer before swearing this affidavit. Contact the Law Society of Ontario's Referral Service at 1-855-947-5255 or visit lso.ca.
  
field: form36_introduction_acknowledged
datatype: checkboxes
options:
  - "I understand this is a sworn legal document with serious perjury implications": perjury_warning
  - "I understand I need a Commissioner of Oaths to swear this affidavit": commissioner_requirement
  - "I understand I should consider getting legal advice before proceeding": legal_advice_recommendation
validation code: |
  if not (perjury_warning and commissioner_requirement and legal_advice_recommendation):
    validation_error("You must acknowledge all warnings before proceeding with this sworn affidavit.")
help: |
  **Perjury Warning:** Making false statements in a sworn affidavit is a serious criminal offence. Only proceed if you can swear that all statements are true to the best of your knowledge.
  
  **Commissioner of Oaths:** You will need to appear before a Commissioner of Oaths (lawyer, notary public, or court official) to swear this affidavit. They will verify your identity and witness your oath.
  
  **Legal Advice:** Given the legal complexity and potential consequences, it's highly advisable to consult with a family lawyer who can review your situation and ensure accuracy.
---
# ========================================
# AFFIANT INFORMATION
# ========================================
question: |
  Your Information (Affiant Details)
subquestion: |
  As the person swearing this affidavit, provide your complete and accurate information:
fields:
  - "Full legal name": form36_data.affiant_info.full_name
    required: True
  - "Date of birth": form36_data.affiant_info.date_of_birth
    datatype: date
    required: True
  - "Current address": form36_data.affiant_info.current_address
    input type: area
    required: True
  - "City/Town": form36_data.affiant_info.city
    required: True
  - "Province": form36_data.affiant_info.province
    default: "Ontario"
    required: True
  - "Postal Code": form36_data.affiant_info.postal_code
    required: True
  - "Phone number": form36_data.affiant_info.phone
    required: True
  - "Email address": form36_data.affiant_info.email
    datatype: email
    required: False
  - "Occupation": form36_data.affiant_info.occupation
    required: True
  - "Relationship to this case": form36_data.affiant_info.relationship_to_case
    choices:
      - "Applicant": applicant
      - "Respondent": respondent
      - "Other (specify)": other
    required: True
  - "If other, specify": form36_data.affiant_info.other_relationship
    show if:
      variable: form36_data.affiant_info.relationship_to_case
      is: "other"
validation code: |
  # Validate Canadian postal code format
  import re
  postal_pattern = r'^[A-Za-z]\d[A-Za-z]\s?\d[A-Za-z]\d$'
  if not re.match(postal_pattern, form36_data.affiant_info.postal_code):
    validation_error("Please enter a valid Canadian postal code (e.g., A1A 1A1)")
help: |
  **Important:** This information must exactly match your legal identification documents. Any discrepancies could invalidate your affidavit.
  
  The affiant is the person making the sworn statement - typically the applicant in divorce proceedings.
---
# ========================================
# COURT AND CASE INFORMATION
# ========================================
question: |
  Court and Case Information
subquestion: |
  Provide the court and case details for your divorce application:
fields:
  - "Court location": form36_data.case_info.court_location
    required: True
    help: |
      The specific courthouse where your divorce application was filed (e.g., "Toronto" or "Ottawa")
  - "Court file number": form36_data.case_info.court_file_number
    required: True
    help: |
      The file number assigned when your divorce application was filed
  - "Date application was filed": form36_data.case_info.application_filed_date
    datatype: date
    required: True
  - "Type of divorce application": form36_data.case_info.application_type
    choices:
      - "Simple divorce (no children, no property issues)": simple
      - "Divorce with children": with_children  
      - "Divorce with property issues": with_property
      - "Divorce with both children and property issues": with_both
    required: True
  - "Current status": form36_data.case_info.current_status
    choices:
      - "Uncontested (no Answer filed)": uncontested
      - "Contested but now resolved": resolved
      - "Applying for certificate of divorce": certificate
    required: True
validation code: |
  # Validate that sufficient time has passed since filing
  import datetime
  filed_date = form36_data.case_info.application_filed_date
  current_date = current_datetime().date()
  days_since_filing = (current_date - filed_date).days
  
  if days_since_filing < 30:
    validation_error("You must wait at least 30 days after filing your application before submitting Form 36, unless ordered otherwise by the court.")
help: |
  **Court File Number:** This is crucial for matching your affidavit to your divorce application. Double-check this number.
  
  **Timing Requirements:** Form 36 is typically filed after waiting periods have been satisfied and when proceeding with an uncontested divorce.
---
# ========================================
# MARRIAGE DETAILS CONFIRMATION
# ========================================
question: |
  Marriage Details Confirmation
subquestion: |
  **You must confirm that the marriage details in this affidavit exactly match those in your original divorce application.**
  
  Under oath, confirm the following marriage details:
fields:
  - "Your full name at time of marriage": form36_data.marriage_confirmation.applicant_name_at_marriage
    required: True
  - "Spouse's full name at time of marriage": form36_data.marriage_confirmation.spouse_name_at_marriage
    required: True
  - "Date of marriage": form36_data.marriage_confirmation.marriage_date
    datatype: date
    required: True
  - "Place of marriage (city/town)": form36_data.marriage_confirmation.marriage_place_city
    required: True
  - "Province/state of marriage": form36_data.marriage_confirmation.marriage_place_province
    required: True
  - "Country of marriage": form36_data.marriage_confirmation.marriage_place_country
    default: "Canada"
    required: True
  - "Were you married in a religious or civil ceremony?": form36_data.marriage_confirmation.ceremony_type
    choices:
      - "Religious ceremony": religious
      - "Civil ceremony": civil
    required: True
  - "Name of officiant who performed ceremony": form36_data.marriage_confirmation.officiant_name
    required: True
  - "Do you have a marriage certificate?": form36_data.marriage_confirmation.has_marriage_certificate
    datatype: yesnoradio
    required: True
  - "Marriage certificate number": form36_data.marriage_confirmation.certificate_number
    show if: form36_data.marriage_confirmation.has_marriage_certificate
    required: False
validation code: |
  # Validate marriage date is not in the future and person was legal age
  import datetime
  marriage_date = form36_data.marriage_confirmation.marriage_date
  current_date = current_datetime().date()
  
  if marriage_date > current_date:
    validation_error("Marriage date cannot be in the future.")
  
  # Calculate if person was at least 18 at time of marriage (or 16 with parental consent)
  birth_date = form36_data.affiant_info.date_of_birth
  age_at_marriage = (marriage_date - birth_date).days / 365.25
  
  if age_at_marriage < 16:
    validation_error("You must have been at least 16 years old at the time of marriage.")
help: |
  **Critical Accuracy:** These details must exactly match your original divorce application and your marriage certificate. Any discrepancies could delay your divorce.
  
  **Marriage Certificate:** If you don't have the certificate number, you can usually obtain this information from the vital statistics office where the marriage was registered.
---
# ========================================
# SEPARATION DETAILS CONFIRMATION
# ========================================
question: |
  Separation Details Confirmation
subquestion: |
  Confirm the separation details that establish grounds for divorce:
fields:
  - "Date of separation": form36_data.separation_confirmation.separation_date
    datatype: date
    required: True
  - "Have you and your spouse lived separate and apart since the separation date?": form36_data.separation_confirmation.lived_separate_and_apart
    datatype: yesnoradio
    required: True
  - "If no, explain any periods of cohabitation": form36_data.separation_confirmation.cohabitation_explanation
    input type: area
    show if:
      variable: form36_data.separation_confirmation.lived_separate_and_apart
      is: False
  - "Ground for divorce": form36_data.separation_confirmation.divorce_ground
    choices:
      - "Separation for at least one year": separation_one_year
      - "Adultery": adultery
      - "Physical or mental cruelty": cruelty
    required: True
  - "If adultery or cruelty, provide brief details": form36_data.separation_confirmation.ground_details
    input type: area
    show if:
      variable: form36_data.separation_confirmation.divorce_ground
      is: "adultery" or "cruelty"
  - "Current living arrangement": form36_data.separation_confirmation.current_living_arrangement
    choices:
      - "Living in separate residences": separate_residences
      - "Living in same residence but separated": same_residence_separated
    required: True
  - "If living in same residence, explain separation arrangements": form36_data.separation_confirmation.same_residence_details
    input type: area
    show if:
      variable: form36_data.separation_confirmation.current_living_arrangement
      is: "same_residence_separated"
validation code: |
  import datetime
  separation_date = form36_data.separation_confirmation.separation_date
  current_date = current_datetime().date()
  marriage_date = form36_data.marriage_confirmation.marriage_date
  
  # Separation cannot be before marriage
  if separation_date < marriage_date:
    validation_error("Separation date cannot be before marriage date.")
  
  # For separation ground, must be at least one year
  if form36_data.separation_confirmation.divorce_ground == "separation_one_year":
    days_separated = (current_date - separation_date).days
    if days_separated < 365:
      validation_error("For divorce based on separation, you must be separated for at least one year before the divorce can be granted.")
help: |
  **Separation Definition:** In family law, separation means the spouses have decided to live apart with the intention of ending the marriage relationship.
  
  **One Year Requirement:** If using separation as grounds, you must be separated for a full year before the divorce can be granted.
  
  **Same Residence Separation:** Spouses can be legally separated while living in the same home if they live separate lives (separate bedrooms, meals, social activities, etc.).
---
# ========================================
# SERVICE CONFIRMATION
# ========================================
question: |
  Service of Documents Confirmation
subquestion: |
  Confirm how your spouse was served with the divorce application:
fields:
  - "Was your spouse served with the divorce application?": form36_data.service_confirmation.spouse_served
    datatype: yesnoradio
    required: True
  - "Method of service": form36_data.service_confirmation.service_method
    choices:
      - "Personal service": personal
      - "Alternative service (court ordered)": alternative
      - "Service by mail (with acknowledgment)": mail_with_acknowledgment
      - "Service by email": email_service
      - "Other method": other
    show if: form36_data.service_confirmation.spouse_served
    required: True
  - "Date of service": form36_data.service_confirmation.service_date
    datatype: date
    show if: form36_data.service_confirmation.spouse_served
    required: True
  - "Person who served documents": form36_data.service_confirmation.server_name
    show if: form36_data.service_confirmation.spouse_served
    required: True
  - "Address where service was effected": form36_data.service_confirmation.service_address
    input type: area
    show if: form36_data.service_confirmation.spouse_served
    required: True
  - "Did your spouse file an Answer (Form 10)?": form36_data.service_confirmation.answer_filed
    datatype: yesnoradio
    show if: form36_data.service_confirmation.spouse_served
    required: True
  - "Date Answer was filed": form36_data.service_confirmation.answer_filed_date
    datatype: date
    show if: 
      variable: form36_data.service_confirmation.answer_filed
      is: True
  - "Has sufficient time passed since service for spouse to file an Answer?": form36_data.service_confirmation.sufficient_time_passed
    datatype: yesnoradio
    show if: 
      variable: form36_data.service_confirmation.answer_filed
      is: False
    required: True
  - "Explain why service was not required": form36_data.service_confirmation.no_service_explanation
    input type: area
    show if:
      variable: form36_data.service_confirmation.spouse_served
      is: False
    help: |
      Common reasons include: joint application, spouse's whereabouts unknown after diligent search, court order dispensing with service.
validation code: |
  if form36_data.service_confirmation.spouse_served:
    import datetime
    service_date = form36_data.service_confirmation.service_date
    current_date = current_datetime().date()
    application_date = form36_data.case_info.application_filed_date
    
    # Service cannot be before application filed
    if service_date < application_date:
      validation_error("Service date cannot be before the application was filed.")
    
    # Check if sufficient time has passed for Answer
    if not form36_data.service_confirmation.answer_filed:
      days_since_service = (current_date - service_date).days
      if days_since_service < 30:
        if form36_data.service_confirmation.sufficient_time_passed is not False:
          validation_error("Usually 30 days must pass after service before proceeding if no Answer is filed. Confirm this is correct for your situation.")
help: |
  **Service Requirements:** Your spouse must be properly served with the divorce application unless the court has ordered otherwise or this is a joint application.
  
  **Answer Period:** After being served, a spouse typically has 30 days (if in Canada) or 60 days (if outside Canada) to file an Answer.
  
  **Uncontested Divorce:** If no Answer is filed within the time limit, the divorce becomes uncontested and you can proceed with Form 36.
---
# ========================================
# CHILDREN ARRANGEMENTS
# ========================================
question: |
  Children and Arrangements
subquestion: |
  Provide information about any children and arrangements for their care:
fields:
  - "Are there any children of the marriage under 18 years old?": form36_data.children_confirmation.has_minor_children
    datatype: yesnoradio
    required: True
  - "Number of children under 18": form36_data.children_confirmation.number_of_minor_children
    datatype: integer
    show if: form36_data.children_confirmation.has_minor_children
    required: True
  - "Are there any children 18 or over who are still dependent?": form36_data.children_confirmation.has_dependent_adult_children
    datatype: yesnoradio
    required: True
  - "Number of dependent adult children": form36_data.children_confirmation.number_of_dependent_adult_children
    datatype: integer
    show if: form36_data.children_confirmation.has_dependent_adult_children
    required: True
---
if: form36_data.children_confirmation.has_minor_children or form36_data.children_confirmation.has_dependent_adult_children
question: |
  Children's Details
subquestion: |
  % if form36_data.children_confirmation.has_minor_children:
  You indicated there are ${ form36_data.children_confirmation.number_of_minor_children } children under 18.
  % endif
  % if form36_data.children_confirmation.has_dependent_adult_children:
  You indicated there are ${ form36_data.children_confirmation.number_of_dependent_adult_children } dependent adult children.
  % endif
  
  For each child, provide the following information:
list collect: True
fields:
  - "Child's full name": children_arrangements[i].full_name
    required: True
  - "Date of birth": children_arrangements[i].date_of_birth
    datatype: date
    required: True
  - "Current primary residence": children_arrangements[i].primary_residence
    choices:
      - "Lives primarily with me": with_applicant
      - "Lives primarily with other parent": with_other_parent
      - "Lives equally with both parents": shared_residence
      - "Lives with someone else (specify)": with_other
    required: True
  - "If lives with someone else, specify who": children_arrangements[i].other_caregiver
    show if:
      variable: children_arrangements[i].primary_residence
      is: "with_other"
  - "Parenting arrangement": children_arrangements[i].parenting_arrangement
    choices:
      - "Sole custody to me": sole_custody_applicant
      - "Sole custody to other parent": sole_custody_other_parent
      - "Joint custody": joint_custody
      - "Shared parenting": shared_parenting
      - "No formal arrangement": no_formal_arrangement
    required: True
  - "Access/parenting time arrangement": children_arrangements[i].access_arrangement
    input type: area
    required: True
    help: |
      Describe when the non-custodial parent spends time with the child, or if joint custody, describe the schedule.
---
if: form36_data.children_confirmation.has_minor_children or form36_data.children_confirmation.has_dependent_adult_children
question: |
  Children's Best Interests Statement
subquestion: |
  **As required by law, you must confirm that the arrangements for the children are in their best interests.**
fields:
  - note: |
      The Divorce Act requires that arrangements for children be in their best interests, considering factors such as:
      - The child's physical, emotional and psychological safety, security and well-being
      - The history of care and the child's views and preferences
      - The ability of each person to care for and meet the needs of the child
      - The nature and strength of relationships with significant people
      - Any family violence and its impact on the child
  - "I confirm that the arrangements described for the children are in their best interests": form36_data.children_confirmation.best_interests_confirmed
    datatype: yesnoradio
    required: True
  - "Explain how these arrangements serve the children's best interests": form36_data.children_confirmation.best_interests_explanation
    input type: area
    required: True
    help: |
      Consider stability, continuity of care, each parent's ability to provide for the children's needs, and the children's wishes (if age appropriate).
validation code: |
  if not form36_data.children_confirmation.best_interests_confirmed:
    validation_error("You cannot proceed with divorce if you cannot confirm the arrangements are in the children's best interests. Consider revising the arrangements or seeking legal advice.")
help: |
  **Legal Requirement:** Under section 11 of the Divorce Act, the court must be satisfied that reasonable arrangements have been made for the care of any children, and if such arrangements have not been made, the court shall not grant the divorce.
---
# ========================================
# SUPPORT ARRANGEMENTS
# ========================================
question: |
  Support Arrangements
subquestion: |
  Confirm any spousal support and child support arrangements:
fields:
  - "Is child support being paid?": form36_data.support_confirmation.child_support_paid
    datatype: yesnoradio
    required: True
  - "Amount of child support per month": form36_data.support_confirmation.child_support_amount
    datatype: currency
    show if: form36_data.support_confirmation.child_support_paid
    required: True
  - "Who pays child support?": form36_data.support_confirmation.child_support_payor
    choices:
      - "I pay": applicant_pays
      - "Other parent pays": other_parent_pays
    show if: form36_data.support_confirmation.child_support_paid
    required: True
  - "Is the child support amount in accordance with the Child Support Guidelines?": form36_data.support_confirmation.child_support_guidelines_compliant
    datatype: yesnoradio
    show if: form36_data.support_confirmation.child_support_paid
    required: True
  - "Explain why the amount differs from Guidelines": form36_data.support_confirmation.child_support_deviation_reason
    input type: area
    show if:
      variable: form36_data.support_confirmation.child_support_guidelines_compliant
      is: False
  - "Is spousal support being paid?": form36_data.support_confirmation.spousal_support_paid
    datatype: yesnoradio
    required: True
  - "Amount of spousal support per month": form36_data.support_confirmation.spousal_support_amount
    datatype: currency
    show if: form36_data.support_confirmation.spousal_support_paid
    required: True
  - "Who pays spousal support?": form36_data.support_confirmation.spousal_support_payor
    choices:
      - "I pay": applicant_pays
      - "Other parent pays": other_parent_pays
    show if: form36_data.support_confirmation.spousal_support_paid
    required: True
  - "Duration of spousal support": form36_data.support_confirmation.spousal_support_duration
    choices:
      - "Indefinite": indefinite
      - "Time-limited": time_limited
      - "Reviewable": reviewable
    show if: form36_data.support_confirmation.spousal_support_paid
    required: True
  - "End date or review date for spousal support": form36_data.support_confirmation.spousal_support_end_date
    datatype: date
    show if:
      variable: form36_data.support_confirmation.spousal_support_duration
      is: "time_limited" or "reviewable"
  - "Are support payments current and up to date?": form36_data.support_confirmation.support_payments_current
    datatype: yesnoradio
    show if: 
      variable: form36_data.support_confirmation.child_support_paid
      is: True
    or:
      variable: form36_data.support_confirmation.spousal_support_paid
      is: True
    required: True
  - "Explain any arrears or payment issues": form36_data.support_confirmation.support_arrears_explanation
    input type: area
    show if:
      variable: form36_data.support_confirmation.support_payments_current
      is: False
help: |
  **Child Support Guidelines:** Federal Child Support Guidelines set out the amounts to be paid based on income and number of children. Different amounts may be appropriate in certain circumstances.
  
  **Spousal Support:** Consider the Spousal Support Advisory Guidelines for guidance on amount and duration, though these are advisory only.
  
  **Current Payments:** It's important that support obligations are being met as ordered or agreed.
---
# ========================================
# PROPERTY ARRANGEMENTS
# ========================================
question: |
  Property and Financial Arrangements
subquestion: |
  Confirm arrangements regarding matrimonial property and finances:
fields:
  - "Are there property issues to be resolved?": form36_data.property_confirmation.has_property_issues
    datatype: yesnoradio
    required: True
  - "Have all property issues been resolved?": form36_data.property_confirmation.property_issues_resolved
    datatype: yesnoradio
    show if: form36_data.property_confirmation.has_property_issues
    required: True
  - "How were property issues resolved?": form36_data.property_confirmation.property_resolution_method
    choices:
      - "Separation agreement": separation_agreement
      - "Court order": court_order
      - "Mutual agreement (no written document)": mutual_agreement
      - "Still to be determined": not_resolved
    show if: form36_data.property_confirmation.property_issues_resolved
    required: True
  - "Date of separation agreement or court order": form36_data.property_confirmation.property_resolution_date
    datatype: date
    show if:
      variable: form36_data.property_confirmation.property_resolution_method
      is: "separation_agreement" or "court_order"
  - "Brief description of property division": form36_data.property_confirmation.property_division_summary
    input type: area
    show if: form36_data.property_confirmation.property_issues_resolved
    help: |
      Summarize how major assets (home, pensions, investments, etc.) were divided.
  - "Are there any outstanding property claims?": form36_data.property_confirmation.outstanding_property_claims
    datatype: yesnoradio
    required: True
  - "Describe outstanding property claims": form36_data.property_confirmation.outstanding_claims_description
    input type: area
    show if: form36_data.property_confirmation.outstanding_property_claims
  - "Are both parties satisfied with property arrangements?": form36_data.property_confirmation.parties_satisfied_with_arrangements
    datatype: yesnoradio
    show if: form36_data.property_confirmation.property_issues_resolved
    required: True
help: |
  **Property Rights:** In Ontario, married spouses have equal rights to family property acquired during marriage, with some exceptions for property brought into the marriage or received by gift/inheritance.
  
  **Separation Agreements:** A properly executed separation agreement can resolve all property issues and be incorporated into the divorce judgment.
  
  **Outstanding Claims:** All property issues should be resolved before divorce, or the right to make claims may be lost.
---
# ========================================
# RECONCILIATION STATEMENT
# ========================================
question: |
  Reconciliation Statement
subquestion: |
  **This is a critical legal requirement for divorce proceedings.**
fields:
  - "Since filing the divorce application, have you and your spouse reconciled or attempted to reconcile?": form36_data.reconciliation_statement.reconciliation_attempted
    datatype: yesnoradio
    required: True
  - "Describe the reconciliation attempt": form36_data.reconciliation_statement.reconciliation_description
    input type: area
    show if: form36_data.reconciliation_statement.reconciliation_attempted
    required: True
    help: |
      Include dates, duration, and outcome of reconciliation attempts.
  - "Are you and your spouse currently reconciled?": form36_data.reconciliation_statement.currently_reconciled
    datatype: yesnoradio
    show if: form36_data.reconciliation_statement.reconciliation_attempted
    required: True
  - "Do you still want to proceed with the divorce?": form36_data.reconciliation_statement.still_want_divorce
    datatype: yesnoradio
    required: True
  - note: |
      **If you have reconciled and no longer want a divorce, you should discontinue this application rather than complete this affidavit.**
    show if:
      variable: form36_data.reconciliation_statement.still_want_divorce
      is: False
validation code: |
  if not form36_data.reconciliation_statement.still_want_divorce:
    validation_error("If you no longer want a divorce, you should discontinue your application rather than complete this affidavit. Consult with a lawyer about withdrawing your application.")
  
  if form36_data.reconciliation_statement.currently_reconciled:
    validation_error("If you are currently reconciled, you should not proceed with the divorce. Consider whether you want to discontinue the application.")
help: |
  **Legal Significance:** The court has a duty to consider reconciliation. Any genuine reconciliation attempts must be disclosed.
  
  **Reconciliation Definition:** This means resuming married life together with the intention of reconciling the marriage, not just temporary attempts to work things out.
  
  **Effect of Reconciliation:** Brief reconciliation attempts (under 90 days) don't restart the separation period, but longer reconciliations might affect your grounds for divorce.
---
# ========================================
# CENTRAL DIVORCE REGISTRY
# ========================================
question: |
  Central Divorce Registry Search
subquestion: |
  **Required for all divorce applications - confirm search of Central Divorce Registry.**
fields:
  - "Have you searched the Central Divorce Registry?": form36_data.final_statements.cdr_search_completed
    datatype: yesnoradio
    required: True
    help: |
      This search confirms neither spouse has started divorce proceedings elsewhere in Canada.
  - "Date of Central Divorce Registry search": form36_data.final_statements.cdr_search_date
    datatype: date
    show if: form36_data.final_statements.cdr_search_completed
    required: True
  - "Result of search": form36_data.final_statements.cdr_search_result
    choices:
      - "No previous divorce proceedings found": no_proceedings
      - "Previous proceedings found but resolved/withdrawn": resolved_proceedings
      - "Other (specify)": other
    show if: form36_data.final_statements.cdr_search_completed
    required: True
  - "Explain other search result": form36_data.final_statements.cdr_search_other_explanation
    input type: area
    show if:
      variable: form36_data.final_statements.cdr_search_result
      is: "other"
    required: True
validation code: |
  if not form36_data.final_statements.cdr_search_completed:
    validation_error("A Central Divorce Registry search is mandatory for all divorce applications. You must complete this search before submitting Form 36.")
help: |
  **Mandatory Requirement:** The Divorce Act requires a search of the Central Divorce Registry to ensure no duplicate proceedings exist.
  
  **How to Search:** The search is typically done by your lawyer or through the court registry when filing your application.
  
  **Purpose:** This prevents multiple divorce proceedings for the same marriage in different provinces.
---
# ========================================
# FINAL STATEMENTS AND REQUESTS
# ========================================
question: |
  Final Statements and Requests
subquestion: |
  Complete these final statements for your affidavit:
fields:
  - "Type of divorce order requested": form36_data.final_statements.order_type_requested
    choices:
      - "Certificate of divorce only": certificate_only
      - "Judgment of divorce with certificate": judgment_with_certificate
    required: True
    help: |
      Certificate only is typically for simple uncontested divorces. Judgment with certificate includes additional orders (custody, support, etc.).
  - "Do you want any other orders included in the divorce?": form36_data.final_statements.other_orders_requested
    datatype: yesnoradio
    required: True
  - "Specify other orders requested": form36_data.final_statements.other_orders_details
    input type: area
    show if: form36_data.final_statements.other_orders_requested
    help: |
      Such as custody, access, support, property division, name change, etc.
  - "I swear/affirm that all statements in this affidavit are true": form36_data.final_statements.truth_sworn
    datatype: yesnoradio
    required: True
  - "I understand that making false statements in this affidavit is perjury": form36_data.final_statements.perjury_understood
    datatype: yesnoradio
    required: True
  - "I am making this affidavit in support of my divorce application": form36_data.final_statements.purpose_understood
    datatype: yesnoradio
    required: True
validation code: |
  if not (form36_data.final_statements.truth_sworn and form36_data.final_statements.perjury_understood and form36_data.final_statements.purpose_understood):
    validation_error("You must confirm all final statements before completing this affidavit. These confirmations are legally required.")
help: |
  **Truth Requirement:** You are swearing under oath that everything in this affidavit is true to the best of your knowledge.
  
  **Perjury Warning:** Making false statements in a sworn affidavit is a criminal offence with serious penalties.
  
  **Purpose:** This affidavit supports your request for divorce and confirms the facts stated in your original application.
---
# ========================================
# FINAL REVIEW AND WARNINGS
# ========================================
question: |
  Final Review Before Completion
  
  ## CRITICAL FINAL WARNINGS
  
  Before completing this affidavit, review these important points:
  
subquestion: |
  ### Legal Implications
  - **This is a sworn legal document** that will be filed with the court
  - **Perjury charges** can result from false statements (up to 14 years imprisonment)
  - **Your divorce depends** on the accuracy of these statements
  - **Property and support rights** may be affected by this affidavit
  
  ### Next Steps After Completion
  1. **Print the completed affidavit** (do not sign yet)
  2. **Bring valid photo ID** and the unsigned affidavit to a Commissioner of Oaths
  3. **Swear the affidavit** before the Commissioner who will witness your signature
  4. **File the sworn affidavit** with the court within required time limits
  5. **Wait for court processing** and divorce certificate/judgment
  
  ### Commissioner of Oaths
  You can have your affidavit sworn by:
  - Any practicing lawyer in Ontario
  - Notaries public
  - Court clerks at the courthouse
  - Some community legal clinics
  
  ### Professional Advice Recommendation
  **Strongly consider consulting with a family lawyer** before swearing this affidavit, especially if:
  - There are children involved
  - There are significant assets or debts
  - You're unsure about any statements
  - There are complex circumstances
  
  Contact the Law Society of Ontario's Referral Service: **1-855-947-5255** or visit **lso.ca**

field: form36_final_review_complete
datatype: checkboxes
options:
  - "I have reviewed all information and confirm it is accurate": accuracy_confirmed
  - "I understand this must be sworn before a Commissioner of Oaths": commissioner_understood
  - "I understand the legal implications and perjury warnings": legal_implications_understood
  - "I understand I should consider getting legal advice": legal_advice_considered
validation code: |
  if not (accuracy_confirmed and commissioner_understood and legal_implications_understood and legal_advice_considered):
    validation_error("You must acknowledge all final review points before completing this sworn affidavit.")
---
# ========================================
# COMPLETION AND DOCUMENT GENERATION
# ========================================
event: form36_complete
question: |
  Form 36 - Affidavit for Divorce Complete
  
  ## Your Affidavit is Ready for Swearing
  
subquestion: |
  **IMPORTANT: This document is not yet legally complete. You must have it sworn by a Commissioner of Oaths.**
  
  ### Summary of Your Affidavit
  
  **Case Information:**
  - Court: ${ form36_data.case_info.court_location }
  - File Number: ${ form36_data.case_info.court_file_number }
  - Application Filed: ${ form36_data.case_info.application_filed_date }
  
  **Marriage Details:**
  - Married: ${ form36_data.marriage_confirmation.marriage_date } in ${ form36_data.marriage_confirmation.marriage_place_city }, ${ form36_data.marriage_confirmation.marriage_place_province }
  - Separated: ${ form36_data.separation_confirmation.separation_date }
  - Ground for Divorce: ${ form36_data.separation_confirmation.divorce_ground }
  
  % if form36_data.children_confirmation.has_minor_children:
  **Children:** ${ form36_data.children_confirmation.number_of_minor_children } children under 18
  % endif
  
  % if form36_data.support_confirmation.child_support_paid or form36_data.support_confirmation.spousal_support_paid:
  **Support Arrangements:** 
  % if form36_data.support_confirmation.child_support_paid:
  Child Support: $${ form36_data.support_confirmation.child_support_amount }/month
  % endif
  % if form36_data.support_confirmation.spousal_support_paid:
  Spousal Support: $${ form36_data.support_confirmation.spousal_support_amount }/month
  % endif
  % endif
  
  ### Immediate Next Steps
  
  1. **Download and print** your completed Form 36 (link below)
  2. **DO NOT SIGN** the printed form yet
  3. **Locate a Commissioner of Oaths** (lawyer, notary, court clerk)
  4. **Bring valid photo ID** and appear before the Commissioner
  5. **Swear the affidavit** and sign in Commissioner's presence
  6. **Pay Commissioner's fee** (typically $10-50)
  7. **File sworn affidavit** with the court
  
  ### Finding a Commissioner of Oaths
  
  - **Lawyers:** Any practicing Ontario lawyer can swear your affidavit
  - **Court:** Court clerks at your local courthouse
  - **Notaries:** Licensed notaries public
  - **Legal Clinics:** Some community legal clinics offer this service
  
  ### Court Filing
  
  File your sworn affidavit at:
  **${ form36_data.case_info.court_location } Courthouse**
  
  Include:
  - Original sworn affidavit
  - Filing fee (if required)
  - Any supporting documents
  
  ### Legal Advice Reminder
  
  **Consider consulting with a family lawyer** before filing, especially for complex situations. Law Society of Ontario Referral Service: **1-855-947-5255**
  
buttons:
  - "Download Form 36 (PDF)": download_form36_pdf
  - "Start Over": restart
  - "Get Legal Resources": legal_resources

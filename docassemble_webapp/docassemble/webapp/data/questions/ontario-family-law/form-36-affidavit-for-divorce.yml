# ========================================
# DOCUMENT TEMPLATE
# ========================================
attachment:
  name: Ontario Form 36 - Affidavit for Divorce
  filename: Form_36_Affidavit_for_Divorce
  valid formats:
    - pdf
  content: |
    [CENTRE_HEADER]
    ONTARIO
    SUPERIOR COURT OF JUSTICE
    (OR ONTARIO COURT OF JUSTICE)
    
    COURT FILE NO.: ${ form36_data.case_info.court_file_number }
    
    ${ form36_data.case_info.court_location }
    
    [CASE_STYLE]
    BETWEEN:
    
    ${ form36_data.affiant_info.full_name }
                                                                                                    Applicant
    and
    
    ${ form36_data.marriage_confirmation.spouse_name_at_marriage }
                                                                                                    Respondent
    
    [FORM_HEADER]
    FORM 36: AFFIDAVIT FOR DIVORCE
    (Family Law Rules, rule 25.2)
    
    [AFFIANT_SECTION]
    I, ${ form36_data.affiant_info.full_name }, of the City/Town of ${ form36_data.affiant_info.city }, in the Province of ${ form36_data.affiant_info.province }, ${ form36_data.affiant_info.occupation }, MAKE OATH AND SAY:
    
    [MARRIAGE_CONFIRMATION]
    1. I am the ${ form36_data.affiant_info.relationship_to_case } in this divorce case.
    
    2. All the information in the application in this case is correct, except as follows:
       (Write "NONE" if no exceptions, or give details of any changes)
       NONE
    
    3. The marriage took place on ${ form36_data.marriage_confirmation.marriage_date.format('MMMM d, yyyy') } at ${ form36_data.marriage_confirmation.marriage_place_city }, ${ form36_data.marriage_confirmation.marriage_place_province }, ${ form36_data.marriage_confirmation.marriage_place_country }.
    
    4. The spouses separated on ${ form36_data.separation_confirmation.separation_date.format('MMMM d, yyyy') } and have lived separate and apart since that date.
    
    [SERVICE_CONFIRMATION]
    % if form36_data.service_confirmation.spouse_served:
    5. The respondent was served with the application for divorce by ${ form36_data.service_confirmation.service_method } on ${ form36_data.service_confirmation.service_date.format('MMMM d, yyyy') }.
    
    % if form36_data.service_confirmation.answer_filed:
    6. The respondent filed an Answer on ${ form36_data.service_confirmation.answer_filed_date.format('MMMM d, yyyy') }.
    % else:
    6. The respondent has not filed an Answer, and the time for filing an Answer has expired.
    % endif
    % else:
    5. Service on the respondent was not required because: ${ form36_data.service_confirmation.no_service_explanation }
    % endif
    
    [CHILDREN_SECTION]
    % if form36_data.children_confirmation.has_minor_children or form36_data.children_confirmation.has_dependent_adult_children:
    7. The following arrangements have been made for the care of the child(ren):
    
    % for child in children_arrangements:
    Child: ${ child.full_name }, born ${ child.date_of_birth.format('MMMM d, yyyy') }
    Primary Residence: ${ child.primary_residence }
    Custody/Care: ${ child.parenting_arrangement }
    Access/Parenting Time: ${ child.access_arrangement }
    
    % endfor
    
    8. I believe that these arrangements are in the best interest of the child(ren) because: ${ form36_data.children_confirmation.best_interests_explanation }
    % else:
    7. There are no children of the marriage under the age of 18 years, and no children 18 years of age or over who are unable to obtain the necessities of life due to illness, disability or other cause.
    % endif
    
    [SUPPORT_SECTION]
    % if form36_data.support_confirmation.child_support_paid:
    9. Child support in the amount of $${ form36_data.support_confirmation.child_support_amount } per month is being paid by the ${ form36_data.support_confirmation.child_support_payor }.
    % if form36_data.support_confirmation.child_support_guidelines_compliant:
    This amount is in accordance with the applicable Child Support Guidelines.
    % else:
    This amount differs from the Child Support Guidelines because: ${ form36_data.support_confirmation.child_support_deviation_reason }
    % endif
    % else:
    9. No child support is being paid.
    % endif
    
    % if form36_data.support_confirmation.spousal_support_paid:
    10. Spousal support in the amount of $${ form36_data.support_confirmation.spousal_support_amount } per month is being paid by the ${ form36_data.support_confirmation.spousal_support_payor } for a ${ form36_data.support_confirmation.spousal_support_duration } period.
    % else:
    10. No spousal support is being paid.
    % endif
    
    [PROPERTY_SECTION]
    % if form36_data.property_confirmation.has_property_issues:
    11. The following arrangements have been made with respect to property:
    ${ form36_data.property_confirmation.property_division_summary }
    
    % if form36_data.property_confirmation.outstanding_property_claims:
    There are outstanding property claims as follows: ${ form36_data.property_confirmation.outstanding_claims_description }
    % else:
    There are no outstanding property claims between the spouses.
    % endif
    % else:
    11. There are no property issues between the spouses.
    % endif
    
    [RECONCILIATION_SECTION]
    % if form36_data.reconciliation_statement.reconciliation_attempted:
    12. Since the application was filed, the following efforts at reconciliation have been made: ${ form36_data.reconciliation_statement.reconciliation_description }
    
    The spouses are not currently reconciled.
    % else:
    12. There have been no attempts at reconciliation since the application was filed.
    % endif
    
    [CENTRAL_DIVORCE_REGISTRY]
    13. A search of the Central Divorce Registry was conducted on ${ form36_data.final_statements.cdr_search_date.format('MMMM d, yyyy') } with the following result: ${ form36_data.final_statements.cdr_search_result }.
    
    [FINAL_REQUESTS]
    14. I ask the court to grant:
    % if form36_data.final_statements.order_type_requested == "certificate_only":
    (a) a certificate of divorce only
    % else:
    (a) a judgment of divorce with certificate of divorce
    % endif
    
    % if form36_data.final_statements.other_orders_requested:
    (b) the following additional orders: ${ form36_data.final_statements.other_orders_details }
    % endif
    
    [SWORN_STATEMENT]
    SWORN BEFORE ME at the City/Town of 
    _________________, in the Province of 
    Ontario, this _____ day of 
    _________________, 20___.
    
    
    _________________________________          _________________________________
    A Commissioner for taking Affidavits        ${ form36_data.affiant_info.full_name }
    (or as may be)                             (Signature of Deponent)
    
    
    [FOOTER_WARNING]
    WARNING: This affidavit is made under oath. Making false statements in this affidavit is perjury, 
    a criminal offence punishable by up to 14 years in prison.
    
    NOTE: This affidavit must be sworn before a Commissioner for taking Affidavits, who must see 
    proper identification of the deponent.

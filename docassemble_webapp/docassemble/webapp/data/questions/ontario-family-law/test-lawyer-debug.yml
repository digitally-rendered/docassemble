---
metadata:
  title: Debug Test - Lawyer Button Issue
---
modules:
  - .ontario-family-law.debug_helpers
---
features:
  debug: True
---
# Test the lawyer button issue in isolation with debug
mandatory: True
code: |
  try:
    # Test the problematic flow
    other_party_has_lawyer
    if other_party_has_lawyer is True:
      collect_other_party_lawyer_info
    test_complete
  except:
    error_display = show_error()
    show_debug_error
---
question: |
  Does the other party have a lawyer?
field: other_party_has_lawyer
buttons:
  - "Yes, they have a lawyer": True
  - "No, they are self-represented": False
  - "I don't know": unknown
---
question: |
  Other Party's Lawyer Information
subquestion: |
  Please provide the lawyer's information.
fields:
  - "Lawyer's Name": other_lawyer_name
    required: False
  - "Law Firm": other_lawyer_firm
    required: False
  - "Phone Number": other_lawyer_phone
    required: False
  - "Email Address": other_lawyer_email
    datatype: email
    required: False
continue button field: collect_other_party_lawyer_info
show if: other_party_has_lawyer is True
---
event: test_complete
question: |
  Test Complete
subquestion: |
  The lawyer form worked successfully!
  
  - Other party has lawyer: ${ other_party_has_lawyer }
  - Form was shown: Yes
  - Debug errors: None
---
event: show_debug_error
question: |
  ⚠️ Debug Error Detected
subquestion: |
  The following error was caught:
  
  ${ error_display }
  
  **This helps identify the exact issue with the lawyer button.**
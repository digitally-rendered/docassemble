---
metadata:
  title: Simple Lawyer Test
---
# Simple test to isolate the lawyer button issue
mandatory: True
code: |
  # Test the other party lawyer flow in isolation
  other_party_has_lawyer
  if other_party_has_lawyer == True:
    collect_other_party_lawyer_info
  final_message
---
question: |
  Does the other party have a lawyer?
field: other_party_has_lawyer
buttons:
  - "Yes, they have a lawyer": True
  - "No, they are self-represented": False
  - "I don't know": unknown
---
question: |
  Other Party's Lawyer Information
subquestion: |
  If you know their lawyer information, please provide it. Leave blank any fields you don't know.
fields:
  - "Lawyer's Name": other_lawyer_name
    required: False
  - "Law Firm": other_lawyer_firm
    required: False
  - "Phone Number": other_lawyer_phone
    required: False
  - "Email Address": other_lawyer_email
    datatype: email
    required: False
continue button field: collect_other_party_lawyer_info
---
event: final_message
question: |
  Test Complete
subquestion: |
  The lawyer form test is complete.
  
  Results:
  - Other party has lawyer: ${ other_party_has_lawyer }
  - Lawyer name: ${ other_lawyer_name if defined('other_lawyer_name') else 'Not provided' }
  - Law firm: ${ other_lawyer_firm if defined('other_lawyer_firm') else 'Not provided' }
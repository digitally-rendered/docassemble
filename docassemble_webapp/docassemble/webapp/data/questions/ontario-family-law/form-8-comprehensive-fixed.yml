    datatype: combobox
    choices:
      - "Superior Court of Justice - Toronto": toronto_scj
      - "Superior Court of Justice - Ottawa": ottawa_scj  
      - "Superior Court of Justice - Hamilton": hamilton_scj
      - "Superior Court of Justice - London": london_scj
      - "Superior Court of Justice - Windsor": windsor_scj
      - "Superior Court of Justice - Thunder Bay": thunderbay_scj
      - "Superior Court of Justice - Sudbury": sudbury_scj
      - "Superior Court of Justice - North Bay": northbay_scj
      - "Superior Court of Justice - Sault Ste. Marie": sault_scj
      - "Superior Court of Justice - Timmins": timmins_scj
      - "Superior Court of Justice - Kenora": kenora_scj
      - "Superior Court of Justice - Bracebridge": bracebridge_scj
      - "Superior Court of Justice - Barrie": barrie_scj
      - "Superior Court of Justice - Newmarket": newmarket_scj
      - "Superior Court of Justice - Oshawa": oshawa_scj
      - "Superior Court of Justice - Whitby": whitby_scj
      - "Superior Court of Justice - Peterborough": peterborough_scj
      - "Superior Court of Justice - Belleville": belleville_scj
      - "Superior Court of Justice - Kingston": kingston_scj
      - "Superior Court of Justice - Brockville": brockville_scj
      - "Superior Court of Justice - Cornwall": cornwall_scj
      - "Superior Court of Justice - L'Orignal": lorignal_scj
      - "Superior Court of Justice - Pembroke": pembroke_scj
      - "Superior Court of Justice - Kitchener": kitchener_scj
      - "Superior Court of Justice - Guelph": guelph_scj
      - "Superior Court of Justice - Brantford": brantford_scj
      - "Superior Court of Justice - St. Catharines": stcatharines_scj
      - "Superior Court of Justice - Welland": welland_scj
      - "Superior Court of Justice - Cayuga": cayuga_scj
      - "Ontario Court of Justice - Multiple Locations": ocj_general
    required: True
    help: |
      If you're unsure which court location to choose, consult with a lawyer or 
      contact the court directly for guidance.

---
question: |
  ## Existing Court File Number
  
  <div class="form-section">
  <div class="section-title">Case Information</div>
  Please provide the existing court file number for this family law matter.
  </div>

fields:
  - "Court File Number": existing_file_number
    required: True
    help: |
      Enter the complete court file number as it appears on previous court documents 
      (e.g., FS-24-123456, FC-23-987654, or similar format)

validation code: |
  import re
  if existing_file_number:
    cleaned = existing_file_number.strip()
    if len(cleaned) < 5:
      validation_error("Please enter a valid court file number with at least 5 characters.")
    if not re.match(r'^[A-Z]{2}-\d{2}-\d+', cleaned):
      validation_error("Court file number should be in format like FS-24-123456 or FC-23-987654.")

show if: case_type == "existing"


  </div>

fields:
  - "What type of restraining order?": restraining_order_type
    datatype: checkboxes
    choices:
      - "No contact": no_contact
      - "No harassment": no_harassment
      - "Stay away from residence": stay_away_home
      - "Stay away from workplace": stay_away_work
      - "Other restrictions": other_restrictions
    required: True
  - "Details of other restrictions": other_restrictions_details
    datatype: area
    required: False
    show if: 
      code: |
        'other_restrictions' in restraining_order_type
  - "Is this request urgent?": restraining_order_urgent
    datatype: yesnoradio
    required: True
  - "Explain urgency": restraining_order_urgency_details
    datatype: area
    required: False
    show if: restraining_order_urgent

show if: 
  code: |
    'restraining_order' in claims_selection

---
code: |
  service_complete = True

---
question: |
  ## Service Information
  
  <div class="form-section">
  <div class="section-title">How Will You Serve the Other Party?</div>
  You must serve (deliver) a copy of this application and supporting documents to the other party.
  There are several ways to serve documents in Ontario family law cases.
  </div>

fields:
  - "How will you serve the other party?": service_method
    datatype: radio
    choices:
      - "Personal service": personal
      - "Service at address for service": address_service
      - "Mail service": mail
      - "Courier service": courier
      - "Email service (with consent)": email
      - "Fax service (with consent)": fax
      - "Substituted service (court order required)": substituted
      - "Advertisement (court order required)": advertisement
    required: True
    help: "Personal service is most common and reliable"
  - "Person who will serve documents": person_serving
    datatype: radio
    choices:
      - "Process server": process_server
      - "Sheriff": sheriff
      - "Another adult (not a party)": other_adult
      - "By mail/courier": mail_courier
    required: True
    show if: 
      variable: service_method
      is: personal
  - "Details about service": service_details
    datatype: area
    required: False
    help: "Any additional details about how service will be completed"

---
code: |
  previous_orders_complete = True

---
question: |
  ## Previous Court Orders
  
  <div class="form-section">
  <div class="section-title">Previous Orders or Agreements</div>
  Have there been any previous court orders, agreements, or other legal documents dealing with 
  any of the issues in this case?
  </div>

fields:
  - "Are there previous orders or agreements?": has_previous_orders
    datatype: yesnoradio
    required: True

---
question: |
  ## Details of Previous Orders
  
  <div class="form-section">
  <div class="section-title">Previous Order Information</div>
  Please provide details about previous orders or agreements.
  </div>

list collect: True
fields:
  - "Type of document": previous_orders[i]['type']
    datatype: radio
    choices:
      - "Court Order": court_order
      - "Separation Agreement": separation_agreement
      - "Marriage Contract": marriage_contract
      - "Cohabitation Agreement": cohabitation_agreement
      - "Consent Order": consent_order
      - "Other": other
    required: True
  - "Date of document": previous_orders[i]['date']
    datatype: date
    required: True
  - "Court location (if court order)": previous_orders[i]['court']
    required: False
    show if: 
      code: |
        previous_orders[i]['type'] == 'court_order'
  - "What did this document deal with?": previous_orders[i]['subject']
    datatype: checkboxes
    choices:
      - "Custody": custody
      - "Access/Parenting time": access
      - "Child support": child_support
      - "Spousal support": spousal_support
      - "Property division": property
      - "Other": other
    required: True
  - "Is this document still in effect?": previous_orders[i]['still_effective']
    datatype: yesnoradio
    required: True
  - "Details": previous_orders[i]['details']
    datatype: area
    required: False
    help: "Brief description of what the document says"

show if: has_previous_orders

---
code: |
  form_complete = True

---
question: |
  ## Form 8 Application Complete
  
  <div class="success-message">
  <strong>Your Form 8 Application is now complete!</strong>
  </div>
  
  <div class="form-section">
  <div class="section-title">Summary of Your Application</div>
  
  **Case Type:** ${ "New case" if case_type == "new" else "Adding to existing case" }
  
  **Court Location:** ${ court_location.replace('_', ' ').title() }
  
  % if case_type == "existing":
  **Existing File Number:** ${ existing_file_number }
  % endif
  
  **Applicant:** ${ applicant.name }
  
  **Respondent:** ${ respondent.name }
  
  **Claims for Relief:** 
  % for claim in claims_selection:
  - ${ claim.replace('_', ' ').title() }
  % endfor
  % if 'other_claim' in claims_selection:
  
  **Other Claims:** ${ other_claim_details }
  % endif
  
  % if has_children:
  **Children:** ${ len(children) } child(ren)
  % endif
  
  **Service Method:** ${ service_method.replace('_', ' ').title() }
  
  % if has_previous_orders:
  **Previous Orders:** Yes (${ len(previous_orders) } previous order(s)/agreement(s))
  % else:
  **Previous Orders:** None
  % endif
  </div>
  
  <div class="warning">
  <strong>Next Steps:</strong>
  
  1. **Review all information carefully** - ensure all details are accurate
  2. **Print and sign the form** - you must sign the original documents
  3. **Prepare required attachments** - marriage certificate, financial documents, etc.
  4. **File with the court** - bring original and copies to the court office
  5. **Pay filing fees** - check current fee schedule with the court
  6. **Serve the other party** - follow the service method you selected
  7. **File proof of service** - once you have served the other party
  
  **Important:** This form completion assistance does not constitute legal advice. 
  Consider consulting with a lawyer or licensed paralegal before filing.
  </div>

buttons:
  - "Download Form Information": download_form
    action: download_summary
  - "Start Over": restart
  - "Exit": exit

---
attachment:
  - name: Form 8 Application Summary
    filename: Form_8_Application_Summary
    docx template file: form-8-template.docx
    valid formats:
      - pdf
      - docx
    variable name: form_summary_attachment
    content: |
      # ONTARIO FAMILY LAW FORM 8 - APPLICATION (GENERAL)
      
      ## COURT INFORMATION
      - Court Location: ${ court_location.replace('_', ' ').title() }
      - Case Type: ${ "New case" if case_type == "new" else "Adding to existing case" }
      % if case_type == "existing":
      - Court File Number: ${ existing_file_number }
      % endif
      
      ## APPLICANT INFORMATION
      - Full Name: ${ applicant.name.full() }
      % if defined('applicant.name.former') and applicant.name.former:
      - Former Name(s): ${ applicant.name.former }
      % endif
      - Date of Birth: ${ applicant.birthdate.format('yyyy-MM-dd') if defined('applicant.birthdate') else "" }
      - Address: ${ applicant.address.on_one_line() if defined('applicant.address.address') else "" }
      - Phone: ${ applicant.phone_number if defined('applicant.phone_number') else "" }
      % if defined('applicant.email') and applicant.email:
      - Email: ${ applicant.email }
      % endif
      % if defined('applicant_has_lawyer') and applicant_has_lawyer:
      - Legal Representation: ${ applicant_lawyer_name } ${ "(" + applicant_lawyer_firm + ")" if defined('applicant_lawyer_firm') and applicant_lawyer_firm else "" }
      % endif
      
      ## RESPONDENT INFORMATION  
      - Full Name: ${ respondent.name.full() }
      % if defined('respondent.name.former') and respondent.name.former:
      - Former Name(s): ${ respondent.name.former }
      % endif
      - Date of Birth: ${ respondent.birthdate.format('yyyy-MM-dd') if defined('respondent.birthdate') else "Unknown" }
      - Address: ${ respondent.address.on_one_line() if defined('respondent.address.address') else "Unknown" }
      % if not respondent_address_current:
      - Address Status: Last known address (${ respondent_address_period if defined('respondent_address_period') else "" })
      % endif
      - Phone: ${ respondent.phone_number if defined('respondent.phone_number') and respondent.phone_number else "Unknown" }
      % if defined('respondent_has_lawyer') and respondent_has_lawyer == True:
      - Legal Representation: ${ respondent_lawyer_name if defined('respondent_lawyer_name') else "" }
      % endif
      
      ## RELATIONSHIP INFORMATION
      - Relationship Type: ${ relationship_type.replace('_', ' ').title() if defined('relationship_type') else "" }
      % if defined('marriage_date'):
      - Date of Marriage: ${ marriage_date.format('yyyy-MM-dd') }
      - Place of Marriage: ${ marriage_city }, ${ marriage_province }, ${ marriage_country }
      % endif
      % if defined('currently_separated') and currently_separated:
      - Date of Separation: ${ separation_date.format('yyyy-MM-dd') if defined('separation_date') else "" }
      % endif
      
      ## CHILDREN INFORMATION
      % if has_children:
      - Number of Children: ${ len(children) }
      % for child in children:
      - Child: ${ child.name.full() }, DOB: ${ child.birthdate.format('yyyy-MM-dd') }, Currently lives with: ${ child.current_custody.replace('_', ' ').title() }
      % endfor
      % else:
      - Children: None
      % endif
      
      ## CLAIMS FOR RELIEF
      % for claim in claims_selection:
      - ${ claim.replace('_', ' ').title() }
      % endfor
      % if 'other_claim' in claims_selection:
      - Other: ${ other_claim_details }
      % endif
      
      ## SPECIFIC CLAIM DETAILS
      % if 'divorce' in claims_selection:
      - Divorce Grounds: ${ divorce_grounds.replace('_', ' ').title() if defined('divorce_grounds') else "" }
      % endif
      
      % if 'child_support' in claims_selection:
      - Child Support Payor: ${ child_support_payor.title() if defined('child_support_payor') else "" }
      - Child Support Amount: ${ "$" + str(child_support_amount) if defined('child_support_amount') and child_support_amount else "To be determined by court" }
      % if defined('retroactive_child_support') and retroactive_child_support:
      - Retroactive Support: Yes, from ${ retroactive_support_start_date.format('yyyy-MM-dd') if defined('retroactive_support_start_date') else "" }
      % endif
      % endif
      
      % if 'spousal_support' in claims_selection:
      - Spousal Support Payor: ${ spousal_support_payor.title() if defined('spousal_support_payor') else "" }
      - Spousal Support Amount: ${ "$" + str(spousal_support_amount) if defined('spousal_support_amount') and spousal_support_amount else "To be determined by court" }
      - Duration: ${ spousal_support_duration.replace('_', ' ').title() if defined('spousal_support_duration') else "" }
      % endif
      
      ## SERVICE INFORMATION
      - Service Method: ${ service_method.replace('_', ' ').title() if defined('service_method') else "" }
      % if defined('person_serving'):
      - Person Serving: ${ person_serving.replace('_', ' ').title() }
      % endif
      
      ## PREVIOUS ORDERS
      % if has_previous_orders:
      - Previous Orders: Yes (${ len(previous_orders) } order(s)/agreement(s))
      % for order in previous_orders:
      - ${ order['type'].replace('_', ' ').title() }, Date: ${ order['date'].format('yyyy-MM-dd') }, Subject: ${ ', '.join([s.replace('_', ' ').title() for s in order['subject']]) }
      % endfor
      % else:
      - Previous Orders: None
      % endif
      
      ---
      
      **IMPORTANT DISCLAIMER:** This form summary is for informational purposes only and does not constitute legal advice. Before filing with the court, consult with a qualified lawyer or licensed paralegal. Ensure all information is accurate and complete before submitting to the court.
      
      Generated: ${ today().format('yyyy-MM-dd') }

event: download_form
code: |
  form_summary_attachment

---
event: download_summary
code: |
  log("User downloaded form summary")

---
event: restart  
code: |
  command('restart')

---
event: exit
code: |
  command('exit')
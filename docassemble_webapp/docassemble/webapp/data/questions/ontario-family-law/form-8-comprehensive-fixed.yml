    required: False
  - "Occupation": applicant.occupation
    required: False
    help: "Your current job or profession"

---
question: |
  ## Your Information - Complete Address
  
  <div class="form-section">
  <div class="section-title">Current Address</div>
  Provide your current residential address. This is where court documents will be served.
  </div>

fields:
  - "Street Address": applicant.address.address
    required: True
    help: "Include unit/apartment number if applicable"
  - "City": applicant.address.city
    required: True
  - "Province": applicant.address.state
    default: "Ontario"
    required: True
  - "Postal Code": applicant.address.zip
    required: True
    help: "Format: A1A 1A1"
  - "Country": applicant.address.country
    default: "Canada"
    required: True

validation code: |
  import re
  if applicant.address.zip:
    postal_code = applicant.address.zip.upper().replace(' ', '')
    if not re.match(r'^[A-Z]\d[A-Z]\d[A-Z]\d$', postal_code):
      validation_error("Please enter a valid postal code in format A1A 1A1")
    # Check if Ontario postal code
    ontario_prefixes = ['K', 'L', 'M', 'N', 'P']
    if postal_code[0] not in ontario_prefixes:
      validation_error("Please enter an Ontario postal code (starts with K, L, M, N, or P)")
    # Format with space
    applicant.address.zip = f"{postal_code[:3]} {postal_code[3:]}"

---
question: |
  ## Your Information - Contact Details
  
  <div class="form-section">
  <div class="section-title">Contact Information</div>
  Provide current contact information where the court and other parties can reach you.
  </div>

fields:
  - "Phone Number (Primary)": applicant.phone_number
    required: True
    help: "Include area code (e.g., 416-555-1234)"
  - "Phone Number (Secondary)": applicant.mobile_number
    required: False
    help: "Cell phone or alternate number"
  - "Email Address": applicant.email
    datatype: email
    required: False
    help: "Court may send notices by email"
  - "Fax Number": applicant.fax_number
    required: False

validation code: |
  import re
  if applicant.phone_number:
    phone = re.sub(r'[^\d]', '', applicant.phone_number)
    if len(phone) != 10:
      validation_error("Please enter a 10-digit phone number")


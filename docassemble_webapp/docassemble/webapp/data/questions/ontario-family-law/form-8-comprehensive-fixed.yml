---
question: |
  ## Legal Disclaimer and Notice
  
  **Important Legal Notice:**
  
  This is an official Ontario court form. The information you provide will be used to create
  legal documents for filing with the Ontario Court of Justice or Superior Court of Justice.
  
  - This system provides form completion assistance but does not provide legal advice
  - You should consult with a lawyer or licensed paralegal for legal advice
  - False or misleading information may result in legal consequences
  - All information provided is subject to court rules and procedures
  
  **Disclaimer:** This system provides general legal information and procedural 
  guidance for family law in Ontario. This is not legal advice. 
  The information provided is not a substitute for consulting with a qualified lawyer who can advise 
  you on your specific situation. All information is for educational purposes only.

fields:
  - "I understand this disclaimer and wish to proceed": disclaimer_accepted
    datatype: yesnoradio
    required: True
  - "I confirm I am completing this form for Ontario courts": ontario_jurisdiction
    datatype: yesnoradio
    required: True

validation code: |
  if not disclaimer_accepted:
    validation_error("You must accept the disclaimer to proceed.")
  if not ontario_jurisdiction:
    validation_error("This form is only for Ontario family law matters.")

---
question: |
  ## Case Type Determination
  
  <div class="form-section">
  <div class="section-title">Is this a new case or adding to an existing case?</div>
  
  This information determines whether you are the Applicant or Respondent, and affects 
  how your case will be processed by the court.
  </div>
  
  **Choose "Starting a new case" if:**
  - This is the first time anyone is filing documents with the court for this matter
  - There is no existing court file number
  - You have never filed any documents with the court for this matter
  
  **Choose "Adding to an existing case" if:**
  - There is already a court file number assigned to your family law matter
  - Previous applications, motions, or orders have been filed
  - You are adding new claims to an existing court file

fields:
  - "What type of filing is this?": case_type
    datatype: radio
    choices:
      - "Starting a new case": new
      - "Adding to an existing case": existing
    required: True

---
question: |

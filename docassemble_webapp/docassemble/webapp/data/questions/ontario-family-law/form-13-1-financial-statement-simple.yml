code: |
  # Calculate total income
  income_sources = [
    'primary_job_income', 'secondary_job_income', 'overtime_income', 'commission_bonus', 
    'tips_income', 'self_employment', 'rental_income', 'investment_income',
    'pension_income', 'ei_income', 'social_assistance', 'disability_income',
    'workers_comp', 'child_support_received', 'spousal_support_received', 'other_income'
  ]
  
  form131_income.total_annual = sum(
    getattr(form131_income, source, 0) or 0 for source in income_sources
  )
  
  form131_income.total_monthly = form131_income.total_annual / 12 if form131_income.total_annual else 0
  
  # Validate income is under $150,000 threshold
  if form131_income.total_annual >= 150000:
    income_over_threshold = True
  else:
    income_over_threshold = False
  
  form131_income_collection = True


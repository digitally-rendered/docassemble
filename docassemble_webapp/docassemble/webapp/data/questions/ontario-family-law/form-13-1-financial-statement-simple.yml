# ELIGIBILITY AND ROUTING

question: |
  Form 13.1 Eligibility Check
subquestion: |
  **Form 13.1 (Simple Financial Statement)** is appropriate for cases with:
  
  ✓ Annual income under $150,000  
  ✓ Primarily employment income  
  ✓ Basic assets (home, car, savings accounts)  
  ✓ No business ownership  
  ✓ No complex investments  
  ✓ Straightforward financial situation  
  
  **Form 13 (Complex)** is required for:
  
  ⚠ Annual income over $150,000  
  ⚠ Business or professional practice ownership  
  ⚠ Complex investment portfolios  
  ⚠ Multiple properties  
  ⚠ Trust or estate interests  
  
  **Please confirm your financial situation:**
fields:
  - What is your estimated annual gross income?: applicant_annual_income_estimate
    datatype: currency
    help: |
      Include all sources before taxes and deductions
  - Do you own or have interest in any business?: has_any_business
    datatype: yesnoradio
  - Do you have investments beyond basic savings accounts?: has_complex_investments_simple
    datatype: yesnoradio
    help: |
      This includes stocks, bonds, mutual funds, or investment properties
  - Do you own more than one property?: has_multiple_properties_simple
    datatype: yesnoradio
  - Do you receive income from trusts or estates?: has_trust_estate_income
    datatype: yesnoradio

---
code: |
  form131_eligibility_check = (
    applicant_annual_income_estimate < 150000 and
    not has_any_business and
    not has_complex_investments_simple and
    not has_multiple_properties_simple and
    not has_trust_estate_income
  )

---
code: |
  suggest_form_13 = (
    applicant_annual_income_estimate >= 150000 or
    has_any_business or
    has_complex_investments_simple or
    has_multiple_properties_simple or
    has_trust_estate_income
  )

---
event: redirect_to_form_13
question: |
  Form 13 (Complex) is Required
subquestion: |
  Based on your responses, **Form 13 (Complex Financial Statement)** is required for your situation.
  
  Form 13 is required when you have:
  % if applicant_annual_income_estimate >= 150000:
  - Annual income of $150,000 or more
  % endif
  % if has_any_business:
  - Business or professional practice interests
  % endif  
  % if has_complex_investments_simple:
  - Complex investment holdings
  % endif
  % if has_multiple_properties_simple:
  - Multiple property ownership
  % endif
  % if has_trust_estate_income:
  - Trust or estate income/interests
  % endif
  
  Form 13 provides the detailed disclosure required for complex financial situations.
  
  **Would you like to proceed with Form 13 instead?**
buttons:
  - Continue with Form 13: redirect
    url: |
      ${ url_of('ontario-family-law/form-13-financial-statement.yml') }
  - Continue with Form 13.1 anyway: continue
    color: secondary
    help: |
      Only select this if you believe your situation is actually simple
  - Get Professional Advice: exit
    help: |
      Consult with a lawyer about which form is appropriate


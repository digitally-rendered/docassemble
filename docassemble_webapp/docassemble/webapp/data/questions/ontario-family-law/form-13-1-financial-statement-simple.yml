# PARTY INFORMATION

question: |
  Your Information (Applicant)
subquestion: |
  Please provide your personal information.
fields:
  - First Name: form131_applicant.name.first
  - Last Name: form131_applicant.name.last
  - Date of Birth: form131_applicant.birthdate
    datatype: date
    validate: |
      lambda x: validate_legal_date(x, 'birth_date')['valid']
  - Social Insurance Number: form131_applicant.sin
    help: |
      Required for court identification and child support calculations
    validate: |
      lambda x: validate_sin_number(x, 'court_filing')['valid']
  - Occupation/Job Title: form131_applicant.occupation
  - Employer Name: form131_applicant.employer
    required: False
    help: |
      Leave blank if self-employed or unemployed
  - Work Phone: form131_applicant.phone_work
    required: False
validation code: |
  date_validation = validate_legal_date(form131_applicant.birthdate, 'birth_date')
  if not date_validation['valid']:
    validation_error(date_validation['message'])
  
  sin_validation = validate_sin_number(form131_applicant.sin, 'court_filing')
  if not sin_validation['valid']:
    validation_error(sin_validation['message'])
  form131_applicant.sin_masked = sin_validation['masked']
  
  if form131_applicant.phone_work:
    phone_validation = format_canadian_phone(form131_applicant.phone_work)
    if not phone_validation['valid']:
      validation_error(phone_validation['message'])
    form131_applicant.phone_work = phone_validation['formatted']

# PRIVACY AND LEGAL NOTICES

question: |
  Privacy Protection - Simple Financial Statement
subquestion: |
  ${ privacy_disclaimer }
  
  **Privacy Notice for Form 13.1:**
  
  Even though this is a "simple" financial statement, it still contains sensitive personal and financial information that is protected by:
  
  - Court confidentiality rules
  - Privacy legislation (federal and Ontario)
  - Family Law Rules regarding disclosure
  
  **Your Information Will Be:**
  - Stored securely with encryption
  - Only accessible to court staff and parties to the case
  - Subject to court orders regarding confidentiality
  - Protected from unauthorized disclosure
  
  **Information Sharing:**
  This statement will be shared with:
  - The court
  - Other parties in your case (spouse, their lawyer)
  - Court-appointed experts if ordered
  - Support enforcement agencies if applicable
  
  **Your Rights:**
  - You can request sealing orders for sensitive information
  - You can object to unnecessary disclosure
  - You have the right to correct errors
field: understand_simple_financial_privacy
datatype: checkboxes
choices:
  - I understand how my financial information will be used and protected: privacy_simple_understood
  - I understand this information will be shared with other parties in the case: sharing_simple_understood
  - I understand the importance of providing accurate information: accuracy_simple_understood
validation code: |
  if not all([privacy_simple_understood, sharing_simple_understood, accuracy_simple_understood]):
    validation_error("You must acknowledge all privacy requirements to proceed.")

---
question: |
  Legal Requirements - Form 13.1
subquestion: |
  ${ legal_disclaimer }
  
  **Legal Requirements for Form 13.1:**
  
  **1. Accuracy and Completeness**
  - All information must be accurate and complete
  - You are signing this document under oath
  - False statements can result in perjury charges
  - Missing information can affect your case outcome
  
  **2. Required Supporting Documents**
  - Most recent Notice of Assessment from CRA
  - Most recent pay stub or employment letter
  - Recent bank statements
  - Proof of other income sources
  - Documents showing expenses (rent receipts, etc.)
  
  **3. Income Under $150,000**
  - Form 13.1 is only for income under $150,000
  - If your income is higher, you must use Form 13
  - Include ALL sources of income
  
  **4. Updates Required**
  - You must update your financial statement if significant changes occur
  - Court may order updated statements
  - Changes affecting child support must be reported
  
  **5. Professional Help Available**
  - You can get help completing this form
  - Duty counsel available at most family courts
  - Legal Aid may be available based on income
field: understand_simple_legal_requirements
datatype: checkboxes
choices:
  - I understand the accuracy and completeness requirements: accuracy_simple_required
  - I understand the documentation requirements: documentation_simple_required
  - I confirm my income is under $150,000 annually: income_threshold_confirmed
  - I understand the penalties for false information: penalties_simple_understood
  - I understand I may need to update this statement: updates_simple_understood
validation code: |
  required_acknowledgments = [accuracy_simple_required, documentation_simple_required, income_threshold_confirmed, penalties_simple_understood, updates_simple_understood]
  if not all(required_acknowledgments):
    validation_error("You must acknowledge all legal requirements to proceed.")


code: |
  # Simplified child support calculation
  def calculate_simple_child_support(annual_income, num_children):
    # Simplified Ontario table amounts (approximate)
    if annual_income <= 0:
      return "$0.00/month"
    
    # Basic table amounts for Ontario (approximate)
    base_amounts = {
      1: min(400 + (annual_income - 30000) * 0.007, 1200) if annual_income >= 30000 else 0,
      2: min(650 + (annual_income - 30000) * 0.011, 2000) if annual_income >= 30000 else 0,
      3: min(850 + (annual_income - 30000) * 0.014, 2600) if annual_income >= 30000 else 0,
      4: min(1000 + (annual_income - 30000) * 0.016, 3000) if annual_income >= 30000 else 0
    }
    
    if num_children <= 4:
      amount = max(0, base_amounts.get(num_children, 0))
      return f"${amount:.2f}/month"
    else:
      return f"See Child Support Guidelines table"
  
  # Calculate special expenses
  if has_special_child_expenses:
    total_special_expenses = sum([
      special_childcare_annual or 0,
      special_medical_annual or 0, 
      special_education_annual or 0,
      special_other_annual or 0
    ])
    special_expenses_monthly = total_special_expenses / 12
  else:
    total_special_expenses = 0
    special_expenses_monthly = 0
  
  form131_calculate_child_support = True


code: |
  validation_issues = []
  
  # Income validation
  if form131_income.total_annual <= 0:
    validation_issues.append("You must have some source of income to complete a financial statement.")
  
  if form131_income.total_annual >= 150000:
    validation_issues.append("Your income exceeds $150,000. Form 13 (Complex) is required instead of Form 13.1.")
  
  # Children validation
  for child in form131_children:
    if child.age >= 18 and not child.has_special_needs:
      validation_issues.append(f"Child {child.name.first} is {child.age} years old. Verify eligibility for support.")
  
  # Basic completeness check
  if not hasattr(form131_expenses, 'housing_payment') or not form131_expenses.housing_payment:
    validation_issues.append("Housing expenses (rent/mortgage) must be provided.")
  
  if validation_issues:
    form131_final_validation = False
    validation_issue_list = validation_issues
  else:
    form131_final_validation = True


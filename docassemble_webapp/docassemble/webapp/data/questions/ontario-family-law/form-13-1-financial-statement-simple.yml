question: |
  Children of the Relationship
subquestion: |
  ${ privacy_disclaimer }
  
  Please provide information about each child involved in this case.
  
  **For privacy protection, you may use initials instead of full names.**
list collect: True
fields:
  - Child's first name: form131_children[i].name.first
    help: |
      You may use first initial only (e.g., "J.")
  - Child's last name: form131_children[i].name.last
    help: |
      You may use initial only (e.g., "S.")
  - Date of birth: form131_children[i].birthdate
    datatype: date
    validate: |
      lambda x: validate_legal_date(x, 'birth_date')['valid']
  - Child lives primarily with: form131_children[i].primary_residence
    choices:
      - Me (applicant)
      - Other parent (respondent)  
      - Both parents equally (50/50)
      - Other person (specify below)
  - If other person, who?: form131_children[i].lives_with_other
    show if:
      variable: form131_children[i].primary_residence
      is: "Other person (specify below)"
  - Does this child have special needs?: form131_children[i].has_special_needs
    datatype: yesnoradio
  - Special needs details: form131_children[i].special_needs_description
    datatype: area
    show if: form131_children[i].has_special_needs
    required: False
    help: |
      Describe any special needs, medical conditions, or other circumstances
validation code: |
  date_validation = validate_legal_date(form131_children[i].birthdate, 'birth_date')
  if not date_validation['valid']:
    validation_error(date_validation['message'])
  
  # Calculate age
  age_calc = calculate_age(form131_children[i].birthdate)
  form131_children[i].age = age_calc['years']
  form131_children[i].age_string = age_calc['age_string']
  
  # Validate child is eligible (under 18 or special needs)
  if form131_children[i].age >= 18 and not form131_children[i].has_special_needs:
    validation_error(f"Child {form131_children[i].name.first} is {form131_children[i].age} years old. Children 18 and over are generally not eligible for support unless they have special needs or are still in school.")


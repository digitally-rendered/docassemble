code: |
  # Calculate total assets
  real_estate_net = 0
  if owns_real_estate and hasattr(form131_assets, 'property_value'):
    property_value = (form131_assets.property_value or 0) * (form131_assets.property_ownership_percent or 100) / 100
    mortgage_balance = form131_assets.mortgage_balance or 0
    real_estate_net = property_value - mortgage_balance
  
  vehicle_net = 0
  if owns_vehicles and hasattr(form131_assets, 'vehicles'):
    for vehicle in form131_assets.vehicles:
      vehicle_value = vehicle.get('current_value', 0) or 0
      loan_balance = vehicle.get('loan_balance', 0) or 0
      vehicle_net += vehicle_value - loan_balance
  
  cash_and_investments = sum([
    getattr(form131_assets, 'chequing_balance', 0) or 0,
    getattr(form131_assets, 'savings_balance', 0) or 0,
    getattr(form131_assets, 'other_bank_accounts', 0) or 0,
    getattr(form131_assets, 'gics_total', 0) or 0,
    getattr(form131_assets, 'rrsp_value', 0) or 0,
    getattr(form131_assets, 'tfsa_value', 0) or 0,
    getattr(form131_assets, 'other_investments', 0) or 0
  ])
  
  personal_property = sum([
    getattr(form131_assets, 'household_contents', 0) or 0,
    getattr(form131_assets, 'jewelry', 0) or 0,
    getattr(form131_assets, 'collections', 0) or 0,
    getattr(form131_assets, 'work_tools', 0) or 0,
    getattr(form131_assets, 'sports_equipment', 0) or 0,
    getattr(form131_assets, 'other_valuables', 0) or 0
  ])
  
  form131_assets.total_value = real_estate_net + vehicle_net + cash_and_investments + personal_property
  form131_asset_collection = True


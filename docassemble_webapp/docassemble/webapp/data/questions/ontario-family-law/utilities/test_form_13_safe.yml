metadata:
  title: Form 13 - Financial Statement
  short title: Form 13
  description: Ontario Family Law Form 13
  authors:
  - name: Ontario Family Law Forms System
    organization: Automated Form Processing
  revision_date: '2025-08-19'
include:
- docassemble.base:data/questions/basic-questions.yml
features:
  navigation: true
  progress bar: true
mandatory: true
code: multi_user = True
objects:
- 'user: Individual'
- 'court: DAObject'
- 'income: DAObject'
- 'expenses: DAObject'
- 'assets: DAObject'
- 'debts: DAObject'
sections:
- Introduction: intro_section
- Court Information: court_section
- Your Information: your_section
- Financial Information: financial_section
- Review: review_section
question order:
- intro_shown
- court_info_gathered
- user_info_gathered
- financial_info_gathered
- form_complete
questions:
- id: intro_shown
  section: intro_section
  question: Form 13 - Financial Statement
  subquestion: This interview will help you complete Form 13.
  continue button field: intro_shown
- id: court_info_gathered
  section: court_section
  question: Court Information
  fields:
  - label: Court File Number
    field: court.court_file_number
  - label: Name of Court
    field: court.name_of_court
  - label: Court Office Address
    field: court.court_office_address
  - label: Your Full Legal Name
    field: court.your_full_legal_name
  - label: Date of Birth
    field: court.date_of_birth
    datatype: date
- id: user_info_gathered
  section: your_section
  question: Your Information
  fields:
  - label: Monthly Income
    field: user.monthly_income
    datatype: currency
  - label: Email Address
    field: user.email_address
    datatype: email
- id: form_complete
  section: review_section
  question: Form 13 Complete
  subquestion: You have completed all required information.
  buttons:
  - 'Exit: exit'
  - 'Restart: restart'
  attachment:
    name: Form 13
    filename: form_13
    description: Form 13 - Financial Statement
    content: '[Your form content will be generated here]'

---
metadata:
  title: Absolutely Minimal Test
  short title: Minimal Test
---
mandatory: True
code: |
  user_name
  user_age
  show_result
---
question: |
  What is your name?
fields:
  - Name: user_name
---
question: |
  How old are you?
fields:

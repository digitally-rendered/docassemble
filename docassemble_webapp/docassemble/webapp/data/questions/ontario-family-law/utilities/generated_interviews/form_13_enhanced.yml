continue button field: expenses_summary_reviewed
code: '

  total_housing_expenses = (expenses.housing_payment or 0) + (expenses.property_taxes
  or 0) + (expenses.home_insurance or 0) + (expenses.utilities or 0) + (expenses.communications
  or 0) + (expenses.maintenance or 0)

  total_living_expenses = (expenses.groceries or 0) + (expenses.transportation or
  0) + (expenses.healthcare or 0) + (expenses.personal_care or 0) + (expenses.entertainment
  or 0)

  total_children_expenses = (expenses.childcare or 0) + (expenses.activities or 0)
  + (expenses.children_clothing or 0) + (expenses.school or 0) + (expenses.children_medical
  or 0) if children.there_are_any else 0

  total_other_expenses = (expenses.insurance or 0) + (expenses.debt_payments or 0)
  + (expenses.support_paid or 0) + (expenses.professional or 0) + (expenses.donations
  or 0) + (expenses.other or 0)

  total_monthly_expenses = total_housing_expenses + total_living_expenses + total_children_expenses
  + total_other_expenses

  monthly_income = total_annual_income / 12

  '


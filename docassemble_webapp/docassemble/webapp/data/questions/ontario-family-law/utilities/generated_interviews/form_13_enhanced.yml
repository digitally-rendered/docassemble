continue button field: assets_summary_reviewed
code: '

  total_liquid_assets = (assets.chequing or 0) + (assets.savings or 0) + (assets.term_deposits
  or 0) + (assets.cash or 0)

  total_investments = (assets.rrsp or 0) + (assets.tfsa or 0) + (assets.investments
  or 0) + (assets.pension or 0) + (assets.life_insurance or 0)

  total_real_estate = ((real_estate.home_value or 0) - (real_estate.home_mortgage
  or 0)) + ((real_estate.other_value or 0) - (real_estate.other_mortgage or 0))

  total_personal_property = (assets.vehicles or 0) + (assets.jewelry or 0) + (assets.household
  or 0) + (assets.collections or 0) + (assets.business or 0) + (assets.other or 0)

  total_assets = total_liquid_assets + total_investments + total_real_estate + total_personal_property

  '


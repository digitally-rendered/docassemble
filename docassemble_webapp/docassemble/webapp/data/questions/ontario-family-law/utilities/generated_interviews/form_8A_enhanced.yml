question: Ontario Form 8A - Application (Divorce)
subquestion: "\nThis interview will help you complete **Ontario Family Law Form 8A\
  \ - Application (Divorce)**.\n\nBefore you begin, make sure you have:\n- Information\
  \ about yourself and the other party\n- Details about any children of the relationship\n\
  - Court file number (if you have one)\n- Financial documents (tax returns, pay stubs,\
  \ bank statements)\n\n**Important:** This interview helps you complete the form\
  \ but does not provide legal advice. \nConsider consulting with a lawyer if you\
  \ have questions about your legal rights or the court process.\n\n**Privacy:** Your\
  \ information is secure and will only be used to complete your form.\n"
continue button field: intro_acknowledged
help: "\n**Who should use this form:**\nThis form is used in Ontario Superior Court\
  \ of Justice for family law matters.\n\n**Legal advice:** This tool helps you complete\
  \ the form but does not provide legal advice. \nIf you need legal advice, contact\
  \ a lawyer or Legal Aid Ontario.\n\n**Court help:** Many courthouses have family\
  \ law information centres that can provide guidance.\n"

subquestion: |
  For each bank accounts, provide:
  - Current market value
  - Supporting statements for the last monthly period(s)
  
fields:
  - Description: assets[i].description
  - Current Value: assets[i].current_value
    datatype: currency
  - "Upload statements": assets[i].statements
    datatype: file
    accept:
      - "application/pdf"
      - "image/*"
    help: |
      % if "asset_bank_accounts" == "asset_bank_accounts":
      Upload the last 12 monthly statements for this account
      % elif "asset_bank_accounts" == "asset_investments":
      Upload quarterly statements for the last year
      % else:
      Upload the most recent statement or valuation
      % endif

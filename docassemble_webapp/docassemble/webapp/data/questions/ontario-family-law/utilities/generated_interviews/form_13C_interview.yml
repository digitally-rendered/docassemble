  - TOTAL OF PROPERTY ITEMS TOTAL OF PROPERTY ITEMS TOTAL OF PROPERTY ITEMS $ $ $ $: total_of_property_items_total_
    datatype: currency
continue button field: property_information_gathered
---
question: |
  Additional Information
fields:

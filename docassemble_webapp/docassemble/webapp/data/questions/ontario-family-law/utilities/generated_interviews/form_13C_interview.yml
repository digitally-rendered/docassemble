    datatype: currency
  - TOTAL OF DEBTS ITEMS TOTAL OF DEBTS ITEMS TOTAL OF DEBTS ITEMS $ $ $ $: total_of_debts_items_total_of_
    datatype: currency
continue button field: financial_information_gathered
---
question: |

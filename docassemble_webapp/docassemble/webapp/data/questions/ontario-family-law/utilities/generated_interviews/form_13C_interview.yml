---
metadata:
  title: |
    Form 13C: Form 13C
  short title: |
    Form 13C
  description: |
    Ontario Family Law Form 13C
    This interview will help you complete the official court form.
  authors:
    - name: Ontario Family Law System
  revision_date: 2025-09-05
---
include:
  - docassemble.base:data/questions/basic-questions.yml
---
features:
  navigation: True
  progress bar: True
  progress bar method: stepped
  progress bar multiplier: 0.1
  question back button: True
  navigation back button: True
---
objects:
  - applicant: Individual
  - respondent: Individual
  - court: DAObject
  - financial: DAObject
  - marriage: DAObject
  - separation: DAObject
  - properties: DAList.using(object_type=DAObject)
---
mandatory: True
code: |
  # Interview flow
  multi_user = True
  
  # Gather information
  court_information_gathered
  applicant_information_gathered
  respondent_information_gathered
  marriage_information_gathered
  financial_information_gathered
  additional_information_gathered
  review_screen
  final_screen
---
question: |
  Court Information
fields:

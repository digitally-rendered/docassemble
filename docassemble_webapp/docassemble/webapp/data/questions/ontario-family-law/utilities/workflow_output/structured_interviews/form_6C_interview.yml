    <li><strong>Name:</strong> ${ safe_get_field(user_party, 'name', 'Not provided') }</li>
    % if hasattr(user_party, 'email'):
    <li><strong>Email:</strong> ${ safe_get_field(user_party, 'email', 'Not provided') }</li>
    % endif

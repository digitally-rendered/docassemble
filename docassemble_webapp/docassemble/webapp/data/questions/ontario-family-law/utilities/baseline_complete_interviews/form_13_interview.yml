  def handle_error(context, error_type, details):
    '''Global error handler'''
    error_entry = {
      'timestamp': current_datetime(),
      'context': context,
      'type': error_type,
      'details': details
    }
    error_log.append(error_entry)
    if debug_mode:
      log(f"ERROR in {context}: {error_type} - {details}", 'error')
    return error_entry

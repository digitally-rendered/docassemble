  This interview will help you with child protection proceedings.
  
  **Important Information:**
  
  * Have all required documents ready
  * Answer all questions truthfully
  * You can save your progress and return later
  * This form must be filed with the court
  
  **Note:** This is not legal advice. Consider consulting a lawyer for your specific situation.
  

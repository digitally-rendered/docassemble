  - "Employment Income": financial_data.1_1_employment_income_before_deductions_
    datatype: currency
    min: 0
    required: False
    default: 0
  - "Commissions, tips and bonuses Commissions, tips...": financial_data.2_2_commissions_tips_and_bonuses_commiss
    datatype: currency
    min: 0
    required: False
    default: 0
  - "Self-Employment Income": financial_data.3_3_self_employment_income_monthly_amoun
    datatype: currency
    min: 0
    required: False
    default: 0
  - "EI Benefits": financial_data.4_4_employment_insurance_benefits_employ
    datatype: currency
    min: 0
    required: False
    default: 0
  - "Workers' compensation benefits Workers' compens...": financial_data.5_5_workers_compensation_benefits_worker
    datatype: currency
    min: 0
    required: False
    default: 0
  - "Social Assistance": financial_data.6_6_social_assistance_income_including_o
    datatype: currency
    min: 0
    required: False
    default: 0
  - "Investment Income": financial_data.7_7_interest_and_investment_income_inter
    datatype: currency
    min: 0
    required: False
    default: 0
  - "Pension Income": financial_data.8_8_pension_income_including_cpp_and_oas
    datatype: currency
    min: 0
    required: False
    default: 0
  - "Spousal support received from a former spouse/p...": financial_data.9_9_spousal_support_received_from_a_form
    datatype: currency
    min: 0
    required: False
    default: 0
  - "Child Tax Benefits or Tax Rebates (e.g. GST) Ch...": financial_data.10_10_child_tax_benefits_or_tax_rebates_
    datatype: currency
    min: 0
    required: False
    default: 0
  - "Other sources of income (e.g. RRSP withdrawals,...": financial_data.11_11_other_sources_of_income_e_g_rrsp_w
    datatype: currency
    min: 0
    required: False
    default: 0
  - "Total Monthly Income": financial_data.12_12_total_monthly_income_from_all_sour
    datatype: currency
    min: 0

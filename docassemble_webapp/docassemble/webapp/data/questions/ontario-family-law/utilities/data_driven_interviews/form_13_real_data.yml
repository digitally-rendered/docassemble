include:
  - docassemble.base:data/questions/basic-questions.yml
---
features:
  progress bar: True
  question back button: True
---
objects:
  - applicant: Individual
  - financial_data: DAObject
---
mandatory: True
code: |
  intro_screen
  court_info_collected
  applicant.name.first
  income_collected
  show_summary
---
question: |
  Form 13 - Financial Statement
subquestion: |
  This interview uses real fields parsed from Form 13.
continue button field: intro_screen
---
question: |
  Court Information
fields:
  - "Court File Number": financial_data.courtfileno
    required: False
  - "Money Owed to You (for example, any court judgments in": financial_data.money_owed_to_you_for_example_any_court_
    required: False
  - "Money Owed to You (for example, any court judgments in": financial_data.money_owed_to_you_for_example_any_court_
    required: False
continue button field: court_info_collected
---
question: |
  Your Information
fields:
  - First Name: applicant.name.first
    required: True
  - Last Name: applicant.name.last
    required: True
  - Address: applicant.address.address
    required: False
  - City: applicant.address.city
    required: False
  - Province: applicant.address.state
    default: ON
  - Postal Code: applicant.address.zip
    required: False
---
question: |
  Monthly Income
subquestion: |
  Enter your monthly income from each source. Leave blank if not applicable.
fields:

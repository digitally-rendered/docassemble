  **Applicant Information**
  
  * Name: ${showifdef("applicant.name.first", applicant.name.full())}
  * Address: ${showifdef("applicant.address.address", applicant.address.on_one_line())}
  % endif
  
  % if 'respondent_information' in sections:
  **Respondent Information**
  
  * Name: ${showifdef("respondent.name.first", respondent.name.full())}
  * Address: ${showifdef("respondent.address.address", respondent.address.on_one_line())}
  % endif
  
  % if 'court_information' in sections:

metadata:
  authors:
  - name: Ontario Family Law Forms System
  description: Complete Ontario Family Court Form 8 - Application (General) to start
    family court proceedings.
  help_url: https://ontariocourtforms.on.ca/en/family-law-forms/
  revision_date: '2025-08-09'
  short title: Form 8 - Application
  tags:
  - ontario
  - family-law
  - form-6b---affidavit-service-flr-06b-apr16-en-fil
  - court-forms
  title: Ontario Family Law Form 8 - Application (General)
include:
  - ontario-family-law-common.yml
features:
  css: ontario-family-law.css
  navigation: true
  progress bar: true
  question help button: true
  show progress bar percentage: true
objects:
  - applicant: Individual
  - respondent: Individual
  - court_info: DAObject
  - marriage: DAObject
  - claims: DADict
---
mandatory: True
code: |
  # Introduction
  introduction_screen
  legal_disclaimer_accepted
  
  # Main interview flow
  
  # Court Information
  court_info.court_file_number
  court_info.court_office_address
  court_info.an_order_of_this_court_made_on
  
  # Applicant Information
  applicant
  
  # Respondent Information
  respondent
  
  # Marriage Information
  marriage.my_relationship_to_or_affiliation
  
  # Claims
  claims.the_order_was_carried_out_as_follows
  
  # Other
  form_6b
  full_legal_name_address_for
  lawyers_name_address_street_number
  
  # Review and submission
  review_screen
  final_screen
---
# Introduction screen
question: |
  Welcome to the Ontario Family Law Forms Assistant
subquestion: |
  This interview will help you complete your Ontario family law court form.
  
  Before you begin, please have the following information ready:
  
  * Personal identification for all parties
  * Contact information
  * Court file number (if you have one)
  * Financial information (if applicable)
  * Details about your case
  
  **Important:** This tool provides assistance in completing court forms but does not provide legal advice.
continue button field: introduction_screen
---
# Legal disclaimer
question: |
  Legal Information Disclaimer
subquestion: |
  **Please read carefully:**
  
  This tool helps you complete Ontario family law court forms. It does not provide legal advice.
  
  * The information you provide will be used to populate official court forms
  * You are responsible for the accuracy of all information
  * Consider consulting a lawyer for legal advice about your case
  * Court forms must be filed according to the Family Law Rules
  
  Do you understand and accept these terms?
field: legal_disclaimer_accepted
buttons:
  - "I understand and accept": True
  - "I do not accept": False
---
# Court Information Questions
question: |
  Court File Number
fields:
  - Court File Number: court_info.court_file_number
---
question: |
  Court office address
fields:
  - Court office address: court_info.court_office_address
---
question: |
  An order of this court made on (date)
fields:
  - An order of this court made on (date): court_info.an_order_of_this_court_made_on
    datatype: date
---
# Applicant Information Questions
question: |
  Applicant(s)
fields:
  - Applicant(s): applicant
---
# Respondent Information Questions
question: |
  Respondent(s)
fields:
  - Respondent(s): respondent
---
# Marriage Information Questions
question: |
  "My relationship to, or affiliation with, any party in this case is as follows:"
fields:
  - My relationship to, or affiliation with, any party in this c: marriage.my_relationship_to_or_affiliation
---
# Claims Questions
question: |
  "The order was carried out as follows: (Give details. Then go to paragraph 13 if you had to travel..."
fields:
  - "The order was carried out as follows: (Give details. Then go": claims.the_order_was_carried_out_as_follows
---
# Other Questions
question: |
  "Form 6B: Affidavit of Service sworn/affirmed"
fields:
  - "Form 6B: Affidavit of Service sworn/affirmed": form_6b
---
question: |
  "Full legal name & address for service — street & number, municipality, postal code, telephone & f..."
fields:
  - "Full legal name & address for service — street & number, mun": full_legal_name_address_for
---
question: |
  "Lawyer’s name & address — street & number, municipality, postal code, telephone & fax numbers and..."
fields:
  - "Lawyer’s name & address — street & number, municipality, pos": lawyers_name_address_street_number
---
question: |
  My name is (full legal name)
fields:
  - My name is (full legal name): my_name_is
---
question: |
  "I live in (municipality & province)"
fields:
  - "I live in (municipality & province)": i_live_in
---
# Review screen
question: |
  Review Your Information
subquestion: |
  Please review the information you have provided.
  
  % if defined('applicant.name.first'):
  **Applicant:** ${ applicant.name }
  % endif
  
  % if defined('respondent.name.first'):
  **Respondent:** ${ respondent.name }
  % endif
  
  % if defined('court_info.file_number'):
  **Court File Number:** ${ court_info.file_number }
  % endif
  
  Is this information correct?
continue button field: review_screen
continue button label: Yes, continue
---
# Final screen
event: final_screen
question: |
  Form Completed
subquestion: |
  Your form has been completed and is ready for download.
  
  **Next Steps:**
  
  1. Download your completed form
  2. Review the form carefully
  3. Sign the form where required
  4. File the form with the court
  5. Serve copies as required by the Family Law Rules
buttons:
  - Exit: exit
  - Start Over: restart
---

---
# Introduction screen
question: |
  Welcome to the Ontario Family Law Forms Assistant
subquestion: |
  This interview will help you complete your Ontario family law court form.
  
  Before you begin, please have the following information ready:
  
  * Personal identification for all parties
  * Contact information
  * Court file number (if you have one)
  * Financial information (if applicable)
  * Details about your case
  
  **Important:** This tool provides assistance in completing court forms but does not provide legal advice.
continue button field: introduction_screen
---
# Legal disclaimer
question: |
  Legal Information Disclaimer
subquestion: |
  **Please read carefully:**
  
  This tool helps you complete Ontario family law court forms. It does not provide legal advice.
  
  * The information you provide will be used to populate official court forms
  * You are responsible for the accuracy of all information
  * Consider consulting a lawyer for legal advice about your case
  * Court forms must be filed according to the Family Law Rules
  
  Do you understand and accept these terms?
field: legal_disclaimer_accepted
buttons:
  - "I understand and accept": True
  - "I do not accept": False
---
# Court Information Questions
question: |
  Court File Number
fields:
  - Court File Number: court_info.court_file_number
---
question: |
  Court office address
fields:
  - Court office address: court_info.court_office_address
---
question: |
  I know that the applicant(s) is/are asking the court to make an order to adopt me.
fields:
  - I know that the applicant(s) is/are asking the court to make: court_info.i_know_that_the_applicant
---
# Applicant Information Questions
question: |
  Applicant(s) (The first letter of the applicant’s surname may be used)
fields:
  - Applicant(s) (The first letter of the applicant’s surname ma: applicant
---
question: |
  I agree to being adopted by the applicant(s).
fields:
  - I agree to being adopted by the applicant(s).: applicant.i_agree_to_being_adopted_by_the_applicant
---
# Respondent Information Questions
question: |
  Respondent(s) (If there is a respondent, the first letter of the respondent’s surname may be used)
fields:
  - Respondent(s) (If there is a respondent, the first letter of: respondent
---
# Children Information Questions
question: |
  "Form 34: Child’s Consent to Adoption"
fields:
  - "Form 34: Child’s Consent to Adoption": children.form_34
---
question: |
  My name is (child’s full legal name)
fields:
  - My name is (child’s full legal name): children.my_name_is
---
question: |
  I explained to (child’s full legal name)
fields:
  - I explained to (child’s full legal name): children.i_explained_to
---
# Claims Questions
question: |
  I understand that once I turn nineteen years old, my birth parent(s) can apply for information fr...
fields:
  - I understand that once I turn nineteen years old, my birth p: claims.i_understand_that_once_i
---
# Other Questions
question: |
  "Full legal name & address for service — street & number, municipality, postal code, telephone & f..."
fields:
  - "Full legal name & address for service — street & number, mun": full_legal_name_address_for
---
question: |
  "Lawyer’s name & address — street & number, municipality, postal code, telephone & fax numbers and..."
fields:
  - "Lawyer’s name & address — street & number, municipality, pos": lawyers_name_address_street_number
---
question: |
  I was born on (give date of birth)
fields:
  - I was born on (give date of birth): i_was_born_on
    datatype: date
---
question: |
  I understand the nature and effect of this consent. I understand that I may withdraw this consent...
fields:
  - I understand the nature and effect of this consent. I under: i_understand_the_nature_and
---
question: |
  who has explained adoption to me,
fields:
  - who has explained adoption to me,: who_has_explained_adoption_to_me
    input type: area
    rows: 4
---
# Review screen
question: |
  Review Your Information
subquestion: |
  Please review the information you have provided.
  
  % if defined('applicant.name.first'):
  **Applicant:** ${ applicant.name }
  % endif
  
  % if defined('respondent.name.first'):
  **Respondent:** ${ respondent.name }
  % endif
  
  % if defined('court_info.file_number'):
  **Court File Number:** ${ court_info.file_number }
  % endif
  
  Is this information correct?
continue button field: review_screen
continue button label: Yes, continue
---
# Final screen
event: final_screen
question: |
  Form Completed
subquestion: |
  Your form has been completed and is ready for download.
  
  **Next Steps:**
  
  1. Download your completed form
  2. Review the form carefully
  3. Sign the form where required
  4. File the form with the court
  5. Serve copies as required by the Family Law Rules
buttons:
  - Exit: exit
  - Start Over: restart
---

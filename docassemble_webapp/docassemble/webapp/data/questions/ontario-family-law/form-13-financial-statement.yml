code: |
  # Calculate total assets
  total_real_estate = sum(
    (asset.get('current_value', 0) * asset.get('ownership_percentage', 100) / 100)
    for asset in form13_assets.get('real_estate', [])
  )
  
  total_vehicles = sum(
    vehicle.get('current_value', 0) for vehicle in form13_assets.get('vehicles', [])
  )
  
  total_bank_accounts = sum(
    account.get('balance', 0) for account in form13_assets.get('bank_accounts', [])
  )
  
  total_investments = sum(
    investment.get('current_value', 0) for investment in form13_assets.get('investments', [])
  )
  
  total_business = sum(
    business.get('estimated_value', 0) * business.get('ownership_percentage', 100) / 100
    for business in form13_business_interests
  )
  
  pension_categories = ['employer_plan_value', 'rrsp_total', 'rrif_value', 'lira_value', 'lif_value', 'other_retirement']
  total_pension = sum(
    form13_assets.pension.get(category, 0) or 0 for category in pension_categories
  )
  
  total_other_assets = sum(
    asset.get('value', 0) for asset in form13_assets.get('other_assets', [])
  )
  
  form13_assets.total_value = (
    total_real_estate + total_vehicles + total_bank_accounts + 
    total_investments + total_business + total_pension + total_other_assets
  )
  
  form13_asset_collection = True


code: |
  # Calculate total liabilities
  total_mortgages = sum(
    mortgage.get('balance', 0) * mortgage.get('responsibility_percentage', 100) / 100
    for mortgage in form13_liabilities.get('mortgages', [])
  )
  
  total_credit = sum(
    credit.get('balance', 0) for credit in form13_liabilities.get('credit', [])
  )
  
  total_loans = sum(
    loan.get('balance', 0) for loan in form13_liabilities.get('loans', [])
  )
  
  total_contingent = sum(
    contingent.get('amount', 0) for contingent in form13_liabilities.get('contingent', [])
    if contingent.get('likelihood') in ['Probable', 'Certain']
  )
  
  form13_liabilities.total_debt = total_mortgages + total_credit + total_loans
  form13_liabilities.total_with_contingent = form13_liabilities.total_debt + total_contingent
  
  form13_liability_collection = True


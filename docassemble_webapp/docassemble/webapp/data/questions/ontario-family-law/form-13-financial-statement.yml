code: |
  # This would integrate with a proper child support calculator
  def calculate_child_support_table_amount(income, children, province):
    # Placeholder for actual Child Support Guidelines calculation
    # Would integrate with official tables
    base_amounts = {
      1: {50000: 456, 75000: 646, 100000: 836, 150000: 1187, 200000: 1537},
      2: {50000: 742, 75000: 1051, 100000: 1360, 150000: 1929, 200000: 2499},
      3: {50000: 1002, 75000: 1420, 100000: 1837, 150000: 2604, 200000: 3371}
    }
    
    if children <= 3 and income in base_amounts[children]:
      return f"${base_amounts[children][income]:,.2f}/month"
    else:
      return "Amount requires calculation - see Child Support Guidelines"
  
  def calculate_child_support_total(income, children, province):
    # Simplified calculation for demonstration
    if children == 1 and income >= 150000:
      return "$1,187.00/month"
    elif children == 2 and income >= 150000:
      return "$1,929.00/month"
    else:
      return "Amount requires detailed calculation"
  

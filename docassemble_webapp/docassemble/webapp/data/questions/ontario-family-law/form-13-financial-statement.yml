event: ineligible_for_financial_statement
question: |
  Additional Information Required
subquestion: |
  To complete a financial statement, we need more information about your financial situation.
  
  Please consult with a lawyer or paralegal to determine the appropriate form and requirements for your case.
  
  **Resources:**
  - Law Society of Ontario Referral Service: 1-855-947-5787
  - Legal Aid Ontario: 1-800-668-8258
  - Pro Bono Ontario: 1-855-255-7256

---
# PRIVACY AND LEGAL NOTICES

question: |
  Privacy Protection for Financial Information
subquestion: |
  ${ privacy_disclaimer }
  
  **Important Privacy Notice:**
  
  Financial statements contain highly sensitive personal and financial information.
  This information is subject to:
  - Court confidentiality rules
  - Privacy protection under applicable legislation
  - Restricted access by court personnel only
  - Potential disclosure to other parties in the legal proceeding
  
  **Security Measures:**
  - All data is encrypted and stored securely
  - Access is logged and monitored
  - Information is only shared as required by court rules
  - You can request sealing orders for highly sensitive information
  
  **Professional Review Recommended:**
  Given the complexity of Form 13, it is strongly recommended that you have an accountant, financial advisor, or lawyer review your financial statement before filing.
field: understand_financial_privacy
datatype: checkboxes
choices:
  - I understand the privacy implications of financial disclosure: privacy_understood
  - I understand this information may be shared with other parties: sharing_understood
  - I understand the importance of accurate financial disclosure: accuracy_understood
validation code: |
  if not (privacy_understood and sharing_understood and accuracy_understood):
    validation_error("You must acknowledge all privacy and legal requirements to proceed.")

---
question: |
  Legal Requirements for Financial Statements
subquestion: |
  ${ legal_disclaimer }
  
  **Legal Requirements - Form 13:**
  
  1. **Accuracy**: All information must be complete and accurate. Deliberately false or misleading statements can result in:
     - Contempt of court charges
     - Perjury charges
     - Adverse cost orders
     - Loss of credibility with the court
  
  2. **Documentation**: You must attach supporting documents including:
     - Most recent tax return and Notice of Assessment
     - Most recent pay stub or employment letter
     - Business financial statements (if applicable)
     - Professional valuations (if required)
     - Investment statements
     - Bank statements
  
  3. **Updates**: You must update your financial statement if material changes occur.
  
  4. **Professional Valuations**: Required for:
     - Business interests over $10,000
     - Professional practices
     - Complex investment portfolios
     - Unique or significant assets
  
  **Penalties for False Information:**
  Providing false information to the court is a serious offense and can result in criminal charges.
field: understand_legal_requirements
datatype: checkboxes
choices:
  - I understand the accuracy requirements: accuracy_required
  - I understand the documentation requirements: documentation_required
  - I understand the penalties for false information: penalties_understood
  - I will obtain professional valuations where required: valuations_understood
validation code: |
  if not all([accuracy_required, documentation_required, penalties_understood, valuations_understood]):
    validation_error("You must acknowledge all legal requirements to proceed.")


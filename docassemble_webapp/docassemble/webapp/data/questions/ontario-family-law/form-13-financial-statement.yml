code: |
  # Calculate total annual income
  income_sources = [
    'primary_employment', 'secondary_employment', 'overtime', 'commission', 'bonus', 'tips',
    'other_employment', 'business_net', 'professional_practice', 'partnership', 'rental_net',
    'interest', 'dividends', 'capital_gains', 'rrsp_rrif', 'pension', 'ei_benefits',
    'social_assistance', 'disability_benefits', 'workers_comp', 'child_support_received',
    'spousal_support_received', 'trust_income', 'estate_income', 'other'
  ]
  
  form13_income.total_annual = sum(
    getattr(form13_income, source, 0) or 0 
    for source in income_sources
  )
  
  form13_income.total_monthly = form13_income.total_annual / 12
  form13_income_collection = True


code: |
  validation_errors = []
  
  # Income validation
  if form13_income.total_annual <= 0:
    validation_errors.append("Total annual income must be greater than zero.")
  
  # Asset validation
  if len(form13_assets.get('bank_accounts', [])) == 0:
    validation_errors.append("At least one bank account must be listed.")
  
  # Professional valuation validation
  if total_business > 10000 and not form13_professional_valuations.number():
    validation_errors.append("Professional valuation required for business interests over $10,000.")
  
  # Children validation
  for child in form13_children:
    if child.age >= 18 and not child.special_needs:
      validation_errors.append(f"Child {child.name.first} is over 18 - confirm eligibility for support.")
  
  if validation_errors:
    form13_final_validation = False
    validation_error_list = validation_errors
  else:
    form13_final_validation = True


# ELIGIBILITY AND ROUTING

question: |
  Financial Statement Type - Form 13 or Form 13.1?
subquestion: |
  To determine which financial statement form you need, please answer these questions:
  
  **Form 13 (Complex)** is required if you have:
  - Annual income over $150,000
  - Business or professional practice ownership
  - Complex investment portfolio
  - Multiple properties or significant assets
  - Trust or estate interests
  - Partnership interests
  
  **Form 13.1 (Simple)** can be used if you have:
  - Annual income under $150,000
  - Employment income primarily
  - Basic assets (home, car, savings)
  - Simple financial situation
fields:
  - Annual gross income: applicant_annual_income
    datatype: currency
    help: |
      Include all sources of income before taxes and deductions
  - Do you own or have interest in a business or professional practice?: has_business_interest
    datatype: yesnoradio
  - Do you have complex investments (stocks, bonds, mutual funds, real estate investments)?: has_complex_investments
    datatype: yesnoradio
  - Do you own multiple properties?: has_multiple_properties
    datatype: yesnoradio
  - Do you have trust or estate interests?: has_trust_estate_interests
    datatype: yesnoradio
  - Do you anticipate needing professional valuations for your assets?: needs_professional_valuations
    datatype: yesnoradio

---
code: |
  form13_eligibility_check = (
    applicant_annual_income > 150000 or
    has_business_interest or
    has_complex_investments or
    has_multiple_properties or
    has_trust_estate_interests or
    needs_professional_valuations
  )

---
code: |
  suggest_form_13_1 = applicant_annual_income < 150000 and not any([
    has_business_interest,
    has_complex_investments,
    has_multiple_properties,
    has_trust_estate_interests,
    needs_professional_valuations
  ])

---
event: redirect_to_form_13_1
question: |
  Form 13.1 (Simple) is More Appropriate
subquestion: |
  Based on your responses, **Form 13.1 (Simple Financial Statement)** would be more appropriate for your situation.
  
  Form 13.1 is designed for situations with:
  - Annual income under $150,000
  - Primarily employment income
  - Basic assets and straightforward finances
  
  **Would you like to proceed with Form 13.1 instead?**
buttons:
  - Continue with Form 13.1: redirect
    url: |
      ${ url_of('ontario-family-law/form-13-1-financial-statement-simple.yml') }
  - Continue with Form 13 anyway: continue
    color: secondary
  - Exit: exit


# PARTY INFORMATION

question: |
  Applicant Information
subquestion: |
  Please provide information about the applicant (person filing this financial statement).
fields:
  - First Name: form13_applicant.name.first
  - Last Name: form13_applicant.name.last
  - Date of Birth: form13_applicant.birthdate
    datatype: date
    validate: |
      lambda x: validate_legal_date(x, 'birth_date')['valid']
  - Social Insurance Number: form13_applicant.sin
    help: |
      Required for court identification and support calculations.
      Will be masked for privacy protection in documents.
    validate: |
      lambda x: validate_sin_number(x, 'court_filing')['valid']
  - Occupation: form13_applicant.occupation
  - Employer: form13_applicant.employer
    required: False
  - Work Phone: form13_applicant.phone_work
    required: False
validation code: |
  date_validation = validate_legal_date(form13_applicant.birthdate, 'birth_date')
  if not date_validation['valid']:
    validation_error(date_validation['message'])
  
  sin_validation = validate_sin_number(form13_applicant.sin, 'court_filing')
  if not sin_validation['valid']:
    validation_error(sin_validation['message'])
  form13_applicant.sin_masked = sin_validation['masked']
  
  if form13_applicant.phone_work:
    phone_validation = format_canadian_phone(form13_applicant.phone_work)
    if not phone_validation['valid']:
      validation_error(phone_validation['message'])
    form13_applicant.phone_work = phone_validation['formatted']
---
code: |
  form13_applicant_info = True

---

question: |
  Children Information
subquestion: |
  ${ privacy_disclaimer }
  
  Please provide information about all children involved in this proceeding.
list collect: True
fields:
  - Child's first name: form13_children[i].name.first
  - Child's last name (or initial for privacy): form13_children[i].name.last
    help: |
      You may use only initials for privacy protection
  - Date of birth: form13_children[i].birthdate
    datatype: date
    validate: |
      lambda x: validate_legal_date(x, 'birth_date')['valid']
  - Child lives primarily with: form13_children[i].lives_with
    choices:
      - Applicant
      - Respondent
      - Both parents equally
      - Other (specify below)
  - If other, specify: form13_children[i].lives_with_other
    show if:
      variable: form13_children[i].lives_with
      is: "Other (specify below)"
  - Special needs or circumstances: form13_children[i].special_needs
    datatype: area
    required: False
    help: |
      Include information about special needs, medical conditions, 
      or other circumstances affecting child support calculations
  - Annual childcare costs: form13_children[i].childcare_costs
    datatype: currency
    required: False
  - Annual extraordinary expenses: form13_children[i].extraordinary_expenses
    datatype: currency
    required: False
    help: |
      Medical, dental, educational, or other extraordinary expenses
validation code: |
  date_validation = validate_legal_date(form13_children[i].birthdate, 'birth_date')
  if not date_validation['valid']:
    validation_error(date_validation['message'])
  
  # Calculate age
  age_calc = calculate_age(form13_children[i].birthdate)
  form13_children[i].age = age_calc['years']
  form13_children[i].age_string = age_calc['age_string']
---
code: |
  form13_children_info = True


# Data validation functions
code: |
  def validate_separation_period(sep_date):
    """Validate that separation period meets one-year requirement"""
    if not sep_date:
      return False
    days_separated = (today() - sep_date).days
    return days_separated >= 365
  
  def calculate_separation_days(sep_date):
    """Calculate days separated for user display"""
    if not sep_date:
      return 0
    return (today() - sep_date).days
  
  def format_currency_estimate(amount):
    """Format currency for estimates and ranges"""
    if not amount:
      return "Not specified"
    return f"${amount:,.2f}"
  
  def validate_ontario_residence(period_text):
    """Validate Ontario residence requirement"""
    # This would contain logic to parse and validate residence period
    # For now, simple text validation
    return len(period_text.strip()) > 0
---
---
metadata:
  title: |
    Ontario Family Law Form 8A - Application (Divorce)
  short title: |
    Form 8A - Divorce Application
  description: |
    Complete Form 8A to apply for divorce in Ontario, including claims for custody,
    support, and property division under the Divorce Act and Family Law Act.
  authors:
    - name: Ontario Family Law Navigator
  revision_date: 2025-01-15

---
code: |
  # Test validation patterns
  validation_test_results = []
  
  # Test postal code validation
  valid_postcodes = ["M5H 2N2", "M5H2N2", "K1A 0B1", "V6B 4Y8"]
  invalid_postcodes = ["12345", "ABCDEF", "M5H 2N", "5H2 N2M"]
  
  for pc in valid_postcodes:
    if re.match(r'^[A-Z]\d[A-Z]\s?\d[A-Z]\d$', pc.upper()):
      validation_test_results.append(f"✓ Valid postal code '{pc}' accepted")
    else:
      validation_test_results.append(f"✗ Valid postal code '{pc}' rejected")
  
  for pc in invalid_postcodes:
    if not re.match(r'^[A-Z]\d[A-Z]\s?\d[A-Z]\d$', pc.upper()):
      validation_test_results.append(f"✓ Invalid postal code '{pc}' correctly rejected")
    else:
      validation_test_results.append(f"✗ Invalid postal code '{pc}' incorrectly accepted")
  
  # Test email validation
  valid_emails = ["test@example.com", "user.name@domain.co.uk", "first-last@company.org"]
  invalid_emails = ["notanemail", "@example.com", "user@", "user@.com"]
  
  for email in valid_emails:
    if re.match(r'^[\w\.\-]+@[\w\.\-]+\.\w+$', email):
      validation_test_results.append(f"✓ Valid email '{email}' accepted")
    else:
      validation_test_results.append(f"✗ Valid email '{email}' rejected")
  
  for email in invalid_emails:
    if not re.match(r'^[\w\.\-]+@[\w\.\-]+\.\w+$', email):
      validation_test_results.append(f"✓ Invalid email '{email}' correctly rejected")
    else:
      validation_test_results.append(f"✗ Invalid email '{email}' incorrectly accepted")
  
  # Test LSO number validation
  valid_lso = ["12345", "12345A", "99999Z"]
  invalid_lso = ["1234", "123456", "ABCDE", "12A45"]
  
  for lso in valid_lso:
    if re.match(r'^\d{5}[A-Z]?$', lso):
      validation_test_results.append(f"✓ Valid LSO '{lso}' accepted")
    else:
      validation_test_results.append(f"✗ Valid LSO '{lso}' rejected")
  
  for lso in invalid_lso:
    if not re.match(r'^\d{5}[A-Z]?$', lso):
      validation_test_results.append(f"✓ Invalid LSO '{lso}' correctly rejected")
    else:
      validation_test_results.append(f"✗ Invalid LSO '{lso}' incorrectly accepted")
  
  test_validation_patterns = True
---
code: |
  # Test that the wizard can be loaded
  wizard_test_results = []
  
  try:
    # Check if validation_error is available (built-in docassemble function)
    test_validation = validation_error
    wizard_test_results.append("✓ validation_error function is available")
  except:
    wizard_test_results.append("✗ validation_error function not available")
  
  try:
    # Check date validation
    import datetime
    min_date = (datetime.datetime.now() - datetime.timedelta(days=365*100)).date()
    max_date = (datetime.datetime.now() - datetime.timedelta(days=365*18)).date()
    wizard_test_results.append(f"✓ Date validation range: {min_date} to {max_date}")
  except Exception as e:
    wizard_test_results.append(f"✗ Date validation failed: {str(e)}")
  
  # Check that all required object types are available
  try:
    from docassemble.base.util import Person, Individual, Organization, DAObject
    wizard_test_results.append("✓ All required object types imported")
  except:
    wizard_test_results.append("✗ Failed to import required object types")
  
  test_wizard_loading = True
---
event: show_complete_test_results
question: |
  Complete Wizard Test Results
subquestion: |
  ## Object Creation Tests
  % for result in object_test_results:
  ${ result }
  % endfor
  
  ## Validation Pattern Tests
  % for result in validation_test_results:
  ${ result }
  % endfor
  
  ## Wizard Loading Tests
  % for result in wizard_test_results:
  ${ result }
  % endfor
  
  ## Overall Summary
  - **Object Tests:** ${ len([r for r in object_test_results if r.startswith('✓')]) }/${ len(object_test_results) } passed
  - **Validation Tests:** ${ len([r for r in validation_test_results if r.startswith('✓')]) }/${ len(validation_test_results) } passed
  - **Loading Tests:** ${ len([r for r in wizard_test_results if r.startswith('✓')]) }/${ len(wizard_test_results) } passed
  
  % if all(r.startswith('✓') for r in object_test_results + validation_test_results + wizard_test_results):
  ## ✅ All Tests Passed!
  
  The Ontario Family Law wizard should now work correctly with:
  - Person objects for parties (applicant/respondent)
  - Individual objects for lawyers
  - Organization objects for law firms
  - All validation patterns functioning properly
  - validation_error function available for field validation
  % else:
  ## ⚠️ Some Tests Failed
  
  Please review the failed tests above and fix any remaining issues.
  % endif
  

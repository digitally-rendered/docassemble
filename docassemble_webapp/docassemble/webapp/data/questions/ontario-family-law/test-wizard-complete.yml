---
metadata:
  title: Complete Wizard Test
  description: Test that validates the complete Ontario Family Law wizard functionality
---
# Import the necessary modules
modules:
  - re
  - datetime
---
objects:
  # Test objects matching the wizard structure
  - test_applicant: Person
  - test_respondent: Person
  - test_lawyer: Individual
  - test_law_firm: Organization
  - test_court: DAObject
  - test_court.address: DAObject
---
mandatory: True
code: |
  # Run all tests
  test_objects
  test_validation_patterns
  test_wizard_loading
  
  # Show results
  show_complete_test_results
---
code: |

---
metadata:
  title: Ontario Family Law Form 8 - Application (General)
  short title: Form 8 - Application
---
# Simplified object definitions without complex includes
objects:
  - applicant: Individual
  - respondent: Individual
  - claims_selection: DADict
---
# Main interview flow
mandatory: True
code: |
  intro_screen
  applicant.name.first
  applicant.name.last
  court_location
  claims_selection
  final_screen
---
question: |
  Ontario Family Law Form 8 - Application (General)
subquestion: |
  This form is used to start family court proceedings in Ontario.
  
  **Important Legal Disclaimer:** This system provides legal information, not legal advice. 
  You should consult with a lawyer or contact Legal Aid Ontario for legal advice.
field: intro_screen
---
question: |
  Court Information
subquestion: |
  Please select where you want to file your application:
fields:
  - Court Location: court_location
    choices:
      - Toronto: toronto
      - Ottawa: ottawa
      - Hamilton: hamilton
      - London: london
      - Windsor: windsor
      - Thunder Bay: thunder_bay
      - Sudbury: sudbury
      - Kingston: kingston
---
question: |
  What orders are you asking the court to make?
subquestion: |
  Select all that apply:
fields:
  - Claims: claims_selection
    datatype: checkboxes
    choices:
      - Divorce: divorce
      - Custody of children: custody
      - Access to children: access
      - Child support: child_support
      - Spousal support: spousal_support
      - Property division: property
      - Exclusive possession of home: possession
      - Restraining order: restraining
---
question: |
  Your Name
subquestion: |
  Please enter your full legal name:
fields:
  - First Name: applicant.name.first
  - Last Name: applicant.name.last
---
mandatory: True
question: |
  Your Application Summary
subquestion: |
  **Applicant:** ${ applicant.name.first } ${ applicant.name.last }
  
  **Court:** ${ court_location.title() } Superior Court of Justice
  
  **Orders Requested:**
  % for claim in claims_selection:
  % if claims_selection[claim]:
  * ${ claim.title().replace('_', ' ') }
  % endif
  % endfor
  
  **Next Steps:**
  1. Complete additional required forms based on your claims
  2. File this application at the court
  3. Serve the respondent with the documents
  
  **Get Legal Help:**
  - [Legal Aid Ontario](https://www.legalaid.on.ca/)
  - [Law Society of Ontario](https://lso.ca/public-resources/finding-a-lawyer-or-paralegal)

buttons:
  - Restart: restart
  - Exit: exit
field: final_screen
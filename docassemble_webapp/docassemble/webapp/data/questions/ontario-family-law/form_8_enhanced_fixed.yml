---
code: |
  court_information_complete = True
---
question: |
  Court Information
subquestion: |
  Please provide information about the court where you are filing this application.
fields:
  - Court Type: court.type
    input type: radio
    choices:
      - Ontario Court of Justice
      - Superior Court of Justice
      - Superior Court of Justice Family Branch
    default: Superior Court of Justice
  - Court File Number: court.file_number
    required: False
    help: |
      Format: XX-YY-12345 (e.g., FC-24-12345)
      Leave blank if not yet assigned
    validate: validate_ontario_court_file
  - Court Office Address: court.address
    input type: area
    rows: 2
    default: |
      393 University Avenue
      Toronto, ON M5G 1E6
---
code: |
  applicant_information_complete = True
---
question: |
  Applicant Information
subquestion: |
  Please provide your information as the applicant.
fields:
  - First Name: applicant.name.first
    required: True
  - Middle Name(s): applicant.name.middle
    required: False
  - Last Name: applicant.name.last
    required: True
  - Name Before Marriage: applicant.name_before_marriage
    required: False
    help: If different from current name
---
question: |
  Applicant Contact Information
fields:

    datatype: checkboxes
    choices:
      - Divorce: divorce
      - Support for me: spousal_support
      - Support for children: child_support
      - Custody of children: custody
      - Access to children: access
      - Division of property: property_division
      - Exclusive possession of matrimonial home: exclusive_possession
      - Equalization of net family property: equalization
      - Restraining order: restraining_order
      - Other: other
    none of the above: False

attachment:
  name: Form 8 - Application (General)
  filename: form_8_application
  variable name: form_8_document
  pdf template file: flr-8-jun25-en.pdf
  editable: False
  fields:
    # Court Information
    - "court_type": ${ court.type }
    - "court_file_number": ${ court.file_number if court.file_number else "" }
    - "court_address": ${ court.address }
    
    # Applicant Information
    - "applicant_name": ${ applicant.name.full() }
    - "applicant_name_before_marriage": ${ applicant.name_before_marriage if defined('applicant.name_before_marriage') else "" }
    - "applicant_address": ${ applicant.address.address + (", Unit " + applicant.address.unit if defined('applicant.address.unit') else "") }
    - "applicant_city": ${ applicant.address.city }
    - "applicant_province": ${ applicant.address.province }
    - "applicant_postal_code": ${ format_postal(applicant.address.postal_code) }
    - "applicant_phone": ${ format_phone(applicant.phone_number) if defined('applicant.phone_number') else "" }
    - "applicant_fax": ${ format_phone(applicant.fax_number) if defined('applicant.fax_number') else "" }
    - "applicant_email": ${ applicant.email if defined('applicant.email') else "" }
    
    # Respondent Information
    - "respondent_name": ${ respondent.name.full() }
    - "respondent_name_before_marriage": ${ respondent.name_before_marriage if defined('respondent.name_before_marriage') else "" }
    - "respondent_address": ${ respondent.address.address + (", Unit " + respondent.address.unit if defined('respondent.address.unit') else "") }
    - "respondent_city": ${ respondent.address.city }
    - "respondent_province": ${ respondent.address.province }
    - "respondent_postal_code": ${ format_postal(respondent.address.postal_code) if defined('respondent.address.postal_code') else "" }
    - "respondent_phone": ${ format_phone(respondent.phone_number) if defined('respondent.phone_number') else "" }
    - "respondent_email": ${ respondent.email if defined('respondent.email') else "" }
    
    # Marriage Information
    - "marriage_date": ${ marriage.date.format() if marriage.exists else "" }
    - "marriage_place": ${ marriage.place_city + ", " + marriage.place_province if marriage.exists else "" }
    - "separation_date": ${ separation.date.format() if defined('separation.exists') and separation.exists else "" }
    
    # Claims checkboxes
    - "claim_divorce": ${ claims.list['divorce'] if 'divorce' in claims.list else False }
    - "claim_spousal_support": ${ claims.list['spousal_support'] if 'spousal_support' in claims.list else False }
    - "claim_child_support": ${ claims.list['child_support'] if 'child_support' in claims.list else False }
    - "claim_custody": ${ claims.list['custody'] if 'custody' in claims.list else False }
    - "claim_access": ${ claims.list['access'] if 'access' in claims.list else False }
    - "claim_property": ${ claims.list['property_division'] if 'property_division' in claims.list else False }
    - "claim_exclusive_possession": ${ claims.list['exclusive_possession'] if 'exclusive_possession' in claims.list else False }
    - "claim_equalization": ${ claims.list['equalization'] if 'equalization' in claims.list else False }
    - "claim_restraining": ${ claims.list['restraining_order'] if 'restraining_order' in claims.list else False }
    - "claim_other": ${ claims.list['other'] if 'other' in claims.list else False }
    - "claim_other_details": ${ claims.other_specify if defined('claims.other_specify') else "" }
    
    # Important Facts
    - "important_facts": ${ important_facts if defined('important_facts') else "" }
    
    # Lawyer Information
    - "applicant_lawyer_name": ${ applicant.lawyer_name if defined('applicant.has_lawyer') and applicant.has_lawyer else "" }
    - "applicant_lawyer_firm": ${ applicant.lawyer_firm if defined('applicant.has_lawyer') and applicant.has_lawyer else "" }
    - "applicant_lawyer_phone": ${ format_phone(applicant.lawyer_phone) if defined('applicant.has_lawyer') and applicant.has_lawyer and defined('applicant.lawyer_phone') else "" }
    - "applicant_lawyer_email": ${ applicant.lawyer_email if defined('applicant.has_lawyer') and applicant.has_lawyer and defined('applicant.lawyer_email') else "" }
    
    - "respondent_lawyer_name": ${ respondent.lawyer_name if defined('respondent.has_lawyer') and respondent.has_lawyer and defined('respondent.lawyer_name') else "" }
    - "respondent_lawyer_firm": ${ respondent.lawyer_firm if defined('respondent.has_lawyer') and respondent.has_lawyer and defined('respondent.lawyer_firm') else "" }
    
    # Date
    - "date_signed": ${ today() }

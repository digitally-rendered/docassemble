---
code: |
  review_complete = True
---
question: |
  Review Your Information
subquestion: |
  Please review the information you have provided before submitting.
  
  **Court Information**
  
  * Court: ${ court.type }
  * File Number: ${ court.file_number if court.file_number else "To be assigned" }
  * Court Address: ${ court.address }
  
  **Applicant**
  
  * Name: ${ applicant.name.full() }
  * Address: ${ applicant.address.block() }
  * Phone: ${ format_phone(applicant.phone_number) if defined('applicant.phone_number') else "Not provided" }
  * Email: ${ applicant.email if defined('applicant.email') else "Not provided" }
  
  **Respondent**
  
  * Name: ${ respondent.name.full() }
  * Address: ${ respondent.address.block() }
  * Phone: ${ format_phone(respondent.phone_number) if defined('respondent.phone_number') else "Not provided" }
  * Email: ${ respondent.email if defined('respondent.email') else "Not provided" }
  
  % if marriage.exists:
  **Marriage**
  
  * Date: ${ marriage.date }
  * Place: ${ marriage.place_city }, ${ marriage.place_province }
  % endif
  
  % if children.there_are_any:
  **Children**
  
  % for child in children:
  * ${ child.name.full() } (DOB: ${ child.birthdate }, Age: ${ age_in_years(child.birthdate) })
  % endfor
  % endif
  
  **Claims**
  
  % for claim, label in claims.list.true_values():
  * ${ label }
  % endfor
  
  % if defined('important_facts') and important_facts:
  **Important Facts**
  
  ${ important_facts }
  % endif
  
field: review_confirmation
buttons:
  - Edit Answers: restart
  - Continue: continue
---
event: final_screen
question: |
  Form 8 Application Complete
subquestion: |
  Your Form 8 Application (General) has been completed successfully.
  
  **Court File Number:** ${ court.file_number if court.file_number else "To be assigned" }
  
  **Next Steps:**
  
  1. Download your completed form using the link below
  2. Print the form (you will need multiple copies)
  3. Sign the form in the presence of a commissioner for taking affidavits
  4. File the form with the court
  5. Serve a copy on the respondent
  
  **Required Copies:**
  
  * Original for the court
  * Copy for yourself
  * Copy for the respondent
  * Additional copies if there are other parties
  
  **Filing Fee:** Please check with the court for current filing fees.
  
  **Service Requirements:** The respondent must be served with this application
  within 30 days of filing (or as directed by the court).
  
  ${ action_button_html(url_action('generate_form_8'), label="Download Form 8 (PDF)", color="primary", size="lg") }
  
buttons:
  - Exit: exit
  - Start New Application: restart

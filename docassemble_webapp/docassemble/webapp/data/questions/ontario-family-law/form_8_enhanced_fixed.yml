    required: True
  - Unit/Apt: applicant.address.unit
    required: False
  - City: applicant.address.city
    required: True
    default: Toronto
  - Province: applicant.address.province
    code: |
      province_list()
    default: ON
  - Postal Code: applicant.address.postal_code
    required: True
    validate: validate_ontario_postal_code
    help: Format: A1A 1A1
---
question: |
  Applicant Contact Details
fields:

code: |
  # Ontario-specific validation functions
  import re
  
  def validate_ontario_postal_code(postal_code):
      """Validate Ontario postal code format"""
      if not postal_code:
          return True
      postal_clean = re.sub(r'\s+', '', postal_code.upper())
      pattern = r'^[A-Z][0-9][A-Z][0-9][A-Z][0-9]$'
      if not re.match(pattern, postal_clean):
          validation_error("Please enter a valid postal code format (A1A 1A1)")
          return False
      ontario_first_letters = 'KLMNP'
      if postal_clean[0] not in ontario_first_letters:
          validation_error("Please enter a valid Ontario postal code")
          return False
      return True
  
  def validate_ontario_court_file(file_number):
      """Validate Ontario court file number format"""
      if not file_number:
          return True
      patterns = [
          r'^(FS|FC|FD|FM|FE)-[0-9]{2}-[0-9]{5,6}$',
          r'^[0-9]{2}-[0-9]{5,6}$',
          r'^[A-Z]{2}-[0-9]{2}-[0-9]{5,6}$'
      ]
      file_upper = file_number.upper().strip()
      if not any(re.match(pattern, file_upper) for pattern in patterns):
          validation_error("Please enter a valid court file number (e.g., FC-24-12345)")
          return False
      return True
  
  def validate_canadian_phone(phone_number):
      """Validate Canadian phone number"""
      if not phone_number:
          return True
      digits_only = re.sub(r'\D', '', phone_number)
      if len(digits_only) == 10:
          return True
      elif len(digits_only) == 11 and digits_only[0] == '1':
          return True
      else:
          validation_error("Please enter a valid 10-digit phone number")
          return False
      return True
  
  def format_phone(phone_number):
      """Format phone number for display"""
      if not phone_number:
          return ""
      digits_only = re.sub(r'\D', '', phone_number)
      if len(digits_only) == 10:
          return f"({digits_only[:3]}) {digits_only[3:6]}-{digits_only[6:]}"
      elif len(digits_only) == 11 and digits_only[0] == '1':
          return f"1 ({digits_only[1:4]}) {digits_only[4:7]}-{digits_only[7:]}"
      return phone_number
  
  def format_postal(postal_code):
      """Format postal code for display"""
      if not postal_code:
          return ""
      clean = re.sub(r'\s+', '', postal_code.upper())
      if len(clean) == 6:
          return f"{clean[:3]} {clean[3:]}"
      return postal_code

# PRIVACY PROTECTION FUNCTIONS

code: |
  def protect_child_privacy(child_data, privacy_level='standard'):
    """
    Apply privacy protections to child information based on privacy level.
    
    Args:
        child_data: Child information object
        privacy_level (str): 'standard', 'high', 'sealed'
        
    Returns:
        dict: Privacy-protected child data
    """
    protected = {}
    
    if privacy_level == 'sealed':
      # Sealed records - minimal information
      protected['initials'] = f"{child_data.first_name[0]}.{child_data.last_name[0]}."
      protected['age'] = child_data.age
      protected['lives_with'] = child_data.lives_with
    elif privacy_level == 'high':
      # High privacy - first name and initial
      protected['first_name'] = child_data.first_name
      protected['last_initial'] = child_data.last_name[0] + "."
      protected['birth_year'] = child_data.birth_date.year
      protected['age'] = child_data.age
      protected['lives_with'] = child_data.lives_with
    else:
      # Standard privacy - some information protected
      protected['first_name'] = child_data.first_name
      protected['last_name'] = child_data.last_name
      protected['birth_date'] = child_data.birth_date
      protected['age'] = child_data.age
      protected['lives_with'] = child_data.lives_with
      if hasattr(child_data, 'special_needs'):
        protected['special_needs'] = child_data.special_needs
    
    return protected


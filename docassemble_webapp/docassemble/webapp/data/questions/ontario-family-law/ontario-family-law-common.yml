# SIN Number Validation (with privacy considerations)
code: |
  def validate_sin_number(sin, purpose='court_filing'):
    """
    Validates Canadian Social Insurance Number with privacy considerations.
    
    Args:
        sin (str): The SIN to validate
        purpose (str): Purpose for collection ('court_filing', 'support_calculation')
        
    Returns:
        dict: {'valid': bool, 'masked': str, 'message': str, 'privacy_warning': str}
    """
    if not sin:
      return {'valid': False, 'masked': '', 'message': 'SIN is required for this purpose',
              'privacy_warning': 'SIN collection must be legally justified'}
    
    # Extract digits only
    digits = re.sub(r'[^0-9]', '', sin)
    
    if len(digits) != 9:
      return {'valid': False, 'masked': sin, 'message': 'SIN must be 9 digits',
              'privacy_warning': 'Ensure SIN collection is legally justified'}
    
    # Luhn algorithm validation
    def luhn_check(card_num):
      def digits_of(n):
        return [int(d) for d in str(n)]
      digits = digits_of(card_num)
      odd_digits = digits[-1::-2]
      even_digits = digits[-2::-2]
      checksum = sum(odd_digits)
      for d in even_digits:
        checksum += sum(digits_of(d*2))
      return checksum % 10 == 0
    
    if not luhn_check(int(digits)):
      return {'valid': False, 'masked': f"XXX-XXX-{digits[-3:]}",
              'message': 'Invalid SIN number',
              'privacy_warning': 'Invalid SIN - verify entry and legal authority to collect'}
    
    # Mask for privacy
    masked = f"XXX-XXX-{digits[-3:]}"
    
    privacy_purposes = {
      'court_filing': 'SIN required for court identification and enforcement',
      'support_calculation': 'SIN required for child/spousal support calculations',
      'enforcement': 'SIN required for support enforcement proceedings'
    }
    
    privacy_warning = privacy_purposes.get(purpose, 'Verify legal authority to collect SIN')
    
    return {'valid': True, 'masked': masked, 'message': 'Valid SIN (masked for privacy)',
            'privacy_warning': privacy_warning}


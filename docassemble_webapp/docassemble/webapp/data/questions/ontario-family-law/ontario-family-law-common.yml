# Court Level Determination
code: |
  def determine_court_level(claim_type, claim_amount=None):
    """
    Determine appropriate court level based on claim type and amount.
    
    Args:
        claim_type (str): Type of claim
        claim_amount (float): Monetary amount if applicable
        
    Returns:
        dict: {'court_level': str, 'explanation': str, 'forms_needed': list}
    """
    superior_claims = [
      'divorce',
      'annulment',
      'property_division_over_35000',
      'complex_custody',
      'adoption',
      'child_protection'
    ]
    
    if claim_type in superior_claims:
      return {
        'court_level': 'Superior Court of Justice',
        'explanation': 'This matter must be filed in Superior Court',
        'forms_needed': ['Form 8', 'Form 8A', 'Form 13.1']
      }
    
    if claim_amount and claim_amount > 35000:
      return {
        'court_level': 'Superior Court of Justice',
        'explanation': 'Claims over $35,000 must be filed in Superior Court',
        'forms_needed': ['Form 8', 'Form 8A', 'Form 13.1']
      }
    
    return {
      'court_level': 'Ontario Court of Justice (Family Court)',
      'explanation': 'This matter can be filed in Family Court',
      'forms_needed': ['Form 8', 'Form 8A']
    }


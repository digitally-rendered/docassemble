# Income Validation
code: |
  def validate_income_amount(amount, income_type='annual'):
    """
    Validates income amounts with reasonable bounds checking.
    
    Args:
        amount: Income amount (numeric or string)
        income_type (str): 'annual', 'monthly', 'weekly', 'hourly'
        
    Returns:
        dict: {'valid': bool, 'amount': Decimal, 'formatted': str, 'message': str}
    """
    try:
      if isinstance(amount, str):
        # Clean currency formatting
        cleaned = re.sub(r'[^\d.-]', '', amount)
        decimal_amount = decimal.Decimal(cleaned)
      else:
        decimal_amount = decimal.Decimal(str(amount))
      
      if decimal_amount < 0:
        return {'valid': False, 'amount': decimal_amount, 
                'formatted': f"${decimal_amount:,.2f}",
                'message': 'Income cannot be negative'}
      
      # Reasonable bounds checking
      bounds = {
        'hourly': {'min': 0, 'max': 200},
        'weekly': {'min': 0, 'max': 8000},
        'monthly': {'min': 0, 'max': 35000},
        'annual': {'min': 0, 'max': 500000}
      }
      
      if income_type in bounds:
        min_val, max_val = bounds[income_type]['min'], bounds[income_type]['max']
        if decimal_amount > max_val:
          return {'valid': False, 'amount': decimal_amount,
                  'formatted': f"${decimal_amount:,.2f}",
                  'message': f'Amount seems unusually high for {income_type} income. Please verify.'}
      
      formatted = f"${decimal_amount:,.2f}"
      return {'valid': True, 'amount': decimal_amount, 'formatted': formatted,
              'message': f'Valid {income_type} income amount'}
      
    except (ValueError, decimal.InvalidOperation) as e:
      return {'valid': False, 'amount': None, 'formatted': str(amount),
              'message': 'Invalid numeric amount'}


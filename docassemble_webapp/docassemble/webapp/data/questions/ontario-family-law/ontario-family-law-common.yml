# Canadian Phone Number Formatting
code: |
  def format_canadian_phone(phone_number):
    """
    Formats and validates Canadian phone numbers.
    
    Args:
        phone_number (str): The phone number to format
        
    Returns:
        dict: {'valid': bool, 'formatted': str, 'message': str}
    """
    if not phone_number:
      return {'valid': False, 'formatted': '', 'message': 'Phone number is required'}
    
    # Extract digits only
    digits = re.sub(r'[^0-9]', '', phone_number)
    
    # Handle different formats
    if len(digits) == 10:
      # 10 digits - assume Canadian
      formatted = f"({digits[:3]}) {digits[3:6]}-{digits[6:]}"
      return {'valid': True, 'formatted': formatted, 'message': 'Valid Canadian phone number'}
    elif len(digits) == 11 and digits[0] == '1':
      # 11 digits starting with 1 - North American with country code
      area_code = digits[1:4]
      formatted = f"+1 ({area_code}) {digits[4:7]}-{digits[7:]}"
      return {'valid': True, 'formatted': formatted, 'message': 'Valid North American phone number'}
    else:
      return {'valid': False, 'formatted': phone_number,
              'message': 'Invalid phone number. Must be 10 digits (Canadian) or 11 digits (with country code)'}


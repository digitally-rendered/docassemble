# VALIDATION FUNCTIONS

# Ontario Postal Code Validation
code: |
  def validate_ontario_postal_code(postal_code):
    """
    Validates Ontario postal code format and verifies it's in Ontario.
    
    Args:
        postal_code (str): The postal code to validate
        
    Returns:
        dict: {'valid': bool, 'formatted': str, 'message': str}
    """
    if not postal_code:
      return {'valid': False, 'formatted': '', 'message': 'Postal code is required'}
    
    # Clean and format
    cleaned = re.sub(r'[^A-Za-z0-9]', '', postal_code.upper())
    
    # Basic format check
    if not re.match(r'^[A-Z]\d[A-Z]\d[A-Z]\d$', cleaned):
      return {'valid': False, 'formatted': postal_code, 
              'message': 'Invalid postal code format. Use format: A1A 1A1'}
    
    # Format with space
    formatted = f"{cleaned[:3]} {cleaned[3:]}"
    
    # Ontario postal code prefixes
    ontario_prefixes = ['K', 'L', 'M', 'N', 'P']
    
    if cleaned[0] not in ontario_prefixes:
      return {'valid': False, 'formatted': formatted,
              'message': 'Postal code must be in Ontario (K, L, M, N, or P prefix)'}
    
    return {'valid': True, 'formatted': formatted, 'message': 'Valid Ontario postal code'}


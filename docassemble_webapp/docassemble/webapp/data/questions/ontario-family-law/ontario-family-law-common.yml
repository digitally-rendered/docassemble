# Court File Number Validation
code: |
  def validate_court_file_number(file_number, court_level='superior'):
    """
    Validates Ontario court file number format.
    
    Args:
        file_number (str): The court file number
        court_level (str): 'superior' or 'provincial'
        
    Returns:
        dict: {'valid': bool, 'formatted': str, 'message': str}
    """
    if not file_number:
      return {'valid': False, 'formatted': '', 'message': 'Court file number is required'}
    
    # Clean input
    cleaned = re.sub(r'[^A-Za-z0-9-]', '', file_number.upper())
    
    if court_level.lower() == 'superior':
      # Superior Court format: FS-YY-NNNNNN-00 or similar
      pattern = r'^[A-Z]{2}-\d{2}-\d{6}-\d{2}$'
      expected_format = 'FS-YY-NNNNNN-00'
    else:
      # Provincial Court format varies by location
      pattern = r'^[A-Z0-9-]{5,20}$'
      expected_format = 'Varies by court location'
    
    if not re.match(pattern, cleaned):
      return {'valid': False, 'formatted': file_number,
              'message': f'Invalid format. Expected: {expected_format}'}
    
    return {'valid': True, 'formatted': cleaned, 'message': 'Valid court file number'}


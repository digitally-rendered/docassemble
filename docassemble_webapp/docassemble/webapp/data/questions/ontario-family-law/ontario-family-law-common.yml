# UTILITY FUNCTIONS

# Age Calculation
code: |
  def calculate_age(birth_date, as_of_date=None):
    """
    Calculate age from birth date.
    
    Args:
        birth_date: Birth date (datetime.date or compatible)
        as_of_date: Date to calculate age as of (defaults to today)
        
    Returns:
        dict: {'years': int, 'months': int, 'days': int, 'age_string': str}
    """
    if as_of_date is None:
      as_of_date = datetime.date.today()
    
    if hasattr(birth_date, 'date'):
      birth_date = birth_date.date()
    
    years = as_of_date.year - birth_date.year
    months = as_of_date.month - birth_date.month
    days = as_of_date.day - birth_date.day
    
    if days < 0:
      months -= 1
      # Get days in previous month
      if as_of_date.month == 1:
        prev_month = datetime.date(as_of_date.year - 1, 12, 1)
      else:
        prev_month = datetime.date(as_of_date.year, as_of_date.month - 1, 1)
      next_month = prev_month.replace(month=prev_month.month + 1) if prev_month.month < 12 else prev_month.replace(year=prev_month.year + 1, month=1)
      days_in_prev_month = (next_month - prev_month).days
      days += days_in_prev_month
    
    if months < 0:
      years -= 1
      months += 12
    
    # Format age string
    if years > 0:
      age_string = f"{years} year{'s' if years != 1 else ''}"
      if months > 0:
        age_string += f", {months} month{'s' if months != 1 else ''}"
    elif months > 0:
      age_string = f"{months} month{'s' if months != 1 else ''}"
      if days > 0:
        age_string += f", {days} day{'s' if days != 1 else ''}"
    else:
      age_string = f"{days} day{'s' if days != 1 else ''}"
    
    return {
      'years': years,
      'months': months,
      'days': days,
      'age_string': age_string
    }


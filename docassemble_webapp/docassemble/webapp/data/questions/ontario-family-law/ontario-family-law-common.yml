# Date Validation Functions
code: |
  def validate_legal_date(date_input, context='general'):
    """
    Validates dates for legal contexts with appropriate rules.
    
    Args:
        date_input: Date to validate (various formats accepted)
        context (str): 'birth_date', 'marriage_date', 'separation_date', 'general'
        
    Returns:
        dict: {'valid': bool, 'date': datetime, 'message': str}
    """
    try:
      if isinstance(date_input, str):
        # Try common formats
        for fmt in ['%Y-%m-%d', '%m/%d/%Y', '%d/%m/%Y', '%B %d, %Y']:
          try:
            parsed_date = datetime.datetime.strptime(date_input, fmt).date()
            break
          except ValueError:
            continue
        else:
          return {'valid': False, 'date': None, 'message': 'Invalid date format'}
      elif hasattr(date_input, 'date'):
        parsed_date = date_input.date()
      else:
        parsed_date = date_input
      
      today = datetime.date.today()
      
      # Context-specific validation
      if context == 'birth_date':
        if parsed_date > today:
          return {'valid': False, 'date': parsed_date, 'message': 'Birth date cannot be in the future'}
        if parsed_date < datetime.date(1900, 1, 1):
          return {'valid': False, 'date': parsed_date, 'message': 'Birth date seems unreasonable'}
      elif context == 'marriage_date':
        if parsed_date > today:
          return {'valid': False, 'date': parsed_date, 'message': 'Marriage date cannot be in the future'}
      elif context == 'separation_date':
        if parsed_date > today:
          return {'valid': False, 'date': parsed_date, 'message': 'Separation date cannot be in the future'}
      
      return {'valid': True, 'date': parsed_date, 'message': 'Valid date'}
      
    except Exception as e:
      return {'valid': False, 'date': None, 'message': f'Date validation error: {str(e)}'}


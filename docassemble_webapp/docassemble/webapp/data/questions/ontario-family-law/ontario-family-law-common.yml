# Filing Fee Calculation
code: |
  def calculate_filing_fees(form_types, party_count=1, financial_hardship=False):
    """
    Calculate Ontario court filing fees.
    
    Args:
        form_types (list): List of forms being filed
        party_count (int): Number of parties
        financial_hardship (bool): Whether requesting fee waiver
        
    Returns:
        dict: {'total_fee': Decimal, 'breakdown': dict, 'waiver_available': bool}
    """
    fee_schedule = {
      'Form 8': decimal.Decimal('202.00'),      # Application (General)
      'Form 8A': decimal.Decimal('202.00'),     # Application (Divorce)
      'Form 14': decimal.Decimal('157.00'),     # Notice of Motion
      'Form 17': decimal.Decimal('202.00'),     # Conference Request
      'Form 34': decimal.Decimal('280.00'),     # Motion to Change
      'Form 37': decimal.Decimal('280.00')      # Notice of Appeal
    }
    
    breakdown = {}
    total = decimal.Decimal('0.00')
    
    for form_type in form_types:
      if form_type in fee_schedule:
        fee = fee_schedule[form_type]
        breakdown[form_type] = fee
        total += fee
    
    # Additional party fees (if applicable)
    if party_count > 2:
      additional_party_fee = decimal.Decimal('50.00') * (party_count - 2)
      breakdown['Additional parties'] = additional_party_fee
      total += additional_party_fee
    
    return {
      'total_fee': total,
      'breakdown': breakdown,
      'waiver_available': financial_hardship,
      'waiver_info': 'Fee waiver available under Rule 24 for financial hardship'
    }


question: |
  ## Your Ontario Family Law Form 8 - Application (General)
  
  <div class="form-section">
  <div class="success-message">
  <div class="section-title">Form Successfully Generated</div>
  Your Form 8 has been generated based on the comprehensive information you provided.
  </div>
  
  **CRITICAL NEXT STEPS:**
  
  1. **Download and Review** - Download the form and review every detail carefully
  2. **Legal Review** - Have a qualified Ontario family lawyer review the form before filing
  3. **Print and Sign** - Print the form and sign the original in blue or black ink
  4. **Gather Supporting Documents** - Collect required certificates, financial documents, etc.
  5. **Serve the Respondent** - Follow Ontario Family Law Rules for proper service
  6. **File with Court** - Submit to the court location you specified with appropriate fees
  7. **Follow Up** - Monitor court deadlines and attend all scheduled appearances
  
  <div class="warning">
  <strong>IMPORTANT LEGAL REMINDER:</strong><br>
  This form is generated based on your input and general Ontario Family Law Rules. 
  It is NOT legal advice. You are responsible for ensuring accuracy and compliance 
  with all court requirements. False statements in court documents may constitute 
  contempt of court or perjury.
  </div>
  
  <div class="legal-disclaimer">
  <strong>LEGAL RESOURCES FOR ASSISTANCE:</strong>
  <ul>
  <li><strong>Law Society of Ontario Referral Service:</strong> 1-855-947-5255</li>
  <li><strong>Legal Aid Ontario:</strong> 1-800-668-8258</li>
  <li><strong>Family Law Information Centres:</strong> Available at Ontario courthouses</li>
  <li><strong>Duty Counsel:</strong> Available at family court on court days</li>
  <li><strong>Pro Bono Ontario:</strong> Free legal advice hotline</li>
  </ul>
  </div>
  </div>

attachment:
  name: Ontario Family Law Form 8 - Application (General)
  filename: Form_8_Application_General_Complete
  docx template file: form-8-template.docx
  fields:
    # Court and case information
    - "court_location": ${ court_location.replace('_', ' ') if court_location != "Other" else other_court_location }
    - "file_number": ${ existing_file_number if case_type == "existing" else "" }
    - "case_type": ${ case_type }
    
    # Applicant information
    - "applicant_name": ${ applicant.name }
    - "applicant_address": ${ applicant.address.block() }
    - "applicant_phone": ${ applicant_phone }
    - "applicant_phone_secondary": ${ applicant_phone_secondary if defined('applicant_phone_secondary') else "" }
    - "applicant_email": ${ applicant_email if defined('applicant_email') else "" }
    - "applicant_birthdate": ${ applicant_birthdate.format('yyyy-MM-dd') }
    - "applicant_language": ${ applicant_language if defined('applicant_language') else "English" }
    - "applicant_has_lawyer": ${ "Yes" if applicant_has_lawyer else "No" }
    - "applicant_lawyer_name": ${ applicant_lawyer_name if applicant_has_lawyer and defined('applicant_lawyer_name') else "" }
    - "applicant_lawyer_firm": ${ applicant_lawyer_firm if applicant_has_lawyer and defined('applicant_lawyer_firm') else "" }
    - "applicant_lawyer_address": ${ applicant_lawyer_address if applicant_has_lawyer and defined('applicant_lawyer_address') else "" }
    - "applicant_lawyer_phone": ${ applicant_lawyer_phone if applicant_has_lawyer and defined('applicant_lawyer_phone') else "" }
    
    # Respondent information
    - "respondent_name": ${ respondent.name }
    - "respondent_aka": ${ respondent_aka if defined('respondent_aka') else "" }
    - "respondent_address": ${ respondent.address.block() }
    - "respondent_phone": ${ respondent_phone if defined('respondent_phone') else "" }
    - "respondent_email": ${ respondent_email if defined('respondent_email') else "" }
    - "respondent_birthdate": ${ respondent_birthdate.format('yyyy-MM-dd') if defined('respondent_birthdate') and respondent_birthdate else "" }
    - "respondent_employer": ${ respondent_employer if defined('respondent_employer') else "" }
    
    # Relationship information
    - "relationship_type": ${ relationship_type.replace('_', ' ').title() if defined('relationship_type') else "" }
    - "marriage_date": ${ marriage_date.format('yyyy-MM-dd') if relationship_type == "married" and defined('marriage_date') else "" }
    - "marriage_place": ${ marriage_place if relationship_type == "married" and defined('marriage_place') else "" }
    - "relationship_start_date": ${ relationship_start_date.format('yyyy-MM-dd') if defined('relationship_start_date') else "" }
    - "cohabitation_start_date": ${ cohabitation_start_date.format('yyyy-MM-dd') if defined('cohabitation_start_date') else "" }
    - "separation_date": ${ separation_date.format('yyyy-MM-dd') if defined('separation_date') and separation_date else "" }
    - "currently_separated": ${ "Yes" if defined('currently_separated') and currently_separated else "No" }
    
    # Children information
    - "has_children": ${ "Yes" if has_children else "No" }
    - "number_of_children": ${ children.number() if has_children else "0" }
    - "children_details": |
      % if has_children:
        % for child in children:
        Child ${ loop.index }: ${ child.name }
        Date of Birth: ${ child.birthdate.format('yyyy-MM-dd') }
        Current Residence: ${ child.current_residence.replace('_', ' ').title() }
        Relationship to Applicant: ${ child.relationship_to_applicant.title() if defined('child.relationship_to_applicant') else "" }
        Relationship to Respondent: ${ child.relationship_to_respondent.title() if defined('child.relationship_to_respondent') else "" }
        Special Needs: ${ "Yes - " + child.special_needs_description if child.has_special_needs else "No" }
        
        % endfor
      % else:
        No children
      % endif
    
    # Claims for relief
    - "claims_summary": |
      % for k, v in claims_for_relief.items():
        % if v:
      - ${ k.replace('_', ' ').title() }
        % endif
      % endfor
      % if claims_for_relief.get('other_claim', False):
      Other: ${ other_claim_details }
      % endif
    
    # Specific claim details
    - "divorce_grounds": ${ divorce_grounds.replace('_', ' ').title() if defined('divorce_grounds') else "" }
    - "child_support_details": |
      % if claims_for_relief.get('child_support', False):
      Payor: ${ child_support_payor.replace('_', ' ').title() if defined('child_support_payor') else "" }
      Amount: ${ child_support_amount if defined('child_support_amount') and child_support_amount else "To be determined by court" }
      Start Date: ${ child_support_start_date.format('yyyy-MM-dd') if defined('child_support_start_date') else "" }
      Retroactive: ${ "Yes from " + retroactive_support_start_date.format('yyyy-MM-dd') if defined('retroactive_child_support') and retroactive_child_support else "No" }
      Special Expenses: ${ special_expenses_details if defined('special_expenses') and special_expenses else "None" }
      % endif
    
    - "spousal_support_details": |
      % if claims_for_relief.get('spousal_support', False):
      Payor: ${ spousal_support_payor.replace('_', ' ').title() if defined('spousal_support_payor') else "" }
      Amount: ${ spousal_support_amount if defined('spousal_support_amount') and spousal_support_amount else "To be determined by court" }
      Start Date: ${ spousal_support_start_date.format('yyyy-MM-dd') if defined('spousal_support_start_date') else "" }
      Duration: ${ spousal_support_duration.replace('_', ' ').title() if defined('spousal_support_duration') else "" }
      Reasons: ${ spousal_support_reasons if defined('spousal_support_reasons') else "" }
      % endif
    
    - "custody_details": ${ custody_details if defined('custody_details') else "" }
    - "parenting_schedule": ${ parenting_schedule if defined('parenting_schedule') else "" }
    - "property_division_details": ${ property_description if defined('property_description') else "" }
    
    # Service information
    - "service_method": ${ service_method.replace('_', ' ').title() if defined('service_method') else "" }
    - "service_details": |
      % if defined('service_method'):
        % if service_method == "personal_service":
      Server: ${ server_name if defined('server_name') else "" }
      Server Phone: ${ server_phone if defined('server_phone') else "" }
        % elif service_method == "email_service":
      Email: ${ service_email if defined('service_email') else "" }
        % elif service_method == "alternative_service":
      Alternative Method: ${ alternative_method_details if defined('alternative_method_details') else "" }
      Reasons: ${ service_difficulty_reasons if defined('service_difficulty_reasons') else "" }
        % endif
      % endif
    
    # Previous orders
    - "previous_orders_summary": |
      % if has_previous_orders:
        % for order in previous_orders:
        ${ order['document_type'].replace('_', ' ').title() } dated ${ order['document_date'].format('yyyy-MM-dd') }
        Covers: ${ ', '.join(order['document_scope']) if 'document_scope' in order else "" }
        Key Terms: ${ order['key_terms'] if 'key_terms' in order else "" }
        Still Effective: ${ "Yes" if order.get('still_effective', False) else "No" }
        Want to Change: ${ "Yes" if order.get('want_to_change', False) else "No" }
        
        % endfor
      % else:
        No previous orders or agreements
      % endif
    
    # Additional information
    - "attended_mip": ${ "Yes on " + mip_date.format('yyyy-MM-dd') if defined('attended_mip') and attended_mip else "No" }
    - "additional_information": ${ additional_information if defined('additional_information') else "" }
    - "urgent_issues": ${ urgent_issues_description if defined('urgent_issues') and urgent_issues else "None" }
    
    # Form completion details
    - "form_date": ${ today().format('yyyy-MM-dd') }
    - "form_time": ${ current_datetime().format('HH:mm') }

show if: form_ready

buttons:
  - "Download Form": continue
  - "Print Form": continue
  - "Start New Form": restart
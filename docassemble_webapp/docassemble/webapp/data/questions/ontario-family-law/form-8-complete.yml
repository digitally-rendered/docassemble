  ## Service of Documents
  
  <div class="form-section">
  <div class="section-title">How Will You Serve the Respondent?</div>
  How will you serve (legally deliver) a copy of this application and other court documents 
  on the respondent? This is a legal requirement under the Ontario Family Law Rules.
  </div>
  
field: service_method
choices:
  - "Personal service (hand delivery by adult)": personal_service
  - "Service by registered mail": registered_mail  
  - "Service by courier": courier_service
  - "Service through respondent's lawyer": lawyer_service
  - "Service by email (if respondent consents)": email_service
  - "Service by fax (if respondent consents)": fax_service
  - "Respondent will accept service": accept_service
  - "Alternative service method (requires court order)": alternative_service
  - "Substituted service (requires court order)": substituted_service

help: |
  **Personal service** is the preferred method and involves having an adult (not you) 
  hand-deliver the documents directly to the respondent.
  
  **Service by mail** requires registered mail or courier with proof of delivery.
  
  **Alternative methods** require special court orders and are used when regular 
  service is not possible.


question: |
  ## Final Review and Confirmation
  
  <div class="form-section">
  <div class="section-title">Review Your Information</div>
  Please carefully review all the information you have provided before generating your Form 8.
  
  **Case Type:** ${ case_type.title() } case
  
  **Court:** ${ court_location.replace('_', ' ') if court_location != "Other" else other_court_location }
  
  **Applicant:** ${ applicant.name }
  
  **Respondent:** ${ respondent.name }
  
  **Claims for Relief:** 
  % for k, v in claims_for_relief.items():
    % if v:
  - ${ k.replace('_', ' ').title() }
    % endif
  % endfor
  
  % if has_children:
  **Children:** ${ children.number() } child(ren)
  % endif
  
  **Service Method:** ${ service_method.replace('_', ' ').title() }
  
  <div class="warning">
  <strong>Important Final Reminders:</strong>
  <ul>
  <li><strong>Review everything carefully</strong> - ensure all information is accurate and complete</li>
  <li><strong>You must serve the respondent</strong> with a copy of this application within prescribed time limits</li>
  <li><strong>File within time limits</strong> - you have limited time to serve and file your documents</li>  
  <li><strong>Consult a lawyer</strong> - have a qualified Ontario family lawyer review this before filing</li>
  <li><strong>Sign the original</strong> - you must sign the paper copy before filing with the court</li>
  <li><strong>Bring required documents</strong> - birth certificates, marriage certificate, etc.</li>
  <li><strong>Pay filing fees</strong> - court filing fees are required unless you qualify for fee waiver</li>
  </ul>
  </div>
  </div>
  

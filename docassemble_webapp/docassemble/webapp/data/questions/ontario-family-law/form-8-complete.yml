---
objects:
  - applicant: Individual
  - respondent: Individual
  - children: DAList.using(object_type=Individual, there_are_any=True)
  - claims_dict: DADict
  - service_info: DADict
  - previous_orders: DAList.using(object_type=DADict, there_are_any=True)

---
# Main mandatory interview flow
mandatory: True
code: |
  # Step 1: Legal disclaimer and notice
  disclaimer_accepted
  
  # Step 2: Case type determination  
  case_type
  
  # Step 3: Court information
  court_location
  if case_type == "existing":
    existing_file_number
  
  # Step 4: Complete applicant information
  applicant_info_complete
  
  # Step 5: Complete respondent information  
  respondent_info_complete
  
  # Step 6: Relationship information
  relationship_complete
  
  # Step 7: Children information
  children_complete
  
  # Step 8: Claims for relief
  claims_complete
  
  # Step 9: Service information
  service_complete
  
  # Step 10: Previous orders
  orders_complete
  
  # Step 11: Final review and form generation
  form_ready = True

---
question: |
  ## Legal Disclaimer and Important Notice
  
  <div class="legal-disclaimer">
  <div class="section-title">IMPORTANT LEGAL DISCLAIMER</div>
  
  This form generation tool is provided for informational purposes only and does not constitute legal advice. 
  Completing this form does not create a lawyer-client relationship. The information you provide 
  will be used to generate a draft Ontario Family Law Form 8 - Application (General) based on 
  the Ontario Family Law Rules.
  
  <br><br><strong>You should:</strong>
  <ul>
  <li><strong>Consult with a qualified Ontario family lawyer</strong> before filing any court documents</li>
  <li><strong>Review all generated documents carefully</strong> for accuracy and completeness</li>
  <li><strong>Understand that court forms and procedures can be complex</strong></li>
  <li><strong>Know that errors in court documents can have serious legal consequences</strong></li>
  <li><strong>Ensure all information is accurate</strong> as false statements may constitute contempt of court</li>
  </ul>
  
  <br><strong>Privacy Notice:</strong> Information you provide will be processed temporarily to generate 
  your form. Do not include information you do not want processed by this system.
  
  <br><strong>Legal Resources:</strong>
  <ul>
  <li>Law Society of Ontario Referral Service: 1-855-947-5255</li>
  <li>Legal Aid Ontario: 1-800-668-8258</li>
  <li>Family Law Information Centres at Ontario courthouses</li>
  </ul>
  
  <br><br>By continuing, you acknowledge that you understand this disclaimer and that you are 
  responsible for reviewing any generated documents with a qualified legal professional.
  </div>
  
field: disclaimer_accepted
buttons:
  - "I understand and wish to continue": True
  - "Exit": False
    
---
code: |
  if not disclaimer_accepted:
    command('exit')

---
question: |
  ## Case Type Determination
  
  <div class="form-section">
  <div class="section-title">New Case or Existing Case?</div>
  Are you starting a completely new family law case, or do you already have an existing case 
  with a court file number assigned?
  </div>
  
field: case_type
choices:
  - "Starting a new case": new
  - "Adding to an existing case": existing
  
help: |
  **Choose "Starting a new case" if:**
  - This is the first application you are filing for this family law matter
  - No court file number has been assigned yet
  - You have never filed any documents with the court for this matter
  
  **Choose "Adding to an existing case" if:**
  - There is already a court file number assigned to your family law matter
  - Previous applications, motions, or orders have been filed
  - You are adding new claims to an existing court file

---
question: |
  ## Court Location Selection
  
  <div class="form-section">
  <div class="section-title">Court Filing Location</div>
  Which Ontario court location will you be filing this application with?
  </div>
  
fields:
  - Court Location: court_location
    choices:
      # Ontario Court of Justice locations
      - "Ontario Court of Justice - Barrie": OCJ_Barrie
      - "Ontario Court of Justice - Brampton": OCJ_Brampton  
      - "Ontario Court of Justice - Brockville": OCJ_Brockville
      - "Ontario Court of Justice - Chatham": OCJ_Chatham
      - "Ontario Court of Justice - Cornwall": OCJ_Cornwall
      - "Ontario Court of Justice - Hamilton": OCJ_Hamilton
      - "Ontario Court of Justice - Kingston": OCJ_Kingston
      - "Ontario Court of Justice - Kitchener": OCJ_Kitchener
      - "Ontario Court of Justice - London": OCJ_London
      - "Ontario Court of Justice - Newmarket": OCJ_Newmarket
      - "Ontario Court of Justice - Oshawa": OCJ_Oshawa
      - "Ontario Court of Justice - Ottawa": OCJ_Ottawa
      - "Ontario Court of Justice - Peterborough": OCJ_Peterborough
      - "Ontario Court of Justice - Sarnia": OCJ_Sarnia
      - "Ontario Court of Justice - Sault Ste. Marie": OCJ_SSM
      - "Ontario Court of Justice - St. Catharines": OCJ_StCatharines
      - "Ontario Court of Justice - Sudbury": OCJ_Sudbury
      - "Ontario Court of Justice - Thunder Bay": OCJ_ThunderBay
      - "Ontario Court of Justice - Timmins": OCJ_Timmins
      - "Ontario Court of Justice - Toronto": OCJ_Toronto
      - "Ontario Court of Justice - Windsor": OCJ_Windsor
      # Superior Court of Justice locations
      - "Superior Court of Justice - Toronto": SCJ_Toronto
      - "Superior Court of Justice - Ottawa": SCJ_Ottawa
      - "Superior Court of Justice - Hamilton": SCJ_Hamilton
      - "Superior Court of Justice - London": SCJ_London
      - "Superior Court of Justice - Kingston": SCJ_Kingston
      - "Superior Court of Justice - Kitchener": SCJ_Kitchener
      - "Superior Court of Justice - Windsor": SCJ_Windsor
      - "Superior Court of Justice - Sudbury": SCJ_Sudbury
      - "Superior Court of Justice - Thunder Bay": SCJ_ThunderBay
      - "Other (specify below)": Other
      
  - Specify other court location: other_court_location
    show if:
      variable: court_location
      is: Other
      
help: |
  **Choose the court location where you intend to file this application.**
  
  This should typically be:
  - Where you currently live
  - Where your spouse/partner lives  
  - Where you lived together as a family
  - Where the children live
  
  **Ontario Court of Justice** handles most family law matters including custody, access, 
  child support, and spousal support.
  
  **Superior Court of Justice** handles divorce, property division, and more complex family matters.

---
question: |
  ## Existing Case File Number
  
  <div class="form-section">
  <div class="section-title">Court File Information</div>
  What is the existing court file number for your family law case?
  </div>
  
fields:
  - "Court File Number": existing_file_number
    required: True
    validate: |
      lambda x: len(x.strip()) >= 5 if x else False
    validation message: "Please enter a valid court file number"
    help: |
      Enter the complete court file number as it appears on previous court documents 
      (e.g., FS-24-123456, FC-23-987654, or similar format)

show if: case_type == "existing"

---
code: |
  applicant_info_complete = True

---
question: |
  ## Your Information - Full Name
  
  <div class="form-section">
  <div class="section-title">Applicant Information</div>
  Please provide your complete legal name exactly as it appears on official government-issued identification.
  </div>
  
fields:
  - "First Name": applicant.name.first
    required: True
  - "Middle Name(s)": applicant.name.middle
    required: False
    help: "Include all middle names if you have them"
  - "Last Name": applicant.name.last  
    required: True
  - "Suffix (Jr., Sr., III, etc.)": applicant.name.suffix
    required: False

---
question: |
  ## Your Address Information
  
  <div class="form-section">
  <div class="section-title">Current Residential Address</div>
  Please provide your current home address where you can receive court documents.
  </div>
  
fields:
  - "Street Number and Name": applicant.address.address
    required: True
    help: "Include apartment or unit number if applicable"
  - "Unit/Apartment Number": applicant.address.unit
    required: False
  - "City": applicant.address.city
    required: True
  - "Province": applicant.address.state
    default: "Ontario"
    required: True
  - "Postal Code": applicant.address.zip
    required: True
    help: "Format: A1A 1A1 (letter-number-letter space number-letter-number)"

---
question: |
  ## Your Contact Information
  
  <div class="form-section">
  <div class="section-title">Contact Details</div>
  Please provide your contact information for court correspondence and scheduling.
  </div>
  
fields:
  - "Primary Phone Number": applicant_phone
    required: True
    help: "Format: (416) 555-1234 or 416-555-1234"
  - "Secondary Phone Number": applicant_phone_secondary
    required: False
    help: "Optional - cell phone, work phone, etc."
  - "Email Address": applicant_email
    datatype: email
    required: False
    help: "The court may send notices by email if provided and you consent"
  - "Date of Birth": applicant_birthdate
    datatype: date
    required: True
    help: "Required for court records and identification"
  - "Preferred Language for Court Proceedings": applicant_language
    choices:
      - English
      - French
      - Other (specify below)
    default: English
  - "Specify other language": applicant_other_language
    show if:
      variable: applicant_language
      is: Other (specify below)

---
question: |
  ## Legal Representation
  
  <div class="form-section">
  <div class="section-title">Lawyer Information</div>
  Do you have a lawyer representing you in this family law matter?
  </div>
  
yesno: applicant_has_lawyer

---
question: |
  ## Your Lawyer's Information
  
  <div class="form-section">
  <div class="section-title">Legal Counsel Details</div>
  Please provide complete information about your lawyer.
  </div>
  
fields:
  - "Lawyer's Full Name": applicant_lawyer_name
    required: True
  - "Law Firm Name": applicant_lawyer_firm
    required: False
    help: "If applicable"
  - "Law Society of Ontario Number": applicant_lawyer_lso
    required: False
    help: "If known"
  - "Street Address": applicant_lawyer_address
    required: True
  - "City": applicant_lawyer_city
    required: True
  - "Province": applicant_lawyer_province
    default: "Ontario"
    required: True
  - "Postal Code": applicant_lawyer_postal
    required: True
  - "Phone Number": applicant_lawyer_phone
    required: True
  - "Fax Number": applicant_lawyer_fax
    required: False
  - "Email Address": applicant_lawyer_email
    datatype: email
    required: False

show if: applicant_has_lawyer

---
code: |
  respondent_info_complete = True

---
question: |
  ## Other Party Information - Full Name
  
  <div class="form-section">
  <div class="section-title">Respondent Information</div>
  Please provide the complete legal name of the other party (respondent) as it appears 
  on official identification or as you know them legally.
  </div>
  
fields:
  - "First Name": respondent.name.first
    required: True
  - "Middle Name(s)": respondent.name.middle
    required: False
  - "Last Name": respondent.name.last
    required: True  
  - "Suffix (Jr., Sr., III, etc.)": respondent.name.suffix
    required: False
  - "Also known as (other names used)": respondent_aka
    required: False
    help: "Include maiden names, nicknames, or other names commonly used"

---
question: |
  ## Other Party Address Information
  
  <div class="form-section">
  <div class="section-title">Respondent's Current Address</div>
  Please provide the current residential address of the respondent (other party).
  This is where court documents will be served.
  </div>
  
fields:
  - "Street Number and Name": respondent.address.address
    required: True
  - "Unit/Apartment Number": respondent.address.unit
    required: False
  - "City": respondent.address.city
    required: True
  - "Province/State": respondent.address.state
    default: "Ontario"
    required: True
  - "Postal Code/ZIP Code": respondent.address.zip
    required: True
    help: "Canadian postal code (A1A 1A1) or US ZIP code if applicable"
  - "Country": respondent_country
    default: "Canada"
    required: True

---
question: |
  ## Other Party Contact Information
  
  <div class="form-section">
  <div class="section-title">Respondent's Contact Details</div>
  Please provide the respondent's contact information if known.
  </div>
  
fields:
  - "Phone Number": respondent_phone
    required: False
    help: "Leave blank if unknown"
  - "Secondary Phone Number": respondent_phone_secondary
    required: False
    help: "Work phone, cell phone, etc."
  - "Email Address": respondent_email
    datatype: email
    required: False
    help: "Leave blank if unknown"
  - "Date of Birth": respondent_birthdate
    datatype: date
    required: False
    help: "If known - helps with identification for court records"
  - "Employer (if known)": respondent_employer
    required: False
  - "Workplace Address (if known)": respondent_work_address
    required: False

---
question: |
  ## Respondent's Legal Representation
  
  <div class="form-section">
  <div class="section-title">Other Party's Lawyer</div>
  Does the respondent have a lawyer representing them in this matter?
  </div>
  
field: respondent_has_lawyer
choices:
  - "Yes": True
  - "No": False
  - "Unknown": unknown

---
question: |
  ## Respondent's Lawyer Information
  
  <div class="form-section">
  <div class="section-title">Other Party's Legal Counsel</div>
  Please provide information about the respondent's lawyer if known.
  </div>
  
fields:
  - "Lawyer's Name": respondent_lawyer_name
    required: False
  - "Law Firm": respondent_lawyer_firm
    required: False
  - "Address": respondent_lawyer_address
    required: False
  - "Phone": respondent_lawyer_phone
    required: False
  - "Email": respondent_lawyer_email
    datatype: email
    required: False

show if: respondent_has_lawyer == True

---
code: |
  relationship_complete = True

---
question: |
  ## Relationship Information
  
  <div class="form-section">
  <div class="section-title">Your Relationship with the Other Party</div>
  Please provide detailed information about your relationship with the respondent.
  </div>
  
fields:
  - "Type of Relationship": relationship_type
    choices:
      - "Married": married
      - "Common-law partners (lived together)": common_law
      - "Dating relationship with child(ren)": dating_with_children
      - "Never married or lived together": never_married
    required: True
    
  - "Date of Marriage": marriage_date
    datatype: date
    required: True
    show if:
      variable: relationship_type
      is: married
      
  - "Place of Marriage": marriage_place
    required: True
    show if:
      variable: relationship_type
      is: married
    help: "City, Province/State, Country"
      
  - "Date relationship began": relationship_start_date
    datatype: date
    required: True
    show if:
      variable: relationship_type
      is: common_law or dating_with_children
    help: "When did you first start living together or dating?"
      
  - "Date you began living together": cohabitation_start_date
    datatype: date
    required: True
    show if:
      variable: relationship_type
      is: common_law
      
  - "Are you currently separated?": currently_separated
    yesno:
    show if:
      variable: relationship_type
      is: married or common_law
      
  - "Date of Separation": separation_date
    datatype: date
    required: True
    show if: 
      code: |
        (relationship_type in ["married", "common_law"] and currently_separated) or relationship_type == "dating_with_children"
    help: "Date you began living separate and apart with intention to separate"

---
code: |
  children_complete = True

---
question: |
  ## Children Information
  
  <div class="form-section">
  <div class="section-title">Children of the Relationship</div>
  Do you and the respondent have any children together (biological, adopted, or step-children) 
  who are under 18 years old OR over 18 but still dependent on you for support?
  </div>
  
yesno: has_children

---
question: |
  ## Child Details - ${ ordinal(i) } Child
  
  <div class="form-section">
  <div class="section-title">Information About Your Children</div>
  Please provide complete information about each child.
  
  You have told me about ${ children.number_as_word() } 
  ${ children.as_noun() } so far.
  </div>
  
fields:
  - "Child's First Name": children[i].name.first
    required: True
  - "Child's Middle Name(s)": children[i].name.middle
    required: False
  - "Child's Last Name": children[i].name.last
    required: True
  - "Date of Birth": children[i].birthdate
    datatype: date
    required: True
  - "Relationship to you": children[i].relationship_to_applicant
    choices:
      - "Biological child": biological
      - "Adopted child": adopted
      - "Step-child": step
      - "Other": other
  - "Relationship to respondent": children[i].relationship_to_respondent
    choices:
      - "Biological child": biological
      - "Adopted child": adopted
      - "Step-child": step
      - "Other": other
  - "Where does this child currently live?": children[i].current_residence
    choices:
      - "With me (the applicant)": with_applicant
      - "With the respondent": with_respondent
      - "Shared between us": shared
      - "With a relative": with_relative
      - "In care of Children's Aid Society": with_cas
      - "Other arrangement": other
  - "Specify living arrangement": children[i].living_arrangement_details
    show if:
      variable: children[i].current_residence
      is: with_relative or other
  - "Does this child have any special needs?": children[i].has_special_needs
    yesno:
  - "Describe special needs": children[i].special_needs_description
    datatype: area
    show if: children[i].has_special_needs

show if: has_children

---
question: |
  Are there any other children you need to tell me about?
  
yesno: children.there_is_another

show if: has_children

---
code: |
  claims_complete = True

---
question: |
  ## Claims for Relief - What Orders Are You Seeking?
  
  <div class="form-section">
  <div class="section-title">Court Orders Requested</div>
  Please select ALL the orders you are asking the court to make. You can select multiple options.
  These are your "claims for relief."
  </div>
  
fields:
  - "What orders are you seeking?": claims_for_relief
    datatype: checkboxes
    choices:
      - "Divorce": divorce
      - "Sole custody of child(ren)": sole_custody
      - "Joint custody of child(ren)": joint_custody  
      - "Access/Parenting time with child(ren)": access_parenting
      - "Child support": child_support
      - "Spousal support": spousal_support
      - "Division of property": property_division
      - "Exclusive possession of matrimonial home": exclusive_possession
      - "Sale of matrimonial home": sale_matrimonial_home
      - "Restraining order": restraining_order
      - "Non-harassment order": non_harassment
      - "Order for disclosure of financial information": financial_disclosure
      - "Costs (legal fees)": costs
      - "Other": other_claim
    none of the above: False
    
  - "Describe other claim(s)": other_claim_details
    datatype: area
    required: True
    show if:
      code: |
        claims_for_relief.get('other_claim', False)

---
question: |
  ## Divorce Details
  
  <div class="form-section">
  <div class="section-title">Divorce Information</div>
  Please provide details about the divorce you are requesting.
  </div>
  
fields:
  - "Grounds for divorce": divorce_grounds
    choices:
      - "Separation for one year or more": separation_one_year
      - "Adultery": adultery
      - "Physical or mental cruelty": cruelty
    required: True
  - "Details of adultery": adultery_details
    datatype: area
    show if:
      variable: divorce_grounds
      is: adultery
  - "Details of cruelty": cruelty_details
    datatype: area
    show if:
      variable: divorce_grounds
      is: cruelty
  - "Is there any possibility of reconciliation?": reconciliation_possible
    yesno:
  - "Have you taken any steps toward reconciliation?": reconciliation_steps
    yesno:
  - "Details of reconciliation attempts": reconciliation_details
    datatype: area
    show if: reconciliation_steps

show if: claims_for_relief.get('divorce', False)

---
question: |
  ## Child Support Details
  
  <div class="form-section">
  <div class="section-title">Child Support Request</div>
  Please provide specific details about the child support you are requesting.
  </div>
  
fields:
  - "Who should pay child support?": child_support_payor
    choices:
      - "The respondent should pay me": respondent_pays
      - "I should pay the respondent": applicant_pays
      - "We should both pay (shared custody)": both_pay
  - "Monthly child support amount requested": child_support_amount
    datatype: currency
    required: False
    help: "Leave blank if you want the court to determine based on income and guidelines"
  - "Effective date for child support": child_support_start_date
    datatype: date
    required: True
    help: "When should support payments begin?"
  - "Are you requesting retroactive child support?": retroactive_child_support
    yesno:
  - "Retroactive support start date": retroactive_support_start_date
    datatype: date
    show if: retroactive_child_support
  - "Special or extraordinary expenses": special_expenses
    yesno:
    help: "Daycare, medical, educational, extracurricular costs not covered by basic support"
  - "Details of special expenses": special_expenses_details
    datatype: area
    show if: special_expenses

show if: claims_for_relief.get('child_support', False)

---
question: |
  ## Custody Details
  
  <div class="form-section">
  <div class="section-title">Custody Arrangement Requested</div>
  Please provide details about custody arrangements.
  </div>
  
fields:
  - "Proposed custody arrangement": custody_details
    datatype: area
    required: True
    help: "Describe the custody arrangement you want the court to order"
  - "Reasons supporting your custody request": custody_reasons
    datatype: area
    required: True
    help: "Explain why this custody arrangement is in the children's best interests"

show if: claims_for_relief.get('sole_custody', False) or claims_for_relief.get('joint_custody', False)

---
question: |
  ## Access and Parenting Time Details
  
  <div class="form-section">
  <div class="section-title">Parenting Time Schedule</div>
  Please describe the access/parenting time arrangement you are requesting.
  </div>
  
fields:
  - "Proposed parenting schedule": parenting_schedule
    datatype: area
    required: True
    help: "Include weekends, weekdays, holidays, vacation time, etc."
  - "Pick-up and drop-off arrangements": pickup_dropoff
    datatype: area
    required: False
  - "Any supervision requirements?": supervised_access
    yesno:
  - "Details about supervision": supervision_details
    datatype: area
    show if: supervised_access

show if: claims_for_relief.get('access_parenting', False)

---
question: |
  ## Spousal Support Details
  
  <div class="form-section">
  <div class="section-title">Spousal Support Request</div>
  Please provide details about spousal support.
  </div>
  
fields:
  - "Who should pay spousal support?": spousal_support_payor
    choices:
      - "The respondent should pay me": respondent_pays_spousal
      - "I should pay the respondent": applicant_pays_spousal
  - "Monthly spousal support amount requested": spousal_support_amount
    datatype: currency
    required: False
    help: "Leave blank if you want the court to determine the amount"
  - "Effective date for spousal support": spousal_support_start_date
    datatype: date
    required: True
  - "Duration of spousal support": spousal_support_duration
    choices:
      - "Indefinite": indefinite
      - "For a specific time period": specific_period
      - "Until a specific event occurs": specific_event
  - "Specify time period": spousal_support_time_period
    show if:
      variable: spousal_support_duration

---
metadata:
  title: Ontario Family Law Form 8 - Application (General) - Extended
  short title: Form 8 - Extended Application
---
objects:
  - applicant: Individual
  - respondent: Individual
  - claims_selection: DADict
---
# Main interview flow
mandatory: True
code: |
  intro_screen
  case_type_determination
  applicant.name.first
  applicant.name.last
  applicant.address.address
  respondent.name.first
  respondent.name.last
  respondent.address.address
  court_location
  claims_selection
  final_screen
---
question: |
  Ontario Family Law Form 8 - Application (General)
subquestion: |
  This form is used to start family court proceedings in Ontario.
  
  **Important Legal Disclaimer:** This system provides legal information, not legal advice. 
  You should consult with a lawyer or contact Legal Aid Ontario for legal advice.
field: intro_screen
---
question: |
  Case Type
subquestion: |
  Is this a new case or are you adding to an existing case?
field: case_type_determination
choices:
  - New case: new
  - Existing case: existing
---
question: |
  Your Name and Address
subquestion: |
  Please enter your complete information:
fields:
  - First Name: applicant.name.first
  - Last Name: applicant.name.last
  - Street Address: applicant.address.address
  - City: applicant.address.city
  - Province: applicant.address.state
    default: Ontario
  - Postal Code: applicant.address.zip
---
question: |
  Other Party's Name and Address
subquestion: |
  Please enter the respondent's information:
fields:
  - First Name: respondent.name.first
  - Last Name: respondent.name.last
  - Street Address: respondent.address.address
  - City: respondent.address.city
  - Province: respondent.address.state
    default: Ontario
  - Postal Code: respondent.address.zip
---
question: |
  Court Information
subquestion: |
  Please select where you want to file your application:
field: court_location
choices:
  - Toronto: toronto
  - Ottawa: ottawa
  - Hamilton: hamilton
  - London: london
  - Windsor: windsor
  - Thunder Bay: thunder_bay
  - Sudbury: sudbury
  - Kingston: kingston
---
question: |
  What orders are you asking the court to make?
subquestion: |
  Select all that apply:
field: claims_selection
datatype: checkboxes
choices:
  - Divorce: divorce
  - Custody of children: custody
  - Access to children: access
  - Child support: child_support
  - Spousal support: spousal_support
  - Property division: property
  - Exclusive possession of home: possession
  - Restraining order: restraining
validation code: |
  if not any(claims_selection.values()):
    validation_error("You must select at least one type of order.")
---
mandatory: True
question: |
  Your Application Summary
subquestion: |
  **Case Type:** ${ case_type_determination }
  
  **Applicant:** ${ applicant.name.first } ${ applicant.name.last }
  **Address:** ${ applicant.address.address }, ${ applicant.address.city }, ${ applicant.address.state } ${ applicant.address.zip }
  
  **Respondent:** ${ respondent.name.first } ${ respondent.name.last }
  **Address:** ${ respondent.address.address }, ${ respondent.address.city }, ${ respondent.address.state } ${ respondent.address.zip }
  
  **Court:** ${ court_location.title() } Superior Court of Justice
  
  **Orders Requested:**
  % if claims_selection:
  % for claim in claims_selection:
  % if claims_selection[claim]:
  * ${ claim.title().replace('_', ' ') }
  % endif
  % endfor
  % endif
  
  **Next Steps:**
  1. Complete additional required forms based on your claims
  2. File this application at the court
  3. Serve the respondent with the documents
  
  **Get Legal Help:**
  - [Legal Aid Ontario](https://www.legalaid.on.ca/)
  - [Law Society of Ontario](https://lso.ca/public-resources/finding-a-lawyer-or-paralegal)

buttons:
  - Restart: restart
  - Exit: exit
field: final_screen
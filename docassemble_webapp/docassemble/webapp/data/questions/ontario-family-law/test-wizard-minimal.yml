---
mandatory: True
code: |
  wizard_introduction
  emergency_situation
  if not emergency_situation:
    relationship_status
  show_final
---
question: |
  Welcome to the Ontario Family Law Forms Wizard
continue button field: wizard_introduction
---
question: |
  Is this an emergency situation?
field: emergency_situation
buttons:
  - "Yes": True
  - "No": False
---
question: |
  What is your relationship status?
field: relationship_status
buttons:
  - "Married": married
  - "Common-law": common_law
  - "Never lived together": never_together
---
event: show_final
question: |
  Test Complete
subquestion: |
  The minimal wizard works!
  
  - Emergency: ${ emergency_situation }
  - Relationship: ${ relationship_status if not emergency_situation else "N/A" }
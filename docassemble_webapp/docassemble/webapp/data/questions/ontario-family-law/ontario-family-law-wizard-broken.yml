# Divorce complexity
question: |
  Is your divorce contested or uncontested?
subquestion: |
  **Uncontested means:**
  - Both parties agree to the divorce
  - You agree on all issues (or have no issues to resolve)
  - No disputes about children, support, or property
  
  **Contested means:**
  - Your spouse doesn't agree to divorce, OR
  - You disagree on custody, support, or property
field: divorce_complexity
buttons:
  - "Uncontested - we agree on everything": uncontested_simple
  - "Contested - we have disagreements": contested
---
# Children for simple divorce
question: |
  Do you have children together?
subquestion: |
  Include all children under 18, or adult children who are dependent due to disability or education.
field: children_involved_simple
buttons:
  - "Yes": True
  - "No": False
---

# Introduction screen
question: |
  Welcome to the Ontario Family Law Forms Wizard
subquestion: |
  This interactive guide will help you determine exactly which forms you need to start your family law case in Ontario.
  
  **What this wizard will do:**
  - Ask you questions about your situation
  - Determine which forms you need
  - Explain the order to complete them
  - Provide direct links to each form
  - Estimate timelines for your case
  
  **Before we begin:**
  - Have information about your marriage/relationship ready
  - Know whether you have children together
  - Consider whether you have property or support issues
  - This should take about 5 minutes
  
  **Legal Disclaimer:**
  This tool provides procedural information only, not legal advice. Consider consulting a lawyer for complex cases.
continue button field: wizard_introduction
---
# Emergency check
question: |
  Is this an emergency situation?
subquestion: |
  **Emergency situations include:**
  - Risk of domestic violence or abuse
  - Concerns about child abduction
  - Immediate risk of significant financial harm
  - Urgent safety concerns for you or your children
  
  If yes, you may bypass the Mandatory Information Program (MIP) and file immediately.
field: emergency_situation
buttons:
  - "Yes, this is an emergency": True
  - "No, this is not an emergency": False
---
# Emergency forms screen
question: |
  ⚠️ URGENT: Emergency Filing Required
subquestion: |
  **Your situation requires immediate action.** You should file emergency forms TODAY.
  
  ## Emergency Forms You Need NOW:
  1. **[Form 8 - Application (General)](/interview?i=docassemble.webapp:ontario-family-law/form_8_-_application_general_flr-8-jun25-en_interview.yml)**
  2. **[Form 14 - Notice of Motion](/interview?i=docassemble.webapp:ontario-family-law/form_14b_-_motion_form_flr-14b-0921-en_interview.yml)** (for urgent relief)
  3. **Form 14A - Supporting Affidavit** (explain the emergency)
  4. **Form 14D - Order Without Notice** (if seeking order before serving other party)
  
  **If seeking restraining order:**
  - **[Form 25F - Restraining Order](/interview?i=docassemble.webapp:ontario-family-law/form_25f_-_restraining_order_flr-25f-sep09-en-fil_interview.yml)**
  
  ## Immediate Actions:
  1. **If in danger, call 911 NOW**
  2. Complete emergency forms immediately
  3. Go directly to courthouse (emergency filings possible after hours)
  4. You may get a temporary order the same day
  
  ## Crisis Resources:
  - **Emergency: 911**
  - **Assaulted Women's Helpline: 1-866-863-0511**
  - **Legal Aid Ontario: 1-800-668-8258**
  
  ---
  
  **We'll continue gathering information about your full case needs, but please prioritize your safety and file emergency forms first.**
  
continue button field: emergency_forms_needed
continue button label: Continue (I understand the urgency)
---
# MIP Information
question: |
  Mandatory Information Program (MIP) Requirement
subquestion: |
  **Before filing any family court application in Ontario, you must attend the Mandatory Information Program (MIP).**
  
  **What is MIP?**
  - Free 2-hour information session
  - Available online or in-person
  - Covers family law basics, court procedures, and alternatives to court
  - Provides certificate required for filing
  
  **Have you already attended MIP?**
field: mip_completed
buttons:
  - "Yes, I have my certificate": True
  - "No, I need to attend": False
  - "I'm not sure": unsure
---
# MIP follow-up
question: |
  MIP Session Information
subquestion: |
  % if mip_completed == False or mip_completed == "unsure":
  **You must attend MIP before filing your application.**
  
  **How to Register:**
  1. Contact your local courthouse
  2. Visit [Ontario Court Services](https://www.ontario.ca/page/mandatory-information-program) for online sessions
  3. Register for next available session
  4. Attend and receive your certificate
  
  The certificate does not expire, so you can attend MIP now and file later when ready.
  % else:
  Great! You have your MIP certificate. Keep it handy as you'll need to file it with your application.
  % endif
  
  **Note:** You can complete your forms while waiting for your MIP session, but cannot file them until after attending.
continue button field: mip_information
---
# Relationship status
question: |
  What is your relationship status?
field: relationship_status
buttons:
  - "Married": married
  - "Common-law partners": common_law
  - "Never lived together": never_together
---
# Unified question for what orders are being sought
question: |
  What orders are you seeking?
subquestion: |
  % if relationship_status == "married":
  Select all that apply. As a married couple, you can seek divorce and/or other orders:
  % else:
  Select all that apply. As common-law partners, you cannot get divorced but can seek other family law orders:
  % endif
fields:
  - "Divorce": seeking_divorce
    datatype: yesno
    default: False
    show if:
      variable: relationship_status
      is: "married"
  - "Child custody and/or access": seeking_custody
    datatype: yesno
    default: False
  - "Child support": seeking_child_support
    datatype: yesno
    default: False
  - "Spousal support": seeking_spousal_support
    datatype: yesno
    default: False
  - "Property division (equalization/division of assets)": seeking_property
    datatype: yesno
    default: False
  - "Exclusive possession of matrimonial home": seeking_exclusive_possession
    datatype: yesno
    default: False
  - "Restraining order/Non-communication order": seeking_restraining_order
    datatype: yesno
    default: False
  - "Enforcement of existing agreement or order": seeking_enforcement
    datatype: yesno
    default: False
  - "Other relief": seeking_other
    datatype: yesno
    default: False
continue button field: orders_sought
---

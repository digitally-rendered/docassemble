question: |
  What is your financial situation?
subquestion: |
  This helps determine which financial forms you need:
fields:
  - "Total value of property/assets": property_value
    datatype: currency
    min: 0
    html: |
      <span data-testid="property-value-field"></span>
  - "Are you claiming or paying support?": support_involved
    datatype: yesnoradio
    html: |
      <span data-testid="support-involved-field"></span>
  - "Do you own a business?": business_owner
    datatype: yesnoradio
    html: |
      <span data-testid="business-owner-field"></span>
  - "Do you have pensions or retirement accounts?": pension_involved
    datatype: yesnoradio
    html: |
      <span data-testid="pension-involved-field"></span>
continue button field: financial_complexity

code: |
  # Determine which financial statement form is needed
  if property_value > 75000:
    financial_form_needed = "form_13_1"
    financial_form_name = "Form 13.1 - Financial Statement (Property and Support)"
  else:
    financial_form_needed = "form_13"
    financial_form_name = "Form 13 - Financial Statement (Support Claims)"
---
# Check if financial forms needed
code: |
  needs_financial_forms = False
  
  # Check if any financial-related orders are being sought
  if defined('seeking_child_support') and seeking_child_support:
    needs_financial_forms = True
  elif defined('seeking_spousal_support') and seeking_spousal_support:
    needs_financial_forms = True
  elif defined('seeking_property') and seeking_property:
    needs_financial_forms = True
  elif defined('seeking_exclusive_possession') and seeking_exclusive_possession:
    needs_financial_forms = True
  elif defined('never_together_child_support') and never_together_child_support:
    needs_financial_forms = True
---
# Generate recommendations
code: |
  form_package.forms = []
  form_package.timeline = ""
  form_package.court = ""
  form_package.next_steps = []
  
  # Determine primary application form
  if emergency_situation:
    form_package.forms.append("Form 8 - Application (General)") #
    form_package.forms.append("Form 14 - Notice of Motion")
    form_package.forms.append("Form 14A - Supporting Affidavit")
    if ((defined('seeking_restraining_order') and seeking_restraining_order) or 
        (defined('never_together_restraining') and never_together_restraining)):
      form_package.forms.append("Form 25F - Restraining Order")
    form_package.timeline = "Immediate filing"
    
  elif relationship_status == "married" and defined('seeking_divorce') and seeking_divorce:
    form_package.forms.append("Form 8A - Application (Divorce)") #
    form_package.forms.append("Form 36 - Affidavit for Divorce")
    
    if defined('divorce_complexity') and divorce_complexity == "uncontested_simple" and not (defined('children_involved_simple') and children_involved_simple):
      form_package.forms.append("Form 25A - Divorce Order")
      form_package.timeline = "4-6 months"
    else:
      form_package.timeline = "12-18+ months"
      
  else:  # Not seeking divorce or common-law
    form_package.forms.append("Form 8 - Application (General)") #
    form_package.timeline = "12-18 months"
  
  # Add financial forms if needed
  if needs_financial_forms:
    if defined('financial_form_name'):
      form_package.forms.append(financial_form_name)
    else:
      form_package.forms.append("Form 13 - Financial Statement (Support Claims)") #
    form_package.forms.append("Form 13A - Certificate of Financial Disclosure")
  
  # Add custody affidavit if children involved
  if ((defined('seeking_custody') and seeking_custody) or 
      (defined('children_involved_simple') and children_involved_simple) or
      (defined('never_together_custody') and never_together_custody)):
    form_package.forms.append("Form 35.1 - Affidavit (Custody/Access)") #
  
  # Add paternity form if needed
  if defined('never_together_paternity') and never_together_paternity:
    form_package.forms.append("Form 34A - Affidavit of Parentage")
  
  # Add service form
  form_package.forms.append("Form 6B - Affidavit of Service")
  
  # Determine court
  if relationship_status == "married" and defined('seeking_divorce') and seeking_divorce:
    form_package.court = "Superior Court of Justice"
  elif defined('property_value') and property_value > 35000:
    form_package.court = "Superior Court of Justice"
  elif defined('seeking_property') and seeking_property and relationship_status == "married":
    form_package.court = "Superior Court of Justice"  # Property division for married couples
  else:
    form_package.court = "Ontario Court of Justice (or Unified Family Court where available)"
  
  # Set next steps
  form_package.next_steps = [
    "Attend MIP if not already completed",
    "Complete the forms in the order listed",
    "File at " + form_package.court,
    "Serve the other party within 6 months",
    "Wait for response (30 days)",
    "Attend first court date"
  ]
  
  generate_form_recommendations = True
---
# Generate workflow data for case management system
code: |
  workflow_data = {
    'relationship_status': relationship_status if defined('relationship_status') else 'unknown',
    'orders_sought': {},
    'financial_forms_needed': needs_financial_forms if defined('needs_financial_forms') else False,
    'emergency_situation': emergency_situation if defined('emergency_situation') else False,
    'forms_count': len(form_package.forms) if defined('form_package') and hasattr(form_package, 'forms') else 0,
    'timeline': form_package.timeline if defined('form_package') and hasattr(form_package, 'timeline') else 'Unknown',
    'court': form_package.court if defined('form_package') and hasattr(form_package, 'court') else 'Unknown'
  }
  
  # Populate orders sought
  order_fields = [
    'seeking_divorce', 'seeking_custody', 'seeking_child_support', 
    'seeking_spousal_support', 'seeking_property', 'seeking_exclusive_possession',
    'seeking_restraining_order', 'seeking_enforcement', 'seeking_other',
    'never_together_custody', 'never_together_child_support', 'never_together_restraining', 'never_together_other'
  ]
  
  for field in order_fields:
    if defined(field):
      workflow_data['orders_sought'][field] = value(field)
    else:
      workflow_data['orders_sought'][field] = False
      
  generate_workflow_data = True
---
# Show recommendations
question: |
  Your Personalized Forms Package
subquestion: |
  Based on your answers, here are the forms you need:
  
  ## Required Forms (in order):
  % for form in form_package.forms:
  % if "Form 8A" in form:
  1. **[Form 8A - Application (Divorce)](/interview?i=docassemble.webapp:ontario-family-law/form_8a_-_application_divorce_flr-8a-apr24-en-fil_interview.yml)**
  % elif "Form 8" in form and "8A" not in form:
  1. **[Form 8 - Application (General)](/interview?i=docassemble.webapp:ontario-family-law/form_8_-_application_general_flr-8-jun25-en_interview.yml)**
  % elif "Form 36" in form:
  2. **[Form 36 - Affidavit for Divorce](/interview?i=docassemble.webapp:ontario-family-law/form_36_-_affidavit_for_divorce_flr-36-apr24-en-fil_interview.yml)**
  % elif "Form 13.1" in form:
  3. **[Form 13.1 - Financial Statement (Property & Support)](/interview?i=docassemble.webapp:ontario-family-law/form_13.1_-_financial_statement_property_flr-13-1-may21-en-fil_interview.yml)**
  % elif "Form 13" in form and "13A" not in form:
  3. **[Form 13 - Financial Statement (Support Claims)](/interview?i=docassemble.webapp:ontario-family-law/form_13_-_financial_statement_support_flr-13-may21-en-fil_interview.yml)**
  % elif "Form 13A" in form:
  4. **[Form 13A - Certificate of Financial Disclosure](/interview?i=docassemble.webapp:ontario-family-law/form_13a_-_certificate_financial_disclosure_flr-13a-may21-en-fil_interview.yml)**
  % elif "Form 6B" in form:
  5. **[Form 6B - Affidavit of Service](/interview?i=docassemble.webapp:ontario-family-law/form_6b_-_affidavit_service_flr-06b-apr16-en-fil_interview.yml)**
  % else:
  - **${ form }**
  % endif
  % endfor
  
  ## Timeline
  **Estimated timeline:** ${ form_package.timeline }
  
  ## Court
  **File at:** ${ form_package.court }
  
  ## Next Steps
  % for step in form_package.next_steps:
  - ${ step }
  % endfor
  
  ## Response Forms
  The other party will need to file:
  - **[Form 10 - Answer](/interview?i=docassemble.webapp:ontario-family-law/form_10_-_answer_flr-10-jun25-en-fil_interview.yml)** (within 30 days)
  - Matching financial forms if applicable
  
  ## Save This Information
  You can bookmark this page or print it for reference.
  
  **Ready to start?** Click on the first form link above to begin.
continue button field: show_recommendations

# User role determination
question: |
  Your Role in the Legal Proceeding
subquestion: |
  **Applicant**: The person who first filed court documents to start the case
  **Respondent**: The person responding to the case that was filed against them
  
  If this is a brand new case that hasn't been filed yet, you will be the Applicant.
field: user_role
buttons:
  - "I am starting a new case (Applicant)": applicant
  - "I am responding to a case filed against me (Respondent)": respondent
  - "I'm not sure / Need help determining": unsure
---
# Map user role to party objects
code: |
  if user_role == "applicant":
    user_party = applicant
    other_party = respondent
    user_party_title = "Applicant"
    other_party_title = "Respondent"
  elif user_role == "respondent":
    user_party = respondent
    other_party = applicant
    user_party_title = "Respondent"
    other_party_title = "Applicant"
  else:  # unsure
    user_party = applicant  # Default to applicant
    other_party = respondent
    user_party_title = "Party 1"
    other_party_title = "Party 2"
---
# User Information - Full Individual object with validation
question: |
  Your Information (${ user_party_title })
subquestion: |
  Please provide your complete information. All fields marked with * are required.
  
  **Note**: This information will be used in all court documents.
fields:
  # Name fields - Individual object properties
  - "First Name *": user_party.name.first
    required: True
    maxlength: 50
  - "Middle Name(s)": user_party.name.middle
    required: False
    maxlength: 50
  - "Last Name *": user_party.name.last
    required: True
    maxlength: 50
  - "Any other names used": user_party.name.suffix
    required: False
    help: Include maiden name, aliases, or names from previous marriages
    maxlength: 100
  # Personal details
  - "Date of Birth *": user_party.birthdate
    datatype: date
    required: True
    min: ${ (datetime.datetime.now() - datetime.timedelta(days=365*100)).date() }
    max: ${ (datetime.datetime.now() - datetime.timedelta(days=365*18)).date() }
    validation messages:
      max: "You must be at least 18 years old to file."
  - "Gender": user_party.gender
    required: False
    choices:
      - Male: male
      - Female: female  
      - Other: other
      - Prefer not to say: unknown
  # Contact information
  - "Phone Number (Primary) *": user_party.phone_number
    datatype: phone
    required: True
    international: True
  - "Phone Number (Alternative)": user_party.mobile_number
    datatype: phone
    required: False
    international: True
  - "Email Address": user_party.email
    datatype: email
    required: False
  # Address fields
  - "Street Address *": user_party.address.address
    required: True
    maxlength: 100
  - "Unit/Apt Number": user_party.address.unit
    required: False
    maxlength: 20
  - "City *": user_party.address.city
    required: True
    maxlength: 50
  - "Province *": user_party.address.state
    default: "Ontario"
    code: |
      ['Alberta', 'British Columbia', 'Manitoba', 'New Brunswick',
       'Newfoundland and Labrador', 'Northwest Territories', 'Nova Scotia',
       'Nunavut', 'Ontario', 'Prince Edward Island', 'Quebec',
       'Saskatchewan', 'Yukon']
  - "Postal Code *": user_party.address.postal_code
    required: True
    validation code: |
      if not re.match(r'^[A-Z]\d[A-Z]\s?\d[A-Z]\d$', user_party.address.postal_code.upper()):
        # validation_error("Please enter a valid Canadian postal code (e.g., M5H 2N2)") #
  - "Country": user_party.address.country
    default: "Canada"
    choices:
      - Canada
      - United States
      - Other
continue button field: collect_user_party_info
---

  - Ontario Court of Justice: $157
  - Fee waiver may be available if you meet financial criteria
  
  **Important Legal Reminders:**
  
  - **Filing Requirements:** Keep copies of all documents for your records
  - **Service Requirements:** Serve the respondent within 6 months of filing
  - **Response Time:** The respondent has 30 days to file an Answer (Form 10)
  - **Additional Forms:** You may need to file additional forms such as:
    - Form 13 or 13.1 (Financial Statement) if claiming support or property
    - Form 35.1 (Affidavit) if claiming custody or access
  - **Legal Representation:** Consider getting legal advice for complex matters
  - **Court Appearance:** You may need to attend court hearings
  - **Updates:** Notify the court of any address changes
  
  **Ontario Family Law Compliance Notice:**
  This form has been designed to comply with Ontario Family Law Rules. However, you are responsible for ensuring all information is accurate and complete. Seek legal advice if you are unsure about your rights or obligations.
  
  **Privacy Protection:** Information about children will be protected according to Ontario Family Law Rules and privacy legislation.
  

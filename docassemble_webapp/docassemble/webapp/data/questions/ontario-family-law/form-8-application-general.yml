  **What happens next:**
  
  1. **Download and print** your completed form
  2. **File at court** with the appropriate filing fee
  3. **Serve the respondent** within required timeframes
  4. **Complete additional forms** if required (Financial Statement, etc.)
  
  **Filing Fees (as of 2024):**

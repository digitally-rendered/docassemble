---
initial: True
code: |
  # Initialize response tracking
  paragraph_responses = {}
  cross_application_claims = {}
  requires_financial_disclosure = False
  filing_cross_application = False
  
  # Initialize common variables
  if not defined('today_date'):
    today_date = today()
---
question: |
  Form 10 - Answer: Responding to a Family Court Application
subquestion: |
  **What is Form 10 - Answer?**
  
  Form 10 is the official document you must file to respond to a family court application (such as Form 8 or 8A) in Ontario. As the respondent, this form allows you to:
  
  - Respond to each claim made against you
  - Admit, deny, or state you have no knowledge of specific allegations
  - Make your own claims (cross-application) if desired
  - Provide required financial information
  
  **CRITICAL TIME LIMIT**
  
  You typically have **30 days** from being served with the application to file your Answer. Missing this deadline can result in:
  - Default judgment against you
  - Loss of your right to defend the claims
  - The court proceeding without your input
  
  **When You Need This Form**
  
  You must file Form 10 if you've been served with:
  - Form 8 (Application - General)
  - Form 8A (Application - Divorce)
  - Form 8B (Application - Child Protection)
  - Any other family court application naming you as respondent
  
  **Important Notice**
  
  This system provides general legal information only. Given the complexity of family law and the importance of deadlines, **you should strongly consider consulting with a qualified Ontario family lawyer** before filing your response.
  
  Contact the Law Society of Ontario Referral Service at 1-855-947-5255 or visit [lso.ca](https://lso.ca) to find qualified legal help.
field: intro_screen
---
question: |
  Time Limit Warning - Act Quickly
subquestion: |
  **When were you served with the family court application?**
  
  This date is critical for calculating your filing deadline. You can usually find the service date on:
  - The Affidavit of Service filed with the court
  - Your copy of the application documents
  - Process server documents
  
  **If you're not sure of the exact date**, use the earliest possible date to ensure you don't miss the deadline.
fields:
  - Service Date: service_date
    datatype: date
    max: ${ today() }
    help: |
      The date you were personally served with the court documents, or the date documents were left at your address if substitutional service was used.
---
code: |
  # Calculate deadline (30 days from service)
  deadline_date = service_date.plus(days=30)
  days_remaining = (deadline_date - today()).days
  
  # Determine urgency level
  if days_remaining < 0:
    deadline_status = "OVERDUE"
    urgency_color = "danger"
  elif days_remaining <= 3:
    deadline_status = "URGENT"
    urgency_color = "danger"
  elif days_remaining <= 7:
    deadline_status = "SOON"
    urgency_color = "warning"
  else:
    deadline_status = "OK"
    urgency_color = "success"
---
question: |
  % if deadline_status == "OVERDUE":
  ⚠️ DEADLINE OVERDUE - Seek Immediate Legal Help
  % elif deadline_status == "URGENT":
  ⚠️ URGENT DEADLINE - File Immediately
  % elif deadline_status == "SOON":
  ⚠️ Deadline Approaching
  % else:
  Filing Deadline Information
  % endif
subquestion: |
  **Your Filing Deadline:** ${ deadline_date.strftime("%B %d, %Y") }
  
  **Days Remaining:** 
  % if days_remaining < 0:
  <div class="alert alert-danger">
  <strong>${ abs(days_remaining) } days OVERDUE</strong>
  
  Your deadline has passed. You should:
  1. **Contact a lawyer immediately**
  2. File your Answer as soon as possible
  3. Be prepared to explain the delay to the court
  4. Consider requesting an extension
  
  The court may still accept a late Answer, but you risk default judgment.
  </div>
  % elif days_remaining == 0:
  <div class="alert alert-danger">
  <strong>DUE TODAY</strong> - File immediately
  </div>
  % elif days_remaining <= 3:
  <div class="alert alert-danger">
  <strong>${ days_remaining } days remaining</strong> - File immediately
  </div>
  % elif days_remaining <= 7:
  <div class="alert alert-warning">
  <strong>${ days_remaining } days remaining</strong> - Prepare to file soon
  </div>
  % else:
  <div class="alert alert-success">
  <strong>${ days_remaining } days remaining</strong> - You have time to prepare properly
  </div>
  % endif
  
  **Where to File:**
  - At the court registry where the application was filed
  - Online through Justice Services Online (if available for your court)
  - By mail (ensure it arrives before the deadline)
  
  **Filing Fee:** Check current court fees - financial assistance may be available if you qualify.
continue button field: time_limit_warning
---
question: |
  Court and Case Information
subquestion: |
  Enter the court information exactly as it appears on the application you received.
fields:
  - Court Office Address: court_office_address
    input type: area
    help: |
      Copy this exactly from the application documents. Include the full address of the court registry.
  - Court File Number: court_file_number
    help: |
      Found at the top of the application. Format is typically like "FS-24-123456" or similar.
    validate: |
      lambda y: len(y.strip()) > 0 or validation_error("Court file number is required")
  - Form of Application Received: received_form_type
    input type: dropdown
    choices:
      - Form 8 - Application (General): form_8
      - Form 8A - Application (Divorce): form_8a  
      - Form 8B - Application (Child Protection): form_8b
      - Other: other
  - If other, specify: other_form_type
    show if:
      variable: received_form_type
      is: other
---
question: |
  Party Information
subquestion: |
  **Applicant Information**
  
  Enter the applicant's information exactly as shown on the court documents you received.
fields:
  - Applicant's Full Legal Name: applicant_full_name
    help: First, middle, and last names as they appear on the application
  - Applicant's Date of Birth: applicant_birthdate
    datatype: date
    required: False
    help: Only if shown on the application documents
---
question: |
  Your Information (Respondent)
subquestion: |
  Provide your current information. This must match your legal identification.
fields:
  - Your Full Legal Name: respondent_full_name
    default: ${ user_name_full() if defined('user_name_full') else '' }
  - Your Date of Birth: respondent_birthdate
    datatype: date
  - Your Address for Service: respondent_address
    input type: area
    help: |
      This is where court documents will be sent to you. It must be a complete address where you can reliably receive mail.
  - City: respondent_city
  - Province: respondent_province
    default: "Ontario"
  - Postal Code: respondent_postal_code
  - Phone Number: respondent_phone
    required: False
  - Email: respondent_email
    datatype: email
    required: False
    help: Many courts now communicate by email when possible
  - Fax Number: respondent_fax
    required: False
---
question: |
  Application Details You're Responding To
subquestion: |
  **What claims or orders is the applicant seeking?**
  
  Review the application you received and identify all claims being made. Check all that apply:
fields:
  - Claims in the Application: application_claims
    datatype: checkboxes
    choices:
      - Divorce: divorce
      - Custody of children: custody
      - Access/parenting time: access
      - Child support: child_support
      - Spousal support: spousal_support
      - Division of property: property_division
      - Exclusive possession of matrimonial home: exclusive_possession
      - Restraining order: restraining_order
      - Other relief: other_relief
  - If other relief, specify: other_relief_details
    input type: area
    show if: application_claims['other_relief']
  - Are there children involved in this case?: children_involved
    datatype: yesnoradio
---
question: |
  Children Information
subquestion: |
  Provide information about all children involved in this case.
list collect: True
fields:
  - Child's Full Name: children[i].name
  - Date of Birth: children[i].birthdate
    datatype: date
  - Currently Lives With: children[i].current_residence
    choices:
      - Applicant: applicant
      - You (Respondent): respondent
      - Both (shared): both
      - Other: other
  - If other, specify: children[i].other_residence
    show if:
      variable: children[i].current_residence
      is: other
  - Relationship to You: children[i].relationship_respondent
    choices:
      - Biological child: biological
      - Adopted child: adopted
      - Step-child: step
      - Other: other
  - If other relationship, specify: children[i].other_relationship
    show if:
      variable: children[i].relationship_respondent
      is: other
---
question: |
  Paragraph-by-Paragraph Response
subquestion: |
  **Instructions for Responding**
  
  You must respond to each numbered paragraph in the application. For each paragraph, you can:
  
  - **Admit**: You agree the facts stated are true
  - **Deny**: You disagree with the facts stated  
  - **No Knowledge**: You don't have enough information to admit or deny
  
  **Important:** Only admit what you know to be completely true. When in doubt, deny or state no knowledge.
  
  **How many numbered paragraphs are in the application?**
  
  Count the numbered paragraphs in the application document you received (usually paragraphs 1, 2, 3, etc.).
fields:
  - Number of Paragraphs: total_paragraphs
    datatype: integer
    min: 1
    max: 50
    help: Count each numbered paragraph that makes factual claims
continue button field: start_paragraph_responses
---
question: |
  Response to Paragraph ${ i }
subquestion: |
  **Paragraph ${ i } of the Application states:**
  
  Please review paragraph ${ i } in the application document and enter the key facts or claims made in that paragraph below, then indicate your response.
fields:
  - Summary of Paragraph ${ i }: paragraph_responses[i]['summary']
    input type: area
    help: |
      Briefly summarize what this paragraph claims. This helps you organize your response and ensures you're responding to the right paragraph.
  - Your Response: paragraph_responses[i]['response']
    input type: radio
    choices:
      - Admit: admit
      - Deny: deny  
      - No Knowledge: no_knowledge
    help: |
      - **Admit**: The facts in this paragraph are true
      - **Deny**: The facts in this paragraph are false or incorrect
      - **No Knowledge**: You don't have sufficient information to admit or deny
  - Explanation (if denying): paragraph_responses[i]['explanation']
    input type: area
    required: False
    show if:
      variable: paragraph_responses[i]['response']
      is: deny
    help: |
      If you're denying the paragraph, briefly explain what you believe to be true instead. This helps clarify your position.
---
code: |
  # Loop through all paragraphs
  for i in range(1, total_paragraphs + 1):
    if i not in paragraph_responses:
      paragraph_responses[i] = {}
    # Force asking the question for each paragraph
    paragraph_responses[i]['response']
    if paragraph_responses[i]['response'] == 'deny':
      paragraph_responses[i]['explanation']
  
  # Mark paragraph responses as complete
  paragraph_responses_complete = True
---
question: |
  Cross-Application (Your Own Claims)
subquestion: |
  **Do you want to make your own claims against the applicant?**
  
  A cross-application allows you to ask the court for orders in your favor. You might want to file a cross-application if you want:
  
  - Different custody or access arrangements than requested
  - Child or spousal support for yourself
  - Your own property division claims
  - Other relief not requested in the original application
  
  **Important Considerations:**
  
  - Cross-applications have the same fee as regular applications
  - You become a "cross-applicant" making claims against the "cross-respondent" (original applicant)
  - Financial disclosure requirements may apply
  - Additional forms may be required
  
  **You can file a cross-application later** if you're not ready now, but it's often more efficient to include it with your Answer.
yesno: filing_cross_application
help: |
  If you're unsure whether to file a cross-application, consider consulting with a lawyer. You can always file one later, but there may be strategic advantages to filing it now.
---
question: |
  Your Cross-Application Claims
subquestion: |
  **What orders do you want the court to make in your favor?**
  
  Select all types of relief you're seeking through your cross-application:
fields:
  - Cross-Application Claims: cross_application_claims
    datatype: checkboxes
    choices:
      - Divorce: divorce
      - Custody of children: custody  
      - Access/parenting time with children: access
      - Child support from other party: child_support
      - Spousal support from other party: spousal_support
      - Division of property: property_division
      - Exclusive possession of matrimonial home: exclusive_possession
      - Restraining order: restraining_order
      - Costs (legal fees): costs
      - Other relief: other_relief
  - If other relief, specify: cross_application_other_details
    input type: area
    show if: cross_application_claims['other_relief']
---
question: |
  Cross-Application Details
subquestion: |
  **Provide details about your cross-application claims:**
  
  For each type of relief you're seeking, provide specific details about what you want the court to order.
fields:
  - Detailed Description of Relief Sought: cross_application_details
    input type: area
    help: |
      Be specific about what you want. For example:
      - "Joint custody with primary residence with the respondent"
      - "Child support in accordance with the Child Support Guidelines"  
      - "Spousal support of $X per month for X duration"
      - "Equal division of matrimonial property"
  - Grounds for Cross-Application: cross_application_grounds
    input type: area
    help: |
      Explain the factual basis for your claims. What facts support your request for these orders?
---
question: |
  Financial Disclosure Requirements
subquestion: |
  **Do any of the following apply to your case?**
  
  Ontario Family Law Rules require financial disclosure in certain circumstances. Check if any apply:
fields:
  - Financial Disclosure Triggers: disclosure_triggers
    datatype: checkboxes
    choices:
      - Child support is claimed (by either party): child_support_claimed
      - Spousal support is claimed (by either party): spousal_support_claimed
      - Property division is claimed: property_claimed  
      - Exclusive possession of matrimonial home is claimed: possession_claimed
      - Any party's income exceeds $150,000: high_income
      - Court has ordered financial disclosure: court_ordered
  - None of the above apply: no_disclosure_required
    datatype: yesno
---
code: |
  # Determine if financial disclosure is required
  if (disclosure_triggers.any_true() if defined('disclosure_triggers') else False) and not no_disclosure_required:
    requires_financial_disclosure = True
  else:
    requires_financial_disclosure = False
---
question: |
  Financial Information Required
subquestion: |
  **You must provide financial disclosure with your Answer.**
  
  Based on your case, you're required to file financial disclosure. This typically includes:
  
  **Required Documents:**
  - Form 13 (Financial Statement - Property and Support) OR
  - Form 13.1 (Financial Statement - Support Claims Only)
  - Income tax returns (last 3 years)
  - Pay stubs or employment records
  - Bank statements
  - Investment/asset documentation
  
  **Your Current Financial Information**
  
  Provide your current financial details (this will help determine which forms you need):
fields:
  - Your Current Annual Income: respondent_annual_income
    datatype: currency
    help: |
      Include income from all sources before taxes and deductions
  - Employment Status: respondent_employment_status
    input type: dropdown
    choices:
      - Employed full-time: employed_full
      - Employed part-time: employed_part
      - Self-employed: self_employed
      - Unemployed: unemployed
      - Student: student
      - Retired: retired
      - Disability benefits: disability
      - Other: other
  - If other, specify: respondent_employment_other
    show if:
      variable: respondent_employment_status
      is: other
  - Do you own real estate?: owns_real_estate
    datatype: yesnoradio
  - Estimated value of all assets: total_asset_value
    datatype: currency
    required: False
    help: Include home, vehicles, investments, savings, etc.
  - Total debt amount: total_debt_value
    datatype: currency  
    required: False
    help: Include mortgage, credit cards, loans, etc.
---
code: |
  # Determine which financial form is needed
  if (child_support_claimed or spousal_support_claimed or property_claimed or 
      respondent_annual_income > 150000 or owns_real_estate or 
      (total_asset_value and total_asset_value > 50000)):
    required_financial_form = "Form 13 (Financial Statement - Property and Support)"
  else:
    required_financial_form = "Form 13.1 (Financial Statement - Support Claims Only)"
---
question: |
  Service of Your Answer
subquestion: |
  **How will you serve your Answer on the other parties?**
  
  You must serve a copy of your completed Answer on:
  - The applicant (or their lawyer if represented)
  - Any other respondents in the case
  
  **Service Methods (Ontario Family Law Rules):**
fields:
  - Service Method: service_method
    input type: dropdown  
    choices:
      - Personal service: personal
      - Regular mail to last known address: regular_mail
      - Registered mail: registered_mail
      - Email (if previously agreed or ordered): email
      - Fax (if previously agreed or ordered): fax
      - Through lawyer: through_lawyer
      - Other method (court ordered): other
    help: |
      Personal service is preferred. Mail service is acceptable if you don't know their current address.
  - Will you serve the applicant yourself?: self_service
    datatype: yesnoradio
    help: |
      You can serve documents yourself, or have someone else (not a party to the case) serve them.
  - If someone else will serve, who?: server_name
    show if:
      variable: self_service
      is: False
  - Service address for applicant: applicant_service_address
    input type: area
    help: |
      Address where you will serve the applicant, or their lawyer's address if they're represented.
---
question: |
  Legal Representation
subquestion: |
  **Are you represented by a lawyer?**
fields:
  - Do you have a lawyer?: has_lawyer
    datatype: yesnoradio
  - Lawyer's Name: lawyer_name
    show if: has_lawyer
  - Law Firm: lawyer_firm
    show if: has_lawyer
    required: False
  - Lawyer's Address: lawyer_address
    input type: area
    show if: has_lawyer
  - Phone Number: lawyer_phone
    show if: has_lawyer
    required: False
  - Email: lawyer_email
    datatype: email
    show if: has_lawyer
    required: False
  - LSO Number: lawyer_lso_number
    show if: has_lawyer
    required: False
    help: Law Society of Ontario registration number
---
question: |
  Review Your Answer
subquestion: |
  **Please review your responses before submitting:**
  
  **Court Information:**
  - Court File: ${ court_file_number }
  - Application Type: ${ received_form_type }
  
  **Parties:**
  - Applicant: ${ applicant_full_name }
  - You (Respondent): ${ respondent_full_name }
  
  **Your Responses:**
  % for para_num in sorted(paragraph_responses.keys()):
  - **Paragraph ${ para_num }**: ${ paragraph_responses[para_num]['response'].title() }
    % if paragraph_responses[para_num]['response'] == 'deny' and paragraph_responses[para_num].get('explanation'):
    
    *Explanation: ${ paragraph_responses[para_num]['explanation'] }*
    % endif
  % endfor
  
  % if filing_cross_application:
  **Cross-Application Claims:**
  % for claim in cross_application_claims.true_values():
  - ${ claim.title() }
  % endfor
  % else:
  **Cross-Application:** Not filing at this time
  % endif
  
  % if requires_financial_disclosure:
  **Financial Disclosure:** Required (${ required_financial_form })
  % endif
  
  **Service Method:** ${ service_method }
  
  % if has_lawyer:
  **Legal Representation:** ${ lawyer_name }
  % else:
  **Legal Representation:** Self-represented
  % endif
  
  **Is this information correct?**
yesno: review_confirmed
---
question: |
  Final Instructions for Filing Your Answer
subquestion: |
  **Your Form 10 - Answer is ready for filing.**
  
  **IMMEDIATE NEXT STEPS:**
  
  1. **Print and Sign** your completed Form 10
     - Print 3 copies (court, applicant, your records)
     - Sign and date each copy
  
  2. **Gather Required Documents:**
     - Completed and signed Form 10
     % if requires_financial_disclosure:
     - ${ required_financial_form } (completed separately)
     - Income tax returns (last 3 years)
     - Pay stubs and financial records
     % endif
     - Filing fee (check current court fees)
  
  3. **File at Court Registry:**
     - **Deadline**: ${ deadline_date.strftime("%B %d, %Y") }
     % if days_remaining <= 3:
     - **⚠️ URGENT**: Only ${ days_remaining } days remaining!
     % endif
     - **Address**: ${ court_office_address }
     - **File in person or by mail** (ensure mail arrives before deadline)
  
  4. **Serve the Applicant:**
     - Serve within 6 days of filing (Family Law Rule 6)
     - Method: ${ service_method }
     - Address: ${ applicant_service_address }
  
  5. **File Affidavit of Service:**
     - Use Form 6B after serving
     - File within reasonable time after service
  
  **⚠️ IMPORTANT REMINDERS:**
  
  - **Don't miss your deadline** - file before ${ deadline_date.strftime("%B %d, %Y") }
  - **Serve promptly** after filing
  - **Keep copies** of everything for your records
  - **Get filing receipts** from the court registry
  
  **Need Legal Help?**
  
  Family law cases can be complex. Consider consulting with a qualified Ontario lawyer:
  - Law Society of Ontario Referral Service: 1-855-947-5255
  - Legal Aid Ontario: 1-800-668-8258 (if you qualify)
  - Pro Bono Ontario: 1-855-875-3411
  
  **Would you like to download your completed form?**
field: final_instructions
buttons:
  - Download Form 10: download
  - Complete: complete
---
attachment:
  name: Form 10 - Answer
  filename: Form_10_Answer_${ respondent_full_name.replace(' ', '_') }
  description: |
    Your completed Form 10 - Answer for Ontario Family Court
  content: |
    ONTARIO FAMILY LAW
    FORM 10 - ANSWER
    
    Court File Number: ${ court_file_number }
    
    ${ court_office_address }
    
    BETWEEN:
    
    ${ applicant_full_name }
                                                          Applicant
    
    and
    
    ${ respondent_full_name }
                                                          Respondent
    
    
    TO THE APPLICANT:
    
    I, ${ respondent_full_name }, respond to your application as follows:
    
    
    PART 1: RESPONSE TO EACH NUMBERED PARAGRAPH
    
    % for para_num in sorted(paragraph_responses.keys()):
    ${ para_num }. ${ paragraph_responses[para_num].get('summary', 'Response to paragraph ' + str(para_num)) }
    
       Response: I ${ paragraph_responses[para_num]['response'].upper().replace('_', ' ') } the allegations in paragraph ${ para_num }.
       
       % if paragraph_responses[para_num]['response'] == 'deny' and paragraph_responses[para_num].get('explanation'):
       Explanation: ${ paragraph_responses[para_num]['explanation'] }
       % endif
    
    % endfor
    
    
    % if filing_cross_application:
    PART 2: CROSS-APPLICATION
    
    I make a cross-application for the following relief:
    
    % for claim in cross_application_claims.true_values():
    • ${ claim.title().replace('_', ' ') }
    % endfor
    
    Details of Cross-Application:
    ${ cross_application_details }
    
    Grounds for Cross-Application:
    ${ cross_application_grounds }
    
    % endif
    
    % if requires_financial_disclosure:
    PART 3: FINANCIAL DISCLOSURE
    
    I understand that I am required to file financial disclosure including:
    - ${ required_financial_form }
    - Supporting financial documentation
    - Income tax returns for the last 3 years
    
    Current annual income: ${ currency(respondent_annual_income) }
    Employment status: ${ respondent_employment_status.replace('_', ' ').title() }
    
    % endif
    
    PART 4: PARTY INFORMATION
    
    APPLICANT:
    Name: ${ applicant_full_name }
    % if defined('applicant_birthdate') and applicant_birthdate:
    Date of Birth: ${ applicant_birthdate }
    % endif
    
    RESPONDENT:
    Name: ${ respondent_full_name }
    Date of Birth: ${ respondent_birthdate }
    Address: ${ respondent_address }
             ${ respondent_city }, ${ respondent_province } ${ respondent_postal_code }
    % if respondent_phone:
    Phone: ${ respondent_phone }
    % endif
    % if respondent_email:
    Email: ${ respondent_email }
    % endif
    
    % if has_lawyer:
    LAWYER FOR RESPONDENT:
    Name: ${ lawyer_name }
    % if lawyer_firm:
    Firm: ${ lawyer_firm }
    % endif
    Address: ${ lawyer_address }
    % if lawyer_phone:
    Phone: ${ lawyer_phone }
    % endif
    % if lawyer_email:
    Email: ${ lawyer_email }
    % endif
    % if lawyer_lso_number:
    LSO#: ${ lawyer_lso_number }
    % endif
    % endif
    
    % if children_involved and defined('children'):
    
    CHILDREN:
    % for child in children:
    Name: ${ child.name }
    Date of Birth: ${ child.birthdate }
    Currently Lives With: ${ child.current_residence.replace('_', ' ').title() }
    Relationship to Respondent: ${ child.relationship_respondent.replace('_', ' ').title() }
    
    % endfor
    % endif
    
    
    CERTIFICATE OF SERVICE
    

---
mandatory: True
code: |
  # Set form type for common components
  form_type = "Form 10 - Answer"
  
  # Initialize variables
  user_role = "respondent"
  
  # Main interview flow
  intro_screen
  time_limit_warning
  court_information
  parties_information
  application_details
  paragraph_responses
  cross_application_decision
  if filing_cross_application:
    cross_application_claims
    cross_application_details
  financial_disclosure_check
  if requires_financial_disclosure:
    financial_information
  service_information

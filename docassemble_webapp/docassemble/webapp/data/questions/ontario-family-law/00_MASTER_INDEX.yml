  ## 🆘 Troubleshooting
  
  If an interview doesn't load:
  1. Check the URL path is correct
  2. Try the structured version (most reliable)
  3. Enable debug mode with `?debug=1`
  4. Check browser console for errors
  
  ## 📝 Notes
  
  - **Structured Interviews**: Best for complex forms with relationships, includes error handling
  - **YAML Interviews**: Traditional Docassemble format
  - All structured interviews now include comprehensive error handling
  - Debug mode available with `?debug=1`
  

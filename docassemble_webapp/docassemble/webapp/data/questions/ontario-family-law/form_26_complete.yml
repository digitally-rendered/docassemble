question: |
  Write “NIL” if your lump-sum claim has nothing to do with support or maintenance.  Otherwise, figure out what portion of your lump-sum claim deals with support or maintenance.  You are entitled to include the interest earned on that amount. This figure will be needed by the clerk of the court and by others, such as the sheriff, because they are required by law to give your claim for lump-sum support priority over the claims of other people with orders against the payor under the  Creditors’ Relief Act .  Section 4 of that Act states:

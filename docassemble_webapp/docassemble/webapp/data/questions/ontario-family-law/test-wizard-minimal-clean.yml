---
metadata:
  title: Test Wizard Minimal Clean
---
modules:
  - re
  - datetime
---
mandatory: True
code: |
  try:
    intro_screen
    test_done
  except Exception as e:
    error_message = str(e)
    error_type = type(e).__name__
    show_error
---
question: |
  Welcome to Test Wizard
continue button field: intro_screen
---
event: test_done
question: |
  Test Complete
subquestion: |
  The wizard loaded successfully with error handling!
---
event: show_error
question: |
  Error Occurred
subquestion: |
  Error Type: ${ error_type }
  
  Error Message: ${ error_message }
  

---
metadata:
  title: Test Error Display
  short title: Error Test
  description: Test interview to demonstrate enhanced error reporting
---
features:
  debug: True
---
mandatory: True
question: |
  # Error Display Test
subquestion: |
  This interview will test different types of errors.
  
  Click a button to trigger an error:
buttons:
  - "Undefined Variable Error": continue
    code: |
      # This will cause a NameError
      result = undefined_variable_that_does_not_exist
  - "Syntax Error": continue
    code: |
      # This will cause a SyntaxError
      if True
        pass
  - "Type Error": continue
    code: |
      # This will cause a TypeError
      result = "string" + 123
  - "Division by Zero": continue
    code: |
      # This will cause a ZeroDivisionError
      result = 10 / 0
  - "Attribute Error": continue
    code: |
      # This will cause an AttributeError
      result = None.some_method()
  - "Key Error": continue
    code: |
      # This will cause a KeyError
      data = {"a": 1}
      result = data["missing_key"]
---
question: |
  Result: ${ result }
mandatory: True
---
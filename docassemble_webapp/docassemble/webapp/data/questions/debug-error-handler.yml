  % if error_details:
  ### How to Fix:
  1. Check the YAML syntax in your interview file
  2. Verify all variable names are defined
  3. Check Python code blocks for syntax errors
  4. Review the traceback for the specific line causing the issue
  
  ### Common Issues:
  - **NameError**: Variable not defined - check spelling and question order
  - **SyntaxError**: YAML or Python syntax issue - check indentation
  - **KeyError**: Missing dictionary key - verify data structure
  - **AttributeError**: Object doesn't have the attribute - check object type
  % endif

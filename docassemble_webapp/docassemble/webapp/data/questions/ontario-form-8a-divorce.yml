question: |
  Ontario Form 8A - Application (Divorce)
subquestion: |
  This form is used to apply for a divorce in Ontario.
  
  **Legal Disclaimer:** This provides legal information, not legal advice. 
  Consult a lawyer or Legal Aid Ontario for legal advice.
  
  **Requirements for Divorce in Ontario:**
  - You or your spouse must have lived in Ontario for at least 1 year
  - You must have been separated for at least 1 year (or have grounds of adultery/cruelty)
  - You must provide a marriage certificate
field: intro_screen
---
question: |
  Eligibility Check
subquestion: |
  Before we continue, please confirm:
fields:
  - Are you currently married?: currently_married
    datatype: yesnoradio
  - Have you been separated for at least 1 year?: separated_year
    datatype: yesnoradio
  - Do you or your spouse live in Ontario?: ontario_resident
    datatype: yesnoradio
field: eligibility_check
---
question: |
  Marriage Information
fields:
  - Marriage Date: marriage_info.date
    datatype: date
    max: ${ today() }
  - Marriage Location (City, Province/State, Country): marriage_info.location
---
question: |
  Separation Information
fields:
  - Date of Separation: separation_date
    datatype: date
    max: ${ today() }
  - Are you seeking divorce based on: divorce_grounds
    choices:
      - One year separation: separation
      - Adultery: adultery  
      - Physical or mental cruelty: cruelty
---
mandatory: True
question: |
  Divorce Application Summary
subquestion: |
  **Applicant:** ${ applicant.name.first } ${ applicant.name.last }
  
  **Respondent:** ${ respondent.name.first } ${ respondent.name.last }
  
  **Marriage Date:** ${ marriage_info.date }
  
  **Marriage Location:** ${ marriage_info.location }
  
  **Separation Date:** ${ separation_date }
  
  **Grounds for Divorce:** ${ divorce_grounds.title() }
  
  **Next Steps:**
  1. Complete and file Form 8A with supporting documents
  2. Pay court filing fees (or apply for fee waiver)
  3. Serve your spouse with the application
  4. Complete additional forms if claiming support/property
  
  **Required Documents:**
  - Original marriage certificate or certified copy
  - Form 36 (Affidavit for Divorce) for uncontested cases
  - Financial statements if claiming support

